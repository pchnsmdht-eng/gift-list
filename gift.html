<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
        }
        /* 全体のサイズをW155 H600に固定して整列 */
        #scroll-container {
            position: absolute;
            top: 0;
            width: 155px; /* 指定の横幅 */
            display: flex;
            flex-direction: column; /* 縦一列に並べる */
            align-items: center;
            gap: 8px;
            padding: 5px;
            box-sizing: border-box;
        }
        /* 画像1個分の枠 */
        .gift-frame {
            width: 140px; /* 155pxの中で余裕を持たせた幅 */
            height: 140px; /* 縦横比を整える */
            overflow: hidden;
            border: 2px solid #ff0055;
            background: rgba(0,0,0,0.8);
            border-radius: 10px;
            position: relative;
            flex-shrink: 0; /* サイズを縮ませない */
        }
        /* 外部サイトの中身を枠内に収める */
        iframe {
            width: 400px; /* 元サイトが広いため、少し大きめに読み込んで中央を出す */
            height: 5000px;
            border: none;
            position: absolute;
            left: -130px; /* 画像が中央に来るように調整 */
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="scroll-container">
        <!-- 画像を10個分セット（必要に応じてiframeのtop位置を調整） -->
        <div class="gift-frame"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: 0px;"></iframe></div>
        <div class="gift-frame"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -150px;"></iframe></div>
        <div class="gift-frame"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -300px;"></iframe></div>
        <div class="gift-frame"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -450px;"></iframe></div>
        <div class="gift-frame"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -600px;"></iframe></div>
        <div class="gift-frame"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -750px;"></iframe></div>
        <div class="gift-frame"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -900px;"></iframe></div>
        <div class="gift-frame"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1050px;"></iframe></div>
    </div>

    <script>
        let pos = 0;
        let isPaused = false;
        const container = document.getElementById('scroll-container');

        function autoScroll() {
            if (!isPaused) {
                pos -= 1; // スライド速度
                container.style.top = pos + 'px';
                // 全て流れきったらループ（600px以上流れたら戻る）
                if (Math.abs(pos) > container.scrollHeight) {
                    pos = 600; 
                }
            }
            requestAnimationFrame(autoScroll);
        }

        // 触れたら止まる、離して3秒で再開
        window.addEventListener('mousedown', () => { isPaused = true; });
        window.addEventListener('mouseup', () => { setTimeout(() => { isPaused = false; }, 3000); });
        window.addEventListener('touchstart', () => { isPaused = true; });
        window.addEventListener('touchend', () => { setTimeout(() => { isPaused = false; }, 3000); });

        autoScroll();
    </script>
</body>
</html>
