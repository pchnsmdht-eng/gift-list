<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* ウィジェット枠にぴったり収めるためのCSS設定 */
        body { 
            margin: 0; 
            background: transparent; 
            overflow: hidden; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* 実際のデータ（3段分）が1ミリの無駄もなく収まる高さ（132px × 3段 = 396px） */
        #viewport { 
            width: 100vw; 
            height: 396px; 
            position: relative; 
            overflow: hidden; 
            pointer-events: auto !important;
        }
        
        #lane-container { 
            position: absolute; 
            display: flex; 
            flex-direction: column; /* 出力されている3つの行を縦に並べる */
            width: max-content; 
            top: 2px; 
            will-change: transform; 
            transform: translate3d(0, 0, 0); 
            pointer-events: none !important; 
        }

        /* 1つの段（行）。横に1122px（3枚分）のiframeが並ぶトラック */
        .row-track {
            display: flex;
            flex-direction: row;
            width: max-content;
            height: 132px;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* 成功事例の1マスのサイズを完全維持 */
        .gift-frame-wrapper { 
            width: 374px; 
            height: 132px; 
            position: relative; 
            overflow: hidden; 
            flex-shrink: 0;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        iframe { 
            position: absolute; 
            width: 400px; 
            height: 1500px; 
            border: none; 
            transform-origin: top left; 
        }

        /* 🖐️ 指でのスワイプやマウスを認識させるための透明な膜 */
        #touch-shield { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 9999; 
            background: rgba(0,0,0,0); 
            touch-action: none;
            pointer-events: auto !important;
            cursor: grab;
        }

        /* ✨【アイコンサイズ統一】文字まで綺麗によめる均一なサイズ（60px）に強制統一 */
        iframe { --gift-icon-size: 60px !important; }
        iframe[src*="streamtoearn"] img, 
        iframe[src*="streamtoearn"] .gift-icon, 
        iframe[src*="streamtoearn"] svg {
            width: 60px !important; 
            height: 60px !important; 
            object-fit: contain !important;
        }

        /* 成功事例のズレをピタッと直した抽出幅をそのまま適用 */
        .clip-iframe { top: 0; clip-path: inset(0px 5px 1368px 0px); }
    </style>
</head>
<body>
<div id="viewport">
    <div id="touch-shield"></div>
    <div id="lane-container">
        <div class="row-track" id="row-1"></div>
        <div class="row-track" id="row-2"></div>
        <div class="row-track" id="row-3"></div>
    </div>
</div>
<script>
    const USER = "pchnsmdht-eng", REPO = "gift-list";
    const FRAME_W = 374; // 1マスの横幅
    const COLUMNS_PER_ROW = 3; // 実データに合わせた1ラインのマス数（3列）
    const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    
    const container = document.getElementById('lane-container');
    const shield = document.getElementById('touch-shield');
    
    let posX = 0, speed = -1.0, isTouching = false, startX = 0;

    // リモコン（speed.txt）との同期（1秒ごと）
    async function syncSpeed() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/speed.txt?t=${Date.now()}`);
            const text = await res.text();
            const s = parseFloat(text.trim());
            if(!isNaN(s)) speed = s;
        } catch (e) {}
    }
    setInterval(syncSpeed, 1000);

    // ウィジェット上でのスワイプ・ドラッグ検知（成功事例を完全維持）
    const handleStart = (e) => {
        isTouching = true;
        startX = e.clientX - posX;
        shield.setPointerCapture(e.pointerId);
    };
    const handleMove = (e) => {
        if (!isTouching) return;
        posX = e.clientX - startX;
    };
    const handleEnd = () => { isTouching = false; };

    shield.addEventListener('pointerdown', handleStart);
    shield.addEventListener('pointermove', handleMove);
    shield.addEventListener('pointerup', handleEnd);
    shield.addEventListener('pointercancel', handleEnd);

    // 実在する1〜9番目のレーンを、重複させずに3本の行トラックへ正しく配置
    function init() {
        for (let r = 1; r <= 3; r++) {
            const track = document.getElementById(`row-${r}`);
            track.innerHTML = '';

            // スライドや追従がループした際に途切れないよう、横に4枚分（4ループ）連結
            for (let loop = 0; loop < 4; loop++) {
                for (let c = 1; c <= COLUMNS_PER_ROW; c++) {
                    // 正確なレーン番号の割り当て計算（1行目:1~3、2行目:4~6、3行目:7~9）
                    const laneNumber = ((r - 1) * COLUMNS_PER_ROW) + c;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'gift-frame-wrapper';

                    const iframe = document.createElement('iframe');
                    iframe.src = `${SRC}?lane=${laneNumber}`;
                    iframe.className = 'clip-iframe';

                    wrapper.appendChild(iframe);
                    track.appendChild(wrapper);
                }
            }
        }
    }

    // 無限ループ追従アニメーション（すべての行を同じ速度で一斉に横スクロール）
    function animate() {
        if (!isTouching) {
            posX += speed;
        }
        
        const maxTrackW = FRAME_W * COLUMNS_PER_ROW; // 3個分の総横幅 = 1122px

        // 端まで流れたら滑らかに先頭へループ
        if (posX <= -maxTrackW) posX += maxTrackW;
        else if (posX >= 0) posX -= maxTrackW;
        
        const tracks = document.querySelectorAll('.row-track');
        tracks.forEach(t => { 
            t.style.transform = `translate3d(${posX}px, 0, 0)`; 
        });

        requestAnimationFrame(animate);
    }

    init(); syncSpeed(); animate();
</script>
</body>
</html>
