<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none;
        }
        /* 1. 枠は固定（画像より一回り大きく設定） */
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background: transparent;
        }
        /* 2. 画像だけが移動するコンテナ */
        #scroll-container {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%); /* 画面中央に配置 */
            display: flex; 
            flex-direction: row; 
            gap: 20px; /* 横のゆとり */
            padding: 40px; /* 枠の中で画像が動くためのマージン */
            cursor: grab;
            touch-action: pan-x;
        }
        /* 縦6段のユニット */
        .column-unit {
            display: flex;
            flex-direction: column;
            gap: 15px; /* 縦のゆとり */
            flex-shrink: 0;
        }
        /* 各画像の表示窓（枠なし） */
        .gift-item {
            width: 140px; 
            height: 140px; 
            overflow: hidden;
            background: transparent;
            border: none;
            position: relative;
            pointer-events: none; /* リスナーのタッチを親コンテナで拾う */
        }
        iframe {
            width: 500px;
            height: 8000px;
            border: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scale(1.1);
            transform-origin: top;
        }
    </style>
</head>
<body>

<div id="viewport">
    <!-- リスナーはこのコンテナを掴んで中の画像だけを動かします -->
    <div id="scroll-container">
        <!-- 1~5列（合計30枚）を生成 -->
        <script>
            const container = document.getElementById('scroll-container');
            const url = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
            let giftCount = 0;

            for (let i = 0; i < 5; i++) {
                let col = document.createElement('div');
                col.className = 'column-unit';
                for (let j = 0; j < 6; j++) {
                    let item = document.createElement('div');
                    item.className = 'gift-item';
                    // 155px刻みでサイト内の画像を抽出
                    let topOffset = giftCount * -155;
                    item.innerHTML = `<iframe src="${url}" style="top: ${topOffset}px;"></iframe>`;
                    col.appendChild(item);
                    giftCount++;
                }
                container.appendChild(col);
            }
        </script>
    </div>
</div>

<script>
    const scrollContainer = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer, startX, initialPos;

    // 自動横ループ
    function step() {
        if (!isPaused) {
            pos -= 0.8; 
            // すべて左に流れきったら右から再登場（無限ループ）
            if (Math.abs(pos) > scrollContainer.scrollWidth) {
                pos = window.innerWidth;
            }
            scrollContainer.style.left = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    // リスナーが画像を掴んでスライドするUI
    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        // 開始位置を記録
        startX = e.touches ? e.touches[0].pageX : e.pageX;
        initialPos = pos;
        
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        if (!isPaused) return;
        const currentX = e.touches ? e.touches[0].pageX : e.pageX;
        const walk = currentX - startX;
        pos = initialPos + walk;
        scrollContainer.style.left = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        // 手を離してから3秒後に自動スライドをその位置から再開
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    // 掴む操作の登録
    scrollContainer.addEventListener('mousedown', onStart);
    scrollContainer.addEventListener('touchstart', onStart, {passive: false});

    requestAnimationFrame(step);
</script>
</body>
</html>
