<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        #viewport { width: 1870px; height: 400px; position: relative; overflow: hidden; }
        #lane-container { display: flex; flex-direction: row; width: max-content; transition: transform 0.1s linear; }
        .lane { width: 1122px; height: 132px; overflow: hidden; position: relative; }
        iframe { width: 1200px; height: 4000px; border: none; transform-origin: top left; }
    </style>
</head>
<body>
    <div id="viewport"><div id="lane-container"></div></div>
    <script>
        const USER = "pchnsmdht-eng", REPO = "gift-list";
        // 指定のURLを配置
        const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
        const container = document.getElementById('lane-container');
        let currentSpeed = 0;
        let position = 0;

        async function init() {
            container.innerHTML = '';
            for (let n = 1; n <= 15; n++) {
                const l = document.createElement('div');
                l.className = 'lane';
                const f = document.createElement('iframe');
                f.src = `${SRC}?lane=${n}`;
                const topPx = (n - 1) * 132;
                f.style.clipPath = `inset(${topPx}px 5px ${4000 - (topPx + 132)}px 0px)`;
                f.style.transform = `translate3d(0, -${topPx}px, 0)`;
                l.appendChild(f);
                container.appendChild(l);
            }
        }

        async function sync() {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/speed.txt?t=${Date.now()}`);
                const text = await res.text();
                currentSpeed = parseFloat(text.split(',')[0]) || 0;
            } catch(e) {}
        }

        function animate() {
            position += currentSpeed;
            container.style.transform = `translateX(${position}px)`;
            requestAnimationFrame(animate);
        }

        init();
        setInterval(sync, 1000);
        animate();
    </script>
</body>
</html>
