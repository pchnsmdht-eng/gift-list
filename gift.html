<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; background: transparent !important; user-select: none; }
        
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #scroll-container {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: row;
            gap: 0;
            cursor: grab;
            touch-action: pan-x;
            will-change: transform;
        }

        .column-unit {
            display: flex;
            flex-direction: column;
            gap: 0;
            flex-shrink: 0;
        }

        .gift-item {
            width: 150px; 
            height: 150px; 
            overflow: hidden;
            position: relative;
            border: none !important;
            background: transparent;
        }

        .content-frame {
            position: absolute;
            width: 500px;
            height: 10000px;
            border: none;
            pointer-events: none;
            left: 50%;
            /* 縮尺を少し下げて、画像全体が枠に収まるように調整 */
            transform: translateX(-50%) scale(0.95);
            transform-origin: top;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <div id="content-a" style="display: flex;"></div>
        <div id="content-b" style="display: flex;"></div>
    </div>
</div>

<script>
    const contentA = document.getElementById('content-a');
    const contentB = document.getElementById('content-b');
    const container = document.getElementById('scroll-container');
    const url = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";

    function build(target) {
        let frag = document.createDocumentFragment();
        // 最初の画像の開始位置を少し下げて、ヘッダー等のズレを吸収
        const startOffset = -10; 
        // 1枚あたりの移動距離（ここを微調整するとズレが直ります）
        const stepY = -158; 

        let count = 0;
        for (let i = 0; i < 5; i++) {
            let col = document.createElement('div');
            col.className = 'column-unit';
            for (let j = 0; j < 6; j++) {
                let item = document.createElement('div');
                item.className = 'gift-item';
                
                let frame = document.createElement('iframe');
                frame.src = url;
                frame.className = 'content-frame';
                
                // 計算式：開始位置 + (通し番号 * 1枚の高さ)
                frame.style.top = `${startOffset + (count * stepY)}px`;
                
                item.appendChild(frame);
                col.appendChild(item);
                count++;
            }
            frag.appendChild(col);
        }
        target.appendChild(frag);
    }

    build(contentA);
    build(contentB);

    let pos = 0;
    let isPaused = false;
    let resumeTimer, startX, initialPos;

    function move() {
        if (!isPaused) {
            pos -= 1.2;
            const halfWidth = contentA.offsetWidth;
            if (Math.abs(pos) >= halfWidth) pos = 0;
            container.style.transform = `translate3d(${pos}px, -50%, 0)`;
        }
        requestAnimationFrame(move);
    }

    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startX = e.touches ? e.touches[0].pageX : e.pageX;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        const currentX = e.touches ? e.touches[0].pageX : e.pageX;
        pos = initialPos + (currentX - startX);
        const halfWidth = contentA.offsetWidth;
        if (pos > 0) pos = -halfWidth;
        if (Math.abs(pos) >= halfWidth) pos = 0;
        container.style.transform = `translate3d(${pos}px, -50%, 0)`;
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});
    requestAnimationFrame(move);
</script>
</body>
</html>
