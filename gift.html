<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* ウィジェット枠にぴったり収めるためのCSS設定 */
        body { 
            margin: 0; 
            background: transparent; 
            overflow: hidden; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* 4段分（528px）が綺麗に収まる高さ */
        #viewport { 
            width: 100vw; 
            height: 530px; 
            position: relative; 
            overflow: hidden; 
            pointer-events: auto !important;
        }
        
        /* 横7個 × 縦4段分の巨大なギフトシートをそのまま動かすコンテナ */
        #lane-container { 
            position: absolute; 
            display: flex; 
            flex-direction: row; 
            width: max-content; 
            top: 2px; 
            will-change: transform; 
            transform: translate3d(0, 0, 0); 
            pointer-events: none !important; 
        }

        /* ギフトが横に7個並んだ巨大な1ブロックのエリア（374px × 7列 = 2618px幅） */
        .gift-block-wrapper { 
            width: 2618px; 
            height: 528px; 
            position: relative; 
            overflow: hidden; 
            flex-shrink: 0;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* iframe自体を「横7列×縦4段」が丸ごと収まる巨大なサイズで展開 */
        iframe { 
            position: absolute; 
            width: 2800px; 
            height: 1500px; 
            border: none; 
            transform-origin: top left; 
        }

        /* 指でのスワイプやマウスを認識させるための透明な膜 */
        #touch-shield { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 9999; 
            background: rgba(0,0,0,0); 
            touch-action: none;
            pointer-events: auto !important;
            cursor: grab;
        }

        /* ✨【アイコンサイズ統一】文字まで綺麗によめる均一なサイズ（60px） */
        iframe { --gift-icon-size: 60px !important; }
        iframe[src*="streamtoearn"] img, 
        iframe[src*="streamtoearn"] .gift-icon, 
        iframe[src*="streamtoearn"] svg {
            width: 60px !important; 
            height: 60px !important; 
            object-fit: contain !important;
        }

        /* 横7個・縦4段分のエリアを1ミリのズレもなく完全抽出 */
        .clip-iframe { top: 0; clip-path: inset(0px 5px 972px 0px); }
    </style>
</head>
<body>
<div id="viewport">
    <div id="touch-shield"></div>
    <div id="lane-container"></div>
</div>
<script>
    const USER = "pchnsmdht-eng", REPO = "gift-list";
    const BLOCK_W = 2618; // 横7個分の総横幅 (374px × 7)
    const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    
    const container = document.getElementById('lane-container');
    const shield = document.getElementById('touch-shield');
    
    let posX = 0, speed = -1.0, isTouching = false, startX = 0;

    // リモコン（speed.txt）との同期
    async function syncSpeed() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/speed.txt?t=${Date.now()}`);
            const text = await res.text();
            const s = parseFloat(text.trim());
            if(!isNaN(s)) speed = s;
        } catch (e) {}
    }
    setInterval(syncSpeed, 1000);

    // スワイプ・ドラッグ検知（成功事例の快適な操作を完全維持）
    const handleStart = (e) => {
        isTouching = true;
        startX = e.clientX - posX;
        shield.setPointerCapture(e.pointerId);
    };
    const handleMove = (e) => {
        if (!isTouching) return;
        posX = e.clientX - startX;
    };
    const handleEnd = () => { isTouching = false; };

    shield.addEventListener('pointerdown', handleStart);
    shield.addEventListener('pointermove', handleMove);
    shield.addEventListener('pointerup', handleEnd);
    shield.addEventListener('pointercancel', handleEnd);

    // システム側で「横7個で折り返して4段」に出力されているシートを、途切れないように横に3枚連結する
    function init() {
        container.innerHTML = '';
        
        // ループスクロールが途切れないよう、3つ並べる
        for (let loop = 0; loop < 3; loop++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'gift-block-wrapper';

            const iframe = document.createElement('iframe');
            // lane=1 から読み込むことで、URL側の「横7個で折り返す自動配置」をそのまま100%綺麗に表示させます
            iframe.src = `${SRC}?lane=1`;
            iframe.className = 'clip-iframe';

            wrapper.appendChild(iframe);
            container.appendChild(wrapper);
        }
    }

    // 無限ループアニメーション（7個×4段のシートが丸ごと追従して流れる）
    function animate() {
        if (!isTouching) {
            posX += speed;
        }

        // 1つの巨大ブロック（横7個分）が流れたら先頭へ滑らかにループ
        if (posX <= -BLOCK_W) posX += BLOCK_W;
        else if (posX >= 0) posX -= BLOCK_W;
        
        container.style.transform = `translate3d(${posX}px, 0, 0)`;
        requestAnimationFrame(animate);
    }

    init(); syncSpeed(); animate();
</script>
</body>
</html>
