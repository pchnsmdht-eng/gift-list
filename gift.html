<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none;
        }
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* 横方向に並べるためのコンテナ */
        #scroll-container {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            display: flex; /* 横並びにする */
            flex-direction: row; 
            gap: 15px; /* 横の隙間 */
            padding: 10px;
            cursor: grab;
            touch-action: pan-x; /* 横方向のタッチ操作を優先 */
        }
        /* 縦に3つ画像を並べる列ユニット */
        .column-unit {
            display: flex;
            flex-direction: column; /* ユニット内は縦に3つ */
            gap: 10px; /* 縦の隙間 */
            flex-shrink: 0;
        }
        /* 画像1個ずつの窓（枠なし） */
        .gift-item {
            width: 140px; /* 画像の幅 */
            height: 140px; /* 画像の高さ */
            overflow: hidden;
            background: transparent;
            border: none;
            position: relative;
            pointer-events: none;
        }
        /* 中身のサイトを拡大して画像を狙い撃ち */
        iframe {
            width: 500px;
            height: 5000px;
            border: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scale(1.1);
            transform-origin: top;
            filter: none;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- 1列目（縦に3つ） -->
        <div class="column-unit">
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: 0px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -150px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -300px;"></iframe></div>
        </div>
        <!-- 2列目（縦に3つ） -->
        <div class="column-unit">
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -450px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -600px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -750px;"></iframe></div>
        </div>
        <!-- 3列目（縦に3つ） -->
        <div class="column-unit">
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -900px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1050px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1200px;"></iframe></div>
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer, startX, initialPos;

    // 自動スライド（横方向: leftを動かす）
    function step() {
        if (!isPaused) {
            pos -= 1.0; // 横移動の速度
            // 全て右へ流れきったら左端に戻すループ
            if (Math.abs(pos) > container.scrollWidth) {
                pos = window.innerWidth;
            }
            container.style.left = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    // 横方向の手動スライドUI
    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startX = e.touches ? e.touches[0].pageX : e.pageX;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        if (!isPaused) return;
        const currentX = e.touches ? e.touches[0].pageX : e.pageX;
        pos = initialPos + (currentX - startX);
        container.style.left = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        // 3秒後に自動横スライドを再開
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});

    requestAnimationFrame(step);
</script>
</body>
</html>
