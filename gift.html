<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    
    #master-container {
        width: 100%;
        height: 100%;
        transform-origin: top left;
        will-change: transform;
    }

    /* 横に流れる1本道（トラック） */
    .marquee-track {
        display: flex;
        width: 200vw; /* 継ぎ目をなくすため画面2つ分の幅 */
        will-change: transform;
    }

    /* 不要な余白を切り取るための窓（クリッピング枠） */
    .iframe-wrapper {
        width: 100vw;
        height: 100vh; /* 初期値。後でコントローラーから切り取られます */
        overflow: hidden; /* 枠からはみ出た部分（下の余白）を消去 */
        position: relative;
    }

    /* 外部サイトの読み込み */
    iframe {
        width: 100vw;
        height: 100vh;
        border: none;
        pointer-events: none;
        position: absolute;
        top: 0;
        left: 0;
    }

    .hardware-accel {
        backface-visibility: hidden;
        perspective: 1000px;
        transform: translateZ(0);
    }

    /* 画面1つ分をスライドして0秒で元に戻る（無限ループ） */
    @keyframes slideRight {
        0% { transform: translate3d(-100vw, 0, 0); }
        100% { transform: translate3d(0, 0, 0); }
    }

    @keyframes slideLeft {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-100vw, 0, 0); }
    }
</style>
</head>
<body>
    <div id="master-container">
        <div class="marquee-track" id="track">
            <div class="iframe-wrapper"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe></div>
            <div class="iframe-wrapper"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = {
          apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc",
          authDomain: "gift-list-app-53ef2.firebaseapp.com",
          projectId: "gift-list-app-53ef2",
          storageBucket: "gift-list-app-53ef2.firebasestorage.app",
          messagingSenderId: "161949465085",
          appId: "1:161949465085:web:3574bdee443e4fcec70194",
          measurementId: "G-B3PJELG3Q9"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const masterContainer = document.getElementById('master-container');
        const track = document.getElementById('track');
        const wrappers = document.querySelectorAll('.iframe-wrapper');

        onValue(ref(db, 'settings'), (snapshot) => {
            const data = snapshot.val() || {};
            const speed = data.speed || 0;
            const size = data.size || 1.0;
            const optimize = data.optimize || false;
            const crop = data.crop || 100; // 高さの切り取り率

            // 1. サイズ調整
            masterContainer.style.transform = `scale(${size})`;

            // 2. 下の余白のトリミング（切り取り）
            wrappers.forEach(w => {
                w.style.height = `${crop}vh`;
            });

            // 3. ラグ軽減処理
            if(optimize) {
                track.classList.add('hardware-accel');
            } else {
                track.classList.remove('hardware-accel');
            }

            // 4. 無限スクロールアニメーション
            if (speed === 0) {
                track.style.animation = 'none';
            } else {
                const duration = 50 / Math.abs(speed);
                const direction = speed > 0 ? 'slideRight' : 'slideLeft';
                track.style.animation = `${direction} ${duration}s linear infinite`;
            }

            if (data.pingRequest) {
                set(ref(db, 'pingResponse'), { 
                    time: data.pingRequest,
                    echoSpeed: speed,
                    echoSize: size,
                    echoOpt: optimize,
                    echoCrop: crop
                });
            }
        });
    </script>
</body>
</html>
