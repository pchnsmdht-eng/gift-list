<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    
    #track {
        display: flex;
        width: 8000px;
        /* アニメーションをここから直接実行 */
        animation: slide 20s linear infinite;
    }

    /* H698の枠に合わせる調整 */
    .iframe-wrapper {
        width: 4000px;
        height: 698px;
        overflow: hidden;
        position: relative;
    }

    iframe {
        width: 4000px;
        height: 1200px;
        border: none;
        pointer-events: none;
    }

    @keyframes slide {
        0% { transform: translateX(0); }
        100% { transform: translateX(-4000px); }
    }
</style>
</head>
<body>
    <div id="track">
        <div class="iframe-wrapper"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe></div>
        <div class="iframe-wrapper"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe></div>
    </div>
</body>
</html>
