<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            margin: 0; 
            padding: 0; 
            background: transparent !important; 
        }
        
        /* コンテナのサイズを中身に合わせて自動調整 */
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow-y: auto; /* 縦に長く表示されるためスクロール可能に設定 */
        }

        /* 指定URLをそのまま表示する枠 */
        .full-content {
            width: 100%;
            /* 50個以上のアイテムが表示されるよう、十分な高さを指定 */
            height: 15000px; 
            border: none;
        }
    </style>
</head>
<body>

<div id="viewport">
    <!-- 余計なスクリプトによる分割をせず、このまま表示させます -->
    <iframe class="full-content" src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
</div>

</body>
</html>
