<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        /* 縦390px（130x3）の固定枠 */
        #viewport {
            width: 100vw;
            height: 390px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        /* 3つのブロックを横に並べる */
        #scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 390px;
            will-change: transform;
            left: 0;
        }

        .block {
            display: flex;
            flex-direction: column;
            width: 1200px;
            height: 390px;
            flex-shrink: 0;
        }

        .lane {
            width: 1200px;
            height: 130px;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1200px;
            border: none;
            pointer-events: none;
            transform-origin: 0 0;
        }

        /* --- 抜き出し座標 --- */
        .r1 { top: 0; clip-path: inset(0px 0px 1070px 0px); }
        .r2 { top: 0; clip-path: inset(130px 0px 940px 0px); transform: translateY(-130px); }
        .r3 { top: 0; clip-path: inset(260px 0px 810px 0px); transform: translateY(-260px); }
        .r4 { top: 0; clip-path: inset(390px 0px 680px 0px); transform: translateY(-390px); }
        .r5 { top: 0; clip-path: inset(520px 0px 550px 0px); transform: translateY(-520px); }
        .r6 { top: 0; clip-path: inset(650px 0px 420px 0px); transform: translateY(-650px); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroller"></div>
</div>

<script>
    const BASE_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 1200;
    const scroller = document.getElementById('scroller');

    function init() {
        scroller.innerHTML = '';
        
        // 3交代のセット：[上][中][下]
        const groups = [
            [1, 2, 3], // 1段目ユニット
            [4, 5, 6], // 2段目ユニット
            [1, 2, 3]  // 3段目（ループ接続用）
        ];

        // 余裕を持って2セット（計6ブロック）並べる
        for (let i = 0; i < 2; i++) {
            groups.forEach(rows => {
                const block = document.createElement('div');
                block.className = 'block';
                rows.forEach(n => {
                    const lane = document.createElement('div');
                    lane.className = 'lane';
                    const f = document.createElement('iframe');
                    // 徹底したキャッシュ対策
                    f.src = `${BASE_URL}?cache=${Date.now()}_${Math.random()}_r${n}`;
                    f.className = `r${n}`;
                    lane.appendChild(f);
                    block.appendChild(lane);
                });
                scroller.appendChild(block);
            });
        }
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.8; // 右から左へ流れる

    function animate() {
        if (!isDragging) {
            posX += speed;
            
            // 3ブロック分(3600px)進んだらリセット
            // ここを確実に通すことで3段目が飛ばされるのを防ぎます
            const resetPoint = -(W * 3);
            if (posX <= resetPoint) {
                posX += Math.abs(resetPoint);
            }
        }
        scroller.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    const vp = document.getElementById('viewport');
    vp.onmousedown = (e) => { isDragging = true; startX = e.pageX - posX; };
    window.onmousemove = (e) => { if (isDragging) posX = e.pageX - startX; };
    window.onmouseup = () => isDragging = false;

    // 5分おきにリフレッシュ
    setInterval(init, 300000);

    init();
    animate();
</script>
</body>
</html>
