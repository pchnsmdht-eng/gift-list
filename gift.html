<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { background-color: transparent; color: #FFFFFF; font-family: "Meiryo", sans-serif; overflow: hidden; margin: 0; padding: 0; }
        .container { width: 450px; height: 350px; position: relative; }
        .list-item { display: flex; align-items: center; height: 80px; margin-bottom: 15px; text-shadow: 2px 2px 4px #000; }
        .icon-img { width: 75px; height: 75px; object-fit: contain; margin-right: 20px; border-radius: 10px; }
        .text { font-size: 32px; font-weight: bold; white-space: nowrap; }
        .gift-name { color: #FF69B4; }
    </style>
</head>
<body>
    <div class="container" id="gift-list-container">読み込み中...</div>

    <script>
        const WIDGET_ID = "69d7b4d8e377b523a9c6a3aa"; 

        async function updateList() {
            try {
                // ここでStreamTEarnから50個分のデータを一気に取得します
                const response = await fetch(`https://app.streamtoearn.io/api/overlay/${WIDGET_ID}`);
                const data = await response.json();
                
                // 50個あるので、少し早めのスクロール（scrollamount="4"）に設定
                let html = '<marquee direction="up" scrollamount="4" style="height: 350px;">';
                
                data.events.forEach(event => {
                    if(event.enabled) {
                        html += `
                            <div class="list-item">
                                <img src="${event.image_url}" class="icon-img">
                                <span class="text"><span class="gift-name">${event.gift_name}</span> ＝ ${event.command_name}</span>
                            </div>`;
                    }
                });
                
                html += '</marquee>';
                document.getElementById('gift-list-container').innerHTML = html;
            } catch (e) {
                // エラーが出た場合も、画面が真っ白にならないようメッセージを表示
                document.getElementById('gift-list-container').innerHTML = "お品書きを準備中です...";
            }
        }

        updateList();
        // 5分（300000ミリ秒）ごとに最新の状態に更新します
        setInterval(updateList, 300000);
    </script>
</body>
</html>
