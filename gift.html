<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        /* 全体のサイズ：131pxの幅で、106pxが3段分（318px） */
        #main-container {
            display: flex;
            flex-direction: column; /* 縦に積み上げる */
            width: 100vw;
            height: 318px; 
        }

        /* 各段（レーン）の設定：ここが重ならない「枠」になります */
        .lane {
            width: 100vw;
            height: 106px; /* 1段の高さを固定 */
            position: relative;
            overflow: hidden;
            background: rgba(0,0,0,0.1); /* 枠の確認用（不要なら消してください） */
        }

        /* 横に流れるベルトコンベア */
        .scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 106px;
            will-change: transform;
        }

        /* 1つ1つのギフトの箱 */
        .gift-box {
            position: relative;
            width: 131px;
            height: 106px;
            flex-shrink: 0;
            overflow: hidden;
        }

        /* ページの中身：重ならないよう、各段ごとに「映す場所」だけを切り抜く */
        iframe {
            position: absolute;
            width: 1200px;
            height: 1200px;
            border: none;
            pointer-events: none;
            transform-origin: top left;
            transform: scale(0.85); /* アイコンの大きさ */
        }

        /* 段ごとの切り抜き（縦の座標を固定して重なりを防ぐ） */
        .pos-1 { top: 0; clip-path: inset(5px 1010px 900px 5px); }
        .pos-2 { top: 0; clip-path: inset(135px 1010px 770px 5px); transform: translateY(-135px) scale(0.85); }
        .pos-3 { top: 0; clip-path: inset(265px 1010px 640px 5px); transform: translateY(-265px) scale(0.85); }
    </style>
</head>
<body>

<div id="main-container">
    <div class="lane"><div class="scroller" id="row-1"></div></div>
    <div class="lane"><div class="scroller" id="row-2"></div></div>
    <div class="lane"><div class="scroller" id="row-3"></div></div>
</div>

<script>
    const TARGET_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const ITEM_W = 131;
    let posX = [0, 0, 0];
    let isDragging = false;
    let startMouseX = 0;

    // 各段にギフトを生成して並べる
    [1, 2, 3].forEach(n => {
        const row = document.getElementById(`row-${n}`);
        for (let i = 0; i < 20; i++) { 
            const box = document.createElement('div');
            box.className = 'gift-box';
            const f = document.createElement('iframe');
            f.src = TARGET_URL;
            f.className = `pos-${n}`;
            box.appendChild(f);
            row.appendChild(box);
        }
    });

    function animate() {
        if (!isDragging) {
            for (let i = 0; i < 3; i++) {
                posX[i] -= 1.5; // スピード
                if (posX[i] <= -ITEM_W) posX[i] += ITEM_W;
                document.getElementById(`row-${i+1}`).style.transform = `translateX(${posX[i]}px)`;
            }
        }
        requestAnimationFrame(animate);
    }

    // ドラッグ操作
    const container = document.getElementById('main-container');
    container.onmousedown = (e) => { isDragging = true; startMouseX = e.pageX; this.preX = [...posX]; };
    window.onmousemove = (e) => {
        if (!isDragging) return;
        const diff = e.pageX - startMouseX;
        for (let i = 0; i < 3; i++) {
            posX[i] = this.preX[i] + diff;
            document.getElementById(`row-${i+1}`).style.transform = `translateX(${posX[i]}px)`;
        }
    };
    window.onmouseup = () => isDragging = false;

    animate();
</script>
</body>
</html>
