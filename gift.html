<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        #viewport { width: 1122px; height: 240px; position: relative; overflow: hidden; }
        #lane-container { 
            display: flex; 
            flex-direction: row; 
            width: max-content; 
            will-change: transform; 
        }
        /* 5個x4段のグリッド配置 (60px * 5 = 300px幅) */
        .block { 
            display: grid; 
            grid-template-columns: repeat(5, 60px); 
            grid-template-rows: repeat(4, 60px); 
            width: 300px; 
            height: 240px; 
            flex-shrink: 0;
            margin: 0 !important;
            padding: 0 !important;
        }
        .lane { width: 60px; height: 60px; overflow: hidden; position: relative; }
        iframe { 
            width: 1200px; height: 4000px; border: none; 
            position: absolute; pointer-events: none;
        }
    </style>
</head>
<body>
<div id="viewport">
    <div id="lane-container"></div>
</div>
<script>
    const USER = "pchnsmdht-eng", REPO = "gift-list", SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const container = document.getElementById('lane-container');
    let posX = 0, speed = -1.0, currentGiftCount = 50;

    async function syncSpeed() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/speed.txt?t=${Date.now()}`);
            if (!res.ok) return;
            const text = await res.text();
            const parts = text.trim().split(',');
            speed = parseFloat(parts[0]) || -1.0;
            const count = parseInt(parts[1], 10) || 50;
            if (currentGiftCount !== count) {
                currentGiftCount = count;
                init();
            }
        } catch (e) {}
    }

    function init() {
        container.innerHTML = '';
        // 5x4 = 20個を1ブロックとして生成
        const blocks = Math.ceil(currentGiftCount / 20);
        for (let b = 0; b < blocks; b++) {
            const block = document.createElement('div');
            block.className = 'block';
            for (let i = 0; i < 20; i++) {
                const lane = document.createElement('div');
                lane.className = 'lane';
                const iframe = document.createElement('iframe');
                // Lane ID計算
                const n = (b * 20) + i + 1;
                iframe.src = `${SRC}?lane=${n}`;
                // 60pxずつのオフセットで表示（clip-pathやtransformで調整）
                const row = Math.floor(i / 5);
                const col = i % 5;
                iframe.style.left = `-${col * 60}px`;
                iframe.style.top = `-${row * 60}px`;
                lane.appendChild(iframe);
                block.appendChild(lane);
            }
            container.appendChild(block);
        }
    }

    function animate() {
        posX += speed;
        const totalW = container.scrollWidth / 2; // ループ用
        if (posX <= -totalW) posX = 0;
        else if (posX > 0) posX = -totalW;
        container.style.transform = `translate3d(${posX}px, 0, 0)`;
        requestAnimationFrame(animate);
    }

    setInterval(syncSpeed, 1000);
    init();
    animate();
</script>
</body>
</html>
