<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none;
        }
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* 横にスライドするコンテナ */
        #scroll-container {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: grid;
            /* 横に3列、縦に自動で並べる設定 */
            grid-template-columns: repeat(3, 150px); 
            grid-auto-flow: column; /* 要素を右へ右へ並べる */
            gap: 15px;
            padding: 20px;
            cursor: grab;
            touch-action: pan-x; /* 横方向のタッチを許可 */
        }
        /* 画像1個ずつの窓（枠なし） */
        .gift-item {
            width: 150px;
            height: 150px;
            overflow: hidden;
            background: transparent;
            border: none;
            position: relative;
            flex-shrink: 0;
            pointer-events: none;
        }
        /* 中身のサイトを拡大して画像を狙い撃ち */
        iframe {
            width: 600px;
            height: 5000px;
            border: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scale(1.2);
            transform-origin: top;
            filter: none;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- 
           画像を横に3列ずつ、縦の位置(top)を変えて配置。
           左から右へ「ずらずら」と並んでいきます。
        -->
        <!-- 1列目（3つ） -->
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -10px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -160px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -310px;"></iframe></div>
        
        <!-- 2列目（3つ） -->
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -460px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -610px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -760px;"></iframe></div>
        
        <!-- 3列目（3つ） -->
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -910px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1060px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1210px;"></iframe></div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer, startX, initialPos;

    // 自動スライド（横移動）
    function step() {
        if (!isPaused) {
            pos -= 0.8; // 速度
            // 右端まで行ったら左から戻るループ
            if (Math.abs(pos) > container.scrollWidth) {
                pos = window.innerWidth;
            }
            container.style.left = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    // 手動スライドUI（横方向）
    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startX = e.touches ? e.touches[0].pageX : e.pageX;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        const currentX = e.touches ? e.touches[0].pageX : e.pageX;
        pos = initialPos + (currentX - startX);
        container.style.left = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});
    requestAnimationFrame(step);
</script>
</body>
</html>
