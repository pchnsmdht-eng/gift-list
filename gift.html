<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none;
        }
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* スライドするメインコンテナ */
        #scroll-container {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: row;
            gap: 20px;
            padding: 20px;
            cursor: grab;
            touch-action: pan-x;
            /* 2セット分並べるため十分な幅を確保 */
            will-change: transform;
        }
        .column-unit {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
        }
        .gift-item {
            width: 140px; 
            height: 140px; 
            overflow: hidden;
            background: transparent;
            border: none;
            position: relative;
            pointer-events: none;
        }
        iframe {
            width: 450px;
            height: 5000px;
            border: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scale(1.0);
            transform-origin: top;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- 
          同じ内容（5列セット）を2つ物理的に並べることで、
          ループの継ぎ目での「消失」を物理的に防ぎます。
        -->
        <div id="content-a" style="display: flex; gap: 20px;">
            <!-- ここに5列分（30枚）が配置されます（JSで1回だけ生成） -->
        </div>
        <div id="content-b" style="display: flex; gap: 20px;">
            <!-- content-aのコピーがここに入ります -->
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    const contentA = document.getElementById('content-a');
    const contentB = document.getElementById('content-b');
    const url = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";

    // 縦6段×横5列を生成
    function buildUnits(target) {
        let giftIdx = 0;
        for (let i = 0; i < 5; i++) {
            let col = document.createElement('div');
            col.className = 'column-unit';
            for (let j = 0; j < 6; j++) {
                let item = document.createElement('div');
                item.className = 'gift-item';
                item.innerHTML = `<iframe src="${url}" style="top: ${giftIdx * -155}px;"></iframe>`;
                col.appendChild(item);
                giftIdx++;
            }
            target.appendChild(col);
        }
    }

    buildUnits(contentA);
    buildUnits(contentB);

    let pos = 0;
    let isPaused = false;
    let resumeTimer, startX, initialPos;

    function move() {
        if (!isPaused) {
            pos -= 0.8;
            // Aセット分（半分）進んだら、見た目を変えずに0へワープ（これで画像が消えない）
            const halfWidth = contentA.offsetWidth + 20; // 20はgap分
            if (Math.abs(pos) >= halfWidth) {
                pos = 0;
            }
            container.style.transform = `translate3d(${pos}px, -50%, 0)`;
        }
        requestAnimationFrame(move);
    }

    // 手動UIスライド
    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startX = e.touches ? e.touches[0].pageX : e.pageX;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        if (!isPaused) return;
        const currentX = e.touches ? e.touches[0].pageX : e.pageX;
        pos = initialPos + (currentX - startX);
        
        // 手動スライド中もループ範囲を維持
        const halfWidth = contentA.offsetWidth + 20;
        if (pos > 0) pos = -halfWidth;
        if (Math.abs(pos) >= halfWidth) pos = 0;

        container.style.transform = `translate3d(${pos}px, -50%, 0)`;
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});

    // 起動
    setTimeout(move, 1000); // 読み込み待ちで1秒遅延
</script>
</body>
</html>
