<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        #wrapper { width: 100vw; height: 106px; position: relative; cursor: grab; overflow: hidden; }
        
        /* 1本の長い帯として結合 */
        #scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 106px;
            will-change: transform;
        }

        .item-box {
            position: relative;
            width: 131px;
            height: 106px;
            flex-shrink: 0;
            margin: 0; /* 隙間を徹底排除 */
            padding: 0;
        }

        iframe {
            position: absolute;
            width: 131px;
            height: 212px; /* 106の2倍 */
            border: none;
            pointer-events: none;
        }

        /* --- 修正：1段目と2段目をシームレスに結合 --- */
        
        /* 上段（元の1段目）: 余計な余白をカット */
        .top-part {
            top: 0;
            clip-path: inset(1px 0 50% 0); /* 上下の1pxのゴミをカット */
        }

        /* 下段（元の2段目）: 1段目の真横に並ぶよう持ち上げる */
        .bottom-part {
            top: 0;
            clip-path: inset(50% 0 1px 0); 
            transform: translateY(-106px);
        }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="scroller"></div>
</div>

<script>
    const TARGET_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const scroller = document.getElementById('scroller');
    const wrapper = document.getElementById('wrapper');

    const ITEM_WIDTH = 131;

    // 10ペア（合計20枚）を生成して余裕を持たせる
    function init() {
        for (let i = 0; i < 10; i++) {
            // 上半分
            const boxT = document.createElement('div');
            boxT.className = 'item-box';
            const fT = document.createElement('iframe');
            fT.src = TARGET_URL;
            fT.className = 'top-part';
            boxT.appendChild(fT);
            scroller.appendChild(boxT);

            // 下半分
            const boxB = document.createElement('div');
            boxB.className = 'item-box';
            const fB = document.createElement('iframe');
            fB.src = TARGET_URL;
            fB.className = 'bottom-part';
            boxB.appendChild(fB);
            scroller.appendChild(boxB);
        }
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.5;

    function animate() {
        if (!isDragging) {
            posX += speed;
            
            // 重要：1ユニット(上+下=262px)分進んだら瞬時に戻す
            // これで「繋ぎ目」が消えます
            const unitWidth = ITEM_WIDTH * 2;
            if (posX <= -unitWidth) {
                posX += unitWidth;
            }
        }
        scroller.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    // ドラッグUI
    wrapper.addEventListener('mousedown', (e) => { isDragging = true; startX = e.pageX - posX; });
    window.addEventListener('mousemove', (e) => { if (isDragging) posX = e.pageX - startX; });
    window.addEventListener('mouseup', () => { isDragging = false; });

    init();
    animate();
</script>
</body>
</html>
