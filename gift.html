<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none; 
        }
        /* TikTok Studioの枠に合わせて自動で広がる */
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* 重複（ミラー）を消し、1枚のシートとして2列に並べる */
        #scroll-container {
            position: absolute;
            top: 0;
            width: 100%;
            /* 外部サイトの元のレイアウトを活かしつつ2列に強制 */
            display: block; 
            cursor: grab;
            touch-action: pan-y;
        }
        /* 外部サイトをそのまま1枚の「長い窓」として読み込む */
        #iframe-wrapper {
            width: 100%;
            height: 5000px; /* リスト全体の長さ */
            position: relative;
        }
        iframe {
            width: 200%; /* 2倍の幅で読み込んで、2列に見えるようにスケール調整 */
            height: 100%;
            border: none;
            position: absolute;
            left: 0;
            top: 0;
            /* 2列に見えるように倍率と位置を調整 */
            transform: scale(0.5); 
            transform-origin: top left;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <div id="iframe-wrapper">
            <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer;
    let startY, initialPos;

    // 自動スライド
    function step() {
        if (!isPaused) {
            pos -= 1; // 速度
            // 最後まで行ったらループ
            if (Math.abs(pos) > 2000) { // リストの長さに合わせて調整
                pos = window.innerHeight;
            }
            container.style.top = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    // スライド操作
    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startY = e.touches ? e.touches[0].pageY : e.pageY;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        const currentY = e.touches ? e.touches[0].pageY : e.pageY;
        pos = initialPos + (currentY - startY);
        container.style.top = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});

    requestAnimationFrame(step);
</script>
</body>
</html>
