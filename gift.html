<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        /* スマホ向けに縮小したビューポート */
        #viewport { width: 300px; height: 240px; overflow: hidden; position: relative; }
        #lane-container { display: flex; width: max-content; }
        
        /* 5列×4段のグリッド（合計20個） */
        .block { 
            display: grid; 
            grid-template-columns: repeat(5, 60px); 
            grid-template-rows: repeat(4, 60px); 
            width: 300px; 
            height: 240px; 
            flex-shrink: 0;
        }
        .lane { width: 60px; height: 60px; overflow: hidden; position: relative; }
        iframe { width: 60px; height: 60px; border: none; pointer-events: none; }
    </style>
</head>
<body>
    <div id="viewport"><div id="lane-container"></div></div>
    <script>
        // 設定値は維持
        const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
        const container = document.getElementById('lane-container');
        
        function init(count) {
            container.innerHTML = '';
            const blocks = Math.ceil(count / 20);
            for (let b = 0; b < blocks; b++) {
                const block = document.createElement('div');
                block.className = 'block';
                for (let i = 0; i < 20; i++) {
                    const lane = document.createElement('div');
                    lane.className = 'lane';
                    const iframe = document.createElement('iframe');
                    iframe.src = `${SRC}?lane=${(b * 20) + i + 1}`;
                    lane.appendChild(iframe);
                    block.appendChild(lane);
                }
                container.appendChild(block);
            }
        }
        // ...以下、syncSpeedとanimateは前回と同様...
    </script>
</body>
</html>
