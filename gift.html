<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: transparent; overflow: hidden; user-select: none; }
        
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 横に並べて手で動かすためのコンテナ */
        #scroll-container {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            gap: 0; /* 隙間をなくしてそのまま表示 */
            cursor: grab;
            touch-action: pan-x;
        }

        /* 
           iframeをそのまま読み込みます。
           中身を無理にカットしないので、表示が消えることはありません。
        */
        iframe {
            width: 400px; 
            height: 10000px; 
            border: none;
            flex-shrink: 0;
            pointer-events: none; /* ドラッグを優先 */
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- 
           中身をそのまま5つ並べます。
           あとは手で動かして好きな場所を表示してください。
        -->
        <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
        <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
        <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
        <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
        <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let isDragging = false;
    let startX = 0;
    let currentPos = 0;

    const onStart = (e) => {
        isDragging = true;
        startX = (e.pageX || e.touches[0].pageX) - currentPos;
    };

    const onMove = (e) => {
        if (!isDragging) return;
        currentPos = (e.pageX || e.touches[0].pageX) - startX;
        container.style.transform = `translateX(${currentPos}px)`;
    };

    const onEnd = () => { isDragging = false; };

    container.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    container.addEventListener('touchstart', onStart);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('touchend', onEnd);
</script>
</body>
</html>
