<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        /* 131x106の窓枠 */
        #wrapper { width: 100vw; height: 106px; position: relative; cursor: grab; overflow: hidden; }
        
        #scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 106px;
            will-change: transform;
        }

        .item-box {
            position: relative;
            width: 131px; /* 131px固定 */
            height: 106px; /* 106px固定 */
            flex-shrink: 0;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px; /* 元のサイト幅 */
            height: 800px; /* 元のサイト高 */
            border: none;
            pointer-events: none;
            transform-origin: 0 0;
            /* 🔴 アイコンがちょうど良い大きさになるよう倍率を固定(0.7程度) */
            transform: scale(0.73); 
        }

        /* --- 1段目と2段目を「窓」にピッタリはめる --- */
        
        .top-part {
            top: 0;
            left: 0;
            /* 🔴 上段のアイコン1つ分を切り抜く(数値は scale 0.73 に最適化) */
            clip-path: inset(0px 1018px 653px 0px); 
        }

        .bottom-part {
            top: 0;
            left: 0;
            /* 🔴 下段のアイコン1つ分を切り抜く */
            clip-path: inset(146px 1018px 507px 0px);
            /* 下段を上の枠まで持ち上げる */
            transform: translateY(-106px) scale(0.73);
        }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="scroller"></div>
</div>

<script>
    const TARGET_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const scroller = document.getElementById('scroller');
    const wrapper = document.getElementById('wrapper');

    const ITEM_WIDTH = 131;

    // 1段目と2段目を交互に並べる
    for (let i = 0; i < 10; i++) {
        const boxT = document.createElement('div'); boxT.className = 'item-box';
        const fT = document.createElement('iframe'); fT.src = TARGET_URL; fT.className = 'top-part';
        boxT.appendChild(fT); scroller.appendChild(boxT);

        const boxB = document.createElement('div'); boxB.className = 'item-box';
        const fB = document.createElement('iframe'); fB.src = TARGET_URL; fB.className = 'bottom-part';
        boxB.appendChild(fB); scroller.appendChild(boxB);
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.5;

    function animate() {
        if (!isDragging) {
            posX += speed;
            const unitWidth = ITEM_WIDTH * 2;
            if (posX <= -unitWidth) posX += unitWidth;
        }
        scroller.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    wrapper.addEventListener('mousedown', (e) => { isDragging = true; startX = e.pageX - posX; });
    window.addEventListener('mousemove', (e) => { if (isDragging) posX = e.pageX - startX; });
    window.addEventListener('mouseup', () => isDragging = false);

    animate();
</script>
</body>
</html>
