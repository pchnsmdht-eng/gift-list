<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            overflow: hidden; 
            touch-action: none; 
            -webkit-overflow-scrolling: touch;
        }
        
        #viewport {
            width: 100vw;
            height: 396px; 
            position: relative;
            overflow: hidden;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* TikTok Studio内での干渉を防止 */
        }

        /* 🔴 操作を100%拾うための透明なカバー */
        #interaction-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* iframeより上に配置 */
            background: rgba(0,0,0,0); /* 透明 */
            cursor: grab;
        }

        #lane-container {
            position: absolute;
            display: flex;
            gap: 0;
            width: max-content;
            height: 393px;
            will-change: transform;
            left: 0;
            top: 3px;
            z-index: 1;
        }

        .block {
            display: flex;
            flex-direction: column;
            width: 1115px; 
            height: 393px;
            flex-shrink: 0;
            margin: 0;
            padding: 0;
            overflow: visible;
        }

        .lane {
            width: 1174px; 
            height: 131px;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1500px;
            border: none;
            pointer-events: none; /* iframe内のクリックを無視 */
        }

        .r1 { top: 0; clip-path: inset(0px 26px 1369px 0px); }
        .r2 { top: 0; clip-path: inset(131px 26px 1238px 0px); transform: translateY(-131px); }
        .r3 { top: 0; clip-path: inset(262px 26px 1107px 0px); transform: translateY(-262px); }
        .r4 { top: 0; clip-path: inset(393px 26px 976px 0px); transform: translateY(-393px); }
        .r5 { top: 0; clip-path: inset(524px 26px 845px 0px); transform: translateY(-524px); }
        .r6 { top: 0; clip-path: inset(655px 26px 714px 0px); transform: translateY(-655px); }
        .r7 { top: 0; clip-path: inset(786px 26px 583px 0px); transform: translateY(-786px); }
        .r8 { top: 0; clip-path: inset(917px 26px 452px 0px); transform: translateY(-917px); }
        .r9 { top: 0; clip-path: inset(1048px 26px 321px 0px); transform: translateY(-1048px); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="interaction-layer"></div>
    <div id="lane-container"></div>
</div>

<script>
    const URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 1115; 
    const container = document.getElementById('lane-container');
    const interLayer = document.getElementById('interaction-layer');

    const groups = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];

    function init() {
        container.innerHTML = '';
        for (let i = 0; i < 4; i++) {
            groups.forEach(rows => {
                const block = document.createElement('div');
                block.className = 'block';
                rows.forEach(n => {
                    const lane = document.createElement('div');
                    lane.className = 'lane';
                    const f = document.createElement('iframe');
                    f.src = `${URL}?lane=${n}&t=${Date.now()}_${i}_${n}`;
                    f.className = `r${n}`;
                    lane.appendChild(f);
                    block.appendChild(lane);
                });
                container.appendChild(block);
            });
        }
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.0; 

    // 🔴 interaction-layer に対してイベントを設定
    interLayer.addEventListener('pointerdown', (e) => {
        isDragging = true;
        startX = e.pageX - posX;
        interLayer.setPointerCapture(e.pointerId);
        interLayer.style.cursor = 'grabbing';
    });

    interLayer.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        posX = e.pageX - startX;
    });

    interLayer.addEventListener('pointerup', () => {
        isDragging = false;
        interLayer.style.cursor = 'grab';
    });

    interLayer.addEventListener('pointercancel', () => {
        isDragging = false;
    });

    function animate() {
        if (!isDragging) {
            posX += speed;
            const cycleWidth = W * 3; 
            if (posX <= -cycleWidth) {
                posX += cycleWidth;
            }
            if (posX > 0) {
                posX -= cycleWidth;
            }
        }
        container.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    init();
    animate();
</script>
</body>
</html>
