<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none; 
        }
        /* TikTok Studio側でリサイズされても、常に画面全体を使い切る設定 */
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* 2列整列コンテナ：枠の幅に合わせて自動で伸縮します */
        #scroll-container {
            position: absolute;
            top: 0;
            width: 100%;
            display: grid;
            /* 常に2列を維持し、隙間を自動調整 */
            grid-template-columns: repeat(2, 1fr); 
            gap: 8px;
            padding: 8px;
            box-sizing: border-box;
            cursor: grab;
            touch-action: pan-y;
        }
        /* 画像1枚分の枠：親の幅(50%)に合わせてレスポンシブに変化 */
        .gift-item {
            aspect-ratio: 1 / 1; /* 常に正方形を維持 */
            width: 100%;
            overflow: hidden;
            border: 2px solid #ff0055;
            background: rgba(0,0,0,0.8);
            border-radius: 8px;
            position: relative;
            pointer-events: none;
        }
        /* 外部サイトの埋め込み：枠のサイズに合わせて自動スケール */
        iframe {
            width: 400px;
            height: 4000px;
            border: none;
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%) scale(0.7); /* 中央寄せ＆縮小 */
            transform-origin: top;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- topの位置で表示する画像をずらします -->
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: 0px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -140px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -280px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -420px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -560px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -700px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -840px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -980px;"></iframe></div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer;
    let startY, initialPos;

    function step() {
        if (!isPaused) {
            pos -= 1;
            // コンテナの高さに合わせて自動ループ
            if (Math.abs(pos) > container.scrollHeight) {
                pos = window.innerHeight; 
            }
            container.style.top = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startY = e.touches ? e.touches[0].pageY : e.pageY;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        if (!isPaused) return;
        const currentY = e.touches ? e.touches[0].pageY : e.pageY;
        pos = initialPos + (currentY - startY);
        container.style.top = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});

    requestAnimationFrame(step);
</script>
</body>
</html>
