<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: transparent; overflow: hidden; }
        
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ドラッグで動かすコンテナ：自動移動のコードはすべて削除 */
        #scroll-container {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            gap: 10px;
            padding: 10px;
            cursor: grab;
            touch-action: pan-x;
            will-change: transform;
        }
        #scroll-container:active {
            cursor: grabbing;
        }

        .column {
            width: 150px; 
            height: 940px; 
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        iframe {
            width: 450px; 
            height: 12000px;
            border: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scale(1.02); 
            transform-origin: top;
            pointer-events: none;
        }

        .set {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- セットA -->
        <div class="set" id="set-a">
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -5px;"></iframe></div>
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -945px;"></iframe></div>
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1885px;"></iframe></div>
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -2825px;"></iframe></div>
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -3765px;"></iframe></div>
        </div>
        <!-- セットB（無限にドラッグできるように配置） -->
        <div class="set" id="set-b"></div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    const setA = document.getElementById('set-a');
    const setB = document.getElementById('set-b');

    setB.innerHTML = setA.innerHTML;

    let isDragging = false;
    let startX = 0;
    let currentPos = 0;

    const getResetPoint = () => setA.offsetWidth + 10;

    const onStart = (e) => {
        isDragging = true;
        // 現在の位置を基準にクリック位置を記録
        startX = (e.pageX || e.touches[0].pageX) - currentPos;
    };

    const onMove = (e) => {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();

        currentPos = (e.pageX || e.touches[0].pageX) - startX;

        // セットAの幅を超えたら位置を戻して、無限にスクロールしているように見せる
        const resetPoint = getResetPoint();
        if (currentPos > 0) {
            currentPos = -resetPoint;
            startX = (e.pageX || e.touches[0].pageX) - currentPos;
        } else if (Math.abs(currentPos) >= resetPoint) {
            currentPos = 0;
            startX = (e.pageX || e.touches[0].pageX) - currentPos;
        }

        container.style.transform = `translateX(${currentPos}px)`;
    };

    const onEnd = () => {
        isDragging = false;
    };

    // マウス操作
    container.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);

    // タッチ操作
    container.addEventListener('touchstart', onStart);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onEnd);
</script>
</body>
</html>
