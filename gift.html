<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    :root { --iframe-width: 1200px; --crop-width: 800px; --crop-height: 600px; --v-zoom: 1.0; }
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    #master-container { width: 100%; height: 100%; transform-origin: top left; transition: transform 0.2s; will-change: transform; }
    .marquee-track { display: flex; animation: slide 20s linear infinite; will-change: transform; }
    
    .iframe-wrapper { width: var(--crop-width); height: var(--crop-height); overflow: hidden; position: relative; contain: strict; flex-shrink: 0; }
    iframe { width: var(--iframe-width); height: 2000px; border: none; pointer-events: none; position: absolute; top: 0; left: 0; transition: opacity 0.8s ease-in-out; backface-visibility: hidden; transform: translateZ(0); zoom: var(--v-zoom); }
    .hidden-cache { opacity: 0; z-index: 1; } .visible-live { opacity: 1; z-index: 2; }
    @keyframes slide { 0% { transform: translateX(calc(var(--crop-width) * -1)); } 100% { transform: translateX(0px); } }

    #loading-panel { position: fixed; top: 20px; left: 20px; width: 350px; height: 40px; background: rgba(0, 0, 0, 0.8); border: 2px solid #00ffaa; border-radius: 8px; z-index: 99999; display: none; overflow: hidden; box-shadow: 0 0 15px rgba(0, 255, 170, 0.5); }
    #loading-bg { position: absolute; top: 0; left: 0; width: 0%; height: 100%; background: linear-gradient(90deg, #007744, #00ffaa); transition: width 0.3s ease-out; z-index: 1; }
    #loading-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; color: #ffffff; font-family: sans-serif; font-size: 16px; font-weight: bold; line-height: 40px; text-align: center; text-shadow: 1px 1px 3px #000; z-index: 2; }
</style>
</head>
<body>
    <div id="loading-panel"><div id="loading-bg"></div><div id="loading-text">🔄 準備中...</div></div>
    <div id="master-container"><div class="marquee-track" id="track">
        <div class="iframe-wrapper" id="wrap1"><iframe class="visible-live"></iframe><iframe class="hidden-cache"></iframe></div>
        <div class="iframe-wrapper" id="wrap2"><iframe class="visible-live"></iframe><iframe class="hidden-cache"></iframe></div>
        <div class="iframe-wrapper" id="wrap3"><iframe class="visible-live"></iframe><iframe class="hidden-cache"></iframe></div>
        <div class="iframe-wrapper" id="wrap4"><iframe class="visible-live"></iframe><iframe class="hidden-cache"></iframe></div>
        <div class="iframe-wrapper" id="wrap5"><iframe class="visible-live"></iframe><iframe class="hidden-cache"></iframe></div>
        <div class="iframe-wrapper" id="wrap6"><iframe class="visible-live"></iframe><iframe class="hidden-cache"></iframe></div>
        <div class="iframe-wrapper" id="wrap7"><iframe class="visible-live"></iframe><iframe class="hidden-cache"></iframe></div>
        <div class="iframe-wrapper" id="wrap8"><iframe class="visible-live"></iframe><iframe class="hidden-cache"></iframe></div>
    </div></div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        const app = initializeApp({ apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc", authDomain: "gift-list-app-53ef2.firebaseapp.com", projectId: "gift-list-app-53ef2", storageBucket: "gift-list-app-53ef2.firebasestorage.app", messagingSenderId: "161949465085", appId: "1:161949465085:web:3574bdee443e4fcec70194", measurementId: "G-B3PJELG3Q9" });
        const db = getDatabase(app);
        
        const container = document.getElementById('master-container');
        const track = document.getElementById('track');
        const loadingPanel = document.getElementById('loading-panel');
        const loadingBg = document.getElementById('loading-bg');
        const loadingText = document.getElementById('loading-text');
        let reloadTimer;
        const baseUrl = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
        const totalBlocks = 8; // 無限ループを支える8ブロック

        onValue(ref(db, 'settings'), (snapshot) => {
            const data = snapshot.val() || {};
            
            document.documentElement.style.setProperty('--v-zoom', data.vZoom || 1.0);
            document.documentElement.style.setProperty('--iframe-width', `${data.iframeWidth || 1200}px`);
            document.documentElement.style.setProperty('--crop-width', `${data.cropWidth || 800}px`);
            document.documentElement.style.setProperty('--crop-height', `${data.cropHeight || 600}px`);

            track.style.width = ((data.cropWidth || 800) * totalBlocks) + 'px';
            if(data.displayScale !== undefined) container.style.transform = `scale(${data.displayScale})`;

            if(data.optimize !== undefined) {
                container.style.willChange = data.optimize ? 'transform' : 'auto';
                track.style.willChange = data.optimize ? 'transform' : 'auto';
            }
            if(data.speed !== undefined) {
                track.style.animation = data.speed === 0 ? 'none' : `slide ${30/Math.abs(data.speed)}s linear infinite`;
                track.style.animationDirection = data.speed > 0 ? 'reverse' : 'normal';
            }
            
            if(data.refreshMs) {
                if(reloadTimer) clearInterval(reloadTimer);
                
                const triggerUpdate = () => {
                    const hiddens = [], visibles = [];
                    for(let i=1; i<=totalBlocks; i++) {
                        const h = document.querySelector(`#wrap${i} .hidden-cache`);
                        const v = document.querySelector(`#wrap${i} .visible-live`);
                        if(h && v) { hiddens.push(h); visibles.push(v); }
                    }
                    if(hiddens.length === 0) return;

                    loadingPanel.style.display = 'block';
                    loadingBg.style.transition = 'width 0.3s ease-out';
                    loadingBg.style.width = '5%'; 
                    loadingText.innerText = '🔄 データ受信中... 5%';

                    let loadedCount = 0;
                    
                    const trySwap = () => {
                        loadedCount++;
                        const progress = 5 + (loadedCount / totalBlocks) * 45;
                        loadingBg.style.width = progress + '%';
                        loadingText.innerText = `🔄 データ受信中... ${Math.floor(progress)}%`;

                        if (loadedCount === totalBlocks) {
                            loadingBg.style.transition = 'width 4s linear';
                            loadingBg.style.width = '100%';
                            loadingText.innerText = '✨ 描画構築中... まもなく更新';

                            setTimeout(() => {
                                for(let i=0; i<totalBlocks; i++) {
                                    hiddens[i].className = 'visible-live';
                                    visibles[i].className = 'hidden-cache';
                                    hiddens[i].onload = null;
                                }
                                loadingPanel.style.display = 'none';
                                loadingBg.style.width = '0%';
                            }, 4000); 
                        }
                    };

                    const timestamp = Date.now();
                    for(let i=0; i<totalBlocks; i++) {
                        hiddens[i].onload = trySwap;
                        // 通信のパンクを防ぐため、0.5秒ずつズラして順番にダウンロードさせます
                        setTimeout(() => { hiddens[i].src = `${baseUrl}?t=${timestamp}`; }, i * 500);
                    }
                };

                triggerUpdate();
                reloadTimer = setInterval(triggerUpdate, data.refreshMs);
            }
            
            if (data.pingRequest) set(ref(db, 'pingResponse'), { time: data.pingRequest, status: "OK" });
        });
    </script>
</body>
</html>
