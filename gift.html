<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        /* 131px * 3段 + 上部3px = 396px */
        #viewport {
            width: 100vw;
            height: 396px; 
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        #lane-container {
            position: absolute;
            display: flex;
            gap: 0;
            width: max-content;
            height: 393px;
            will-change: transform;
            left: 0;
            top: 3px; 
        }

        .block {
            display: flex;
            flex-direction: column;
            /* 🔴 黒い帯を完全に消し去るため、幅を240pxまで極限に絞る */
            width: 240px; 
            height: 393px;
            flex-shrink: 0;
            margin: 0;
            padding: 0;
        }

        .lane {
            width: 240px;
            height: 131px;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1500px;
            border: none;
            pointer-events: none;
            /* 🔴 ボタンの芯（中心）だけを捉えるために左に大きく寄せる */
            left: -480px; 
        }

        /* 🔴 左右を480pxずつ豪快にカット。黒い帯は画面の外に消えます */
        .r1 { top: 0; clip-path: inset(0px 480px 1369px 480px); }
        .r2 { top: 0; clip-path: inset(131px 480px 1238px 480px); transform: translateY(-131px); }
        .r3 { top: 0; clip-path: inset(262px 480px 1107px 480px); transform: translateY(-262px); }
        
        .r4 { top: 0; clip-path: inset(393px 480px 976px 480px); transform: translateY(-393px); }
        .r5 { top: 0; clip-path: inset(524px 480px 845px 480px); transform: translateY(-524px); }
        .r6 { top: 0; clip-path: inset(655px 480px 714px 480px); transform: translateY(-655px); }
        
        .r7 { top: 0; clip-path: inset(786px 480px 583px 480px); transform: translateY(-786px); }
        .r8 { top: 0; clip-path: inset(917px 480px 452px 480px); transform: translateY(-917px); }
        .r9 { top: 0; clip-path: inset(1048px 480px 321px 480px); transform: translateY(-1048px); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="lane-container"></div>
</div>

<script>
    const BASE_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 240; // 🔴 1ブロックの幅を240pxに（ボタンが隙間なく並ぶ幅）
    const container = document.getElementById('lane-container');

    const groups = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];

    function init() {
        container.innerHTML = '';
        for (let i = 0; i < 2; i++) {
            groups.forEach(rows => {
                const block = document.createElement('div');
                block.className = 'block';
                rows.forEach(n => {
                    const lane = document.createElement('div');
                    lane.className = 'lane';
                    const f = document.createElement('iframe');
                    f.src = `${BASE_URL}?lane=${n}&t=${Date.now()}_${Math.random()}`;
                    f.className = `r${n}`;
                    lane.appendChild(f);
                    block.appendChild(lane);
                });
                container.appendChild(block);
            });
        }
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.8; 

    function animate() {
        if (!isDragging) {
            posX += speed;
            const cycleWidth = W * 3; // 240px * 3セット
            if (posX <= -cycleWidth) {
                posX += cycleWidth;
            }
        }
        container.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    const vp = document.getElementById('viewport');
    vp.onmousedown = (e) => { isDragging = true; startX = e.pageX - posX; };
    window.onmousemove = (e) => { if (isDragging) posX = e.pageX - startX; };
    window.onmouseup = () => isDragging = false;

    init();
    animate();
</script>
</body>
</html>
