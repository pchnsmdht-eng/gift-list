<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; color: white; font-family: sans-serif; margin: 0; overflow: hidden; }
        /* スライドする中身の設定 */
        #scroll-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            padding: 10px;
        }
        .item { background: rgba(0,0,0,0.7); border: 1px solid #555; padding: 10px; text-align: center; border-radius: 5px; }
        .active { border: 2px solid #ff0055; box-shadow: 0 0 10px #ff0055; }
        img { width: 40px; height: 40px; object-fit: contain; }
    </style>
</head>
<body>
    <div id="scroll-content">
        <!-- ここにギフトが並びます -->
        <div class="item active"><img src="gift.png"><div>殺人猿</div></div>
        <div class="item active"><img src="gift.png"><div>スペースレンジャー</div></div>
        <!-- 100個分並ぶ想定 -->
    </div>

    <script>
        const content = document.getElementById('scroll-content');
        let pos = 0;
        let moving = true;

        function step() {
            if (moving) {
                pos -= 1; // 上にずらしていく速度
                // 全体が見えなくなったら最初に戻す
                if (Math.abs(pos) > content.offsetHeight) {
                    pos = window.innerHeight;
                }
                content.style.top = pos + 'px';
            }
            window.requestAnimationFrame(step);
        }

        // 画面をどこでもクリック（タップ）すると動きが止まり、もう一度押すと動く
        window.addEventListener('mousedown', () => { moving = !moving; });
        
        window.requestAnimationFrame(step);
    </script>
</body>
</html>
