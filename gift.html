<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* ウィジェット枠にぴったり収めるためのCSS設定 */
        body { 
            margin: 0; 
            background: transparent; 
            overflow: hidden; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* 👁️‍🗨️【ここを修正】画面に見える表示枠を「横5個(1870px)×縦3段(400px)」に完全統一 */
        #viewport { 
            width: 1870px; /* 374px × 5列 = 1870px */
            height: 400px; /* 132px × 3段 = 396px（余白込み400px） */
            position: relative; 
            overflow: hidden; 
            pointer-events: auto !important;
        }
        
        #lane-container { 
            position: absolute; 
            display: flex; 
            flex-direction: row;
            width: max-content; 
            top: 2px; 
            will-change: transform; 
            transform: translate3d(0, 0, 0); 
            pointer-events: none !important; 
        }

        /* 成功事例の1122px幅、高さは3段分の396pxに完全最適化 */
        .block { 
            display: flex; 
            flex-direction: column; 
            width: 1122px; 
            height: 396px; 
            flex-shrink: 0; 
            margin: 0 !important;
            padding: 0 !important;
        }
        
        .lane { 
            width: 1122px; 
            height: 132px; 
            position: relative; 
            overflow: hidden; 
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* 50個（18行分）の巨大シートをすべて受け止めるサイズ設定 */
        iframe { 
            position: absolute; 
            width: 1200px; 
            height: 3000px; 
            border: none; 
            transform-origin: top left; 
        }

        /* 指でのスワイプやマウスを認識させるための透明な膜 */
        #touch-shield { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 9999; 
            background: rgba(0,0,0,0); 
            touch-action: none;
            pointer-events: auto !important;
            cursor: grab;
        }

        /* ✨【アイコンサイズ統一】文字まで綺麗によめる均一なサイズ（60px） */
        iframe { --gift-icon-size: 60px !important; }
        iframe[src*="streamtoearn"] img, 
        iframe[src*="streamtoearn"] .gift-icon, 
        iframe[src*="streamtoearn"] svg {
            width: 60px !important; 
            height: 60px !important; 
            object-fit: contain !important;
        }
    </style>
</head>
<body>
<div id="viewport">
    <div id="touch-shield"></div>
    <div id="lane-container"></div>
</div>
<script>
    const USER = "pchnsmdht-eng", REPO = "gift-list", W = 1122;
    const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const container = document.getElementById('lane-container');
    const shield = document.getElementById('touch-shield');
    
    let posX = 0, speed = -1.0, isTouching = false, startX = 0;

    // リモコン（speed.txt）との同期
    async function syncSpeed() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/speed.txt?t=${Date.now()}`);
            const text = await res.text();
            const s = parseFloat(text.trim());
            if(!isNaN(s)) speed = s;
        } catch (e) {}
    }
    setInterval(syncSpeed, 1000);

    // スワイプ・ドラッグ検知（成功事例を完全維持）
    const handleStart = (e) => {
        isTouching = true;
        startX = e.clientX - posX;
        shield.setPointerCapture(e.pointerId);
    };
    const handleMove = (e) => {
        if (!isTouching) return;
        posX = e.clientX - startX;
    };
    const handleEnd = () => { isTouching = false; };

    shield.addEventListener('pointerdown', handleStart);
    shield.addEventListener('pointermove', handleMove);
    shield.addEventListener('pointerup', handleEnd);
    shield.addEventListener('pointercancel', handleEnd);

    // データ読み込み：縦3段 × 横6ブロック（計18行、54枠分で50個を100%完全カバー）
    function init() {
        container.innerHTML = '';

        const blocksData = [
            [1, 2, 3],       // 1ブロック目（1〜9番）
            [4, 5, 6],       // 2ブロック目（10〜18番）
            [7, 8, 9],       // 3ブロック目（19〜27番）
            [10, 11, 12],    // 4ブロック目（28〜36番）
            [13, 14, 15],    // 5ブロック目（37〜45番）
            [16, 17, 18]     // 6ブロック目（46〜54番 ➔ 50個目がここに美しく収まります）
        ];

        // スライドがループした際に途切れないよう、6ブロックのセットを3ループ分横に連結
        for (let loop = 0; loop < 3; loop++) {
            blocksData.forEach((rows) => {
                const b = document.createElement('div'); 
                b.className = 'block';

                rows.forEach(n => {
                    const l = document.createElement('div'); 
                    l.className = 'lane';

                    const f = document.createElement('iframe');
                    f.src = `${SRC}?lane=${n}`;

                    // 🪛【灰色の細い枠線ズレを完全に消し去る動的5px補正】
                    const topPx = (n - 1) * 132;
                    f.style.clipPath = `inset(${topPx}px 5px ${3000 - (topPx + 132)}px 0px)`;
                    f.style.transform = `translate3d(0, -${topPx}px, 0)`;

                    l.appendChild(f); 
                    b.appendChild(l);
                });
                container.appendChild(b);
            });
        }
    }

    // 無限ループアニメーション
    function animate() {
        if (!isTouching) {
            posX += speed;
        }
        
        // 6ブロック分の総横幅 ＝ 1122px × 6 ＝ 6732px で寸分の狂いもなく滑らかにループ
        const unitW = W * 6; 

        if (posX <= -unitW) posX += unitW;
        else if (posX >= 0) posX -= unitW;
        
        container.style.transform = `translate3d(${posX}px, 0, 0)`;
        requestAnimationFrame(animate);
    }

    init(); syncSpeed(); animate();
</script>
</body>
</html>
