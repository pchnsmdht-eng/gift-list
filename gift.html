<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        #wrapper { width: 100vw; height: 100vh; position: relative; cursor: grab; }
        
        #scroller {
            position: absolute;
            display: flex; /* ここで「上・下・上・下」と横に並べる */
            width: max-content;
            height: 100%;
            will-change: transform;
        }

        .item-box {
            position: relative;
            width: 1000px; /* 画像の横幅 */
            height: 100vh;
            flex-shrink: 0;
        }

        iframe {
            position: absolute;
            width: 1000px;
            height: 200vh; /* 縦を2倍にして解像度を確保 */
            border: none;
            pointer-events: none;
        }

        /* --- 修正ポイント：上下の切り分け --- */
        
        /* 上半分パーツ */
        .top-part {
            top: 0;
            height: 50vh;
            clip-path: inset(0 0 50% 0);
        }

        /* 下半分パーツ（上段の右隣に並ぶように設定） */
        .bottom-part {
            top: 50vh; /* 画面の下半分に配置 */
            height: 50vh;
            clip-path: inset(50% 0 0 0);
            transform: translateY(-50vh); /* 下半分を上の枠まで持ち上げる */
        }

        /* 2つのパーツを横にずらす */
        .shift-right {
            margin-left: 1000px; /* 上半分の横幅分、右へずらして「後尾」にする */
        }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="scroller">
        </div>
</div>

<script>
    const TARGET_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const scroller = document.getElementById('scroller');
    const wrapper = document.getElementById('wrapper');

    // ループ用に「上・下のペア」を3セット作る
    for (let i = 0; i < 3; i++) {
        // 上半分を表示する箱
        const boxTop = document.createElement('div');
        boxTop.className = 'item-box';
        const fTop = document.createElement('iframe');
        fTop.src = TARGET_URL;
        fTop.className = 'top-part';
        boxTop.appendChild(fTop);
        scroller.appendChild(boxTop);

        // 下半分を表示する箱（上半分の右隣に来る）
        const boxBottom = document.createElement('div');
        boxBottom.className = 'item-box';
        const fBottom = document.createElement('iframe');
        fBottom.src = TARGET_URL;
        fBottom.className = 'bottom-part';
        boxBottom.appendChild(fBottom);
        scroller.appendChild(boxBottom);
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -2;

    function animate() {
        if (!isDragging) {
            posX += speed;
            // 画像2枚分（2000px）流れたらループ
            if (posX <= -2000) posX = 0;
        }
        scroller.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    wrapper.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.pageX - posX;
    });
    window.addEventListener('mousemove', (e) => {
        if (isDragging) posX = e.pageX - startX;
    });
    window.addEventListener('mouseup', () => isDragging = false);

    animate();
</script>
</body>
</html>
