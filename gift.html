<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #wrapper { width: 100vw; height: 100vh; position: relative; cursor: grab; }
        #wrapper:active { cursor: grabbing; }

        /* 全体の流れるコンテナ */
        #scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 100%;
            will-change: transform;
        }

        /* 外部サイトを読み込む枠 */
        .item-box {
            position: relative;
            width: 1000px; /* キャプチャしたい横幅 */
            height: 100%;
            flex-shrink: 0;
        }

        /* iframe（本物のページ）を強制的に埋め込む */
        iframe {
            position: absolute;
            width: 1000px; 
            height: 1600px; /* 縦長に読み込む */
            border: none;
            pointer-events: none; /* ドラッグを邪魔させない */
        }

        /* --- 上下分割のロジック --- */
        /* 上段：元のページの上半分だけを表示 */
        .top-part {
            top: 0;
            height: 50%;
            clip-path: inset(0 0 50% 0);
        }

        /* 下段：元のページの下半分を上段の「右隣」に配置 */
        .bottom-part {
            top: 0; /* 配置は上と同じ。translateXで右へ飛ばす */
            height: 50%;
            clip-path: inset(50% 0 0 0);
            transform: translateY(-25%); /* 下半分を上にずらして表示位置を調整 */
        }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="scroller">
        </div>
</div>

<script>
    const TARGET_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const scroller = document.getElementById('scroller');
    const wrapper = document.getElementById('wrapper');

    // 1. パーツの生成
    // 「上段の右に下段が追従する」構造にするため、セットで並べる
    for (let i = 0; i < 3; i++) {
        const box = document.createElement('div');
        box.className = 'item-box';
        
        // 上半分ユニット
        const fTop = document.createElement('iframe');
        fTop.src = TARGET_URL;
        fTop.className = 'top-part';
        
        // 下半分ユニット
        const fBottom = document.createElement('iframe');
        fBottom.src = TARGET_URL;
        fBottom.className = 'bottom-part';
        fBottom.style.left = "1000px"; // 上半分の右側に配置

        box.appendChild(fTop);
        box.appendChild(fBottom);
        scroller.appendChild(box);
    }

    // 2. スクロールとUIのロジック
    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.5; // 自動速度

    function animate() {
        if (!isDragging) {
            posX += speed;
            // 無限ループ処理
            if (posX <= -2000) posX = 0; 
        }
        scroller.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    // 3. ドラッグUI（触った時に自由に動かせる）
    wrapper.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.pageX - posX;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        posX = e.pageX - startX;
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    animate();
</script>
</body>
</html>
