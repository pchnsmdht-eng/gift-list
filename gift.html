<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        #viewport { width: 100vw; height: 400px; position: relative; overflow: hidden; cursor: grab; }
        
        #lane-container { 
            position: absolute; display: flex; width: max-content; height: 393px;
            /* 上部の余白（お好みで調整してください） */
            top: 2px;
            will-change: transform; transform: translate3d(0, 0, 0); pointer-events: none;
        }

        .block { display: flex; flex-direction: column; width: 1115px; height: 393px; flex-shrink: 0; }
        
        /* 🔴 ズレ修正：レーンの高さを精密に調整 */
        .lane { 
            width: 1115px; 
            height: 131px; /* 表示上の高さ */
            position: relative; 
            overflow: hidden; 
            margin: 0 !important; 
            padding: 0 !important;
            display: block;
        }
        
        iframe { 
            position: absolute; width: 1200px; height: 1500px; border: none; 
            background: transparent;
        }

        /* 🔴 切り抜き位置（clip-path）を精密に再計算（131.5px刻み）
           inset(上 右 下 左)
        */
        .r1 { top: 0; clip-path: inset(0px 26px 1368.5px 0px); }
        
        /* 2行目: 131.5pxから切り出し、上に131.5px戻す */
        .r2 { top: 0; clip-path: inset(131.5px 26px 1237px 0px); transform: translateY(-131.5px); }
        
        /* 3行目: 263px(131.5*2)から切り出し、上に263px戻す */
        .r3 { top: 0; clip-path: inset(263px 26px 1105.5px 0px); transform: translateY(-263px); }
        
        /* 以降、131.5pxずつ足していく */
        .r4 { top: 0; clip-path: inset(394.5px 26px 974px 0px); transform: translateY(-394.5px); }
        .r5 { top: 0; clip-path: inset(526px 26px 842.5px 0px); transform: translateY(-526px); }
        .r6 { top: 0; clip-path: inset(657.5px 26px 711px 0px); transform: translateY(-657.5px); }
        .r7 { top: 0; clip-path: inset(789px 26px 579.5px 0px); transform: translateY(-789px); }
        .r8 { top: 0; clip-path: inset(920.5px 26px 448px 0px); transform: translateY(-920.5px); }
        .r9 { top: 0; clip-path: inset(1052px 26px 316.5px 0px); transform: translateY(-1052px); }

        #touch-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: transparent; }
    </style>
</head>
<body>
<div id="viewport">
    <div id="touch-overlay"></div>
    <div id="lane-container"></div>
</div>
<script>
    const USER = "pchnsmdht-eng";
    const REPO = "gift-list";
    const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 1115; // 1ブロックの横幅
    const container = document.getElementById('lane-container');
    const overlay = document.getElementById('touch-overlay');
    let posX = 0; let speed = -1.0; let isDragging = false; let startX = 0;

    async function syncSpeed() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/speed.txt?t=${Date.now()}`);
            const text = await res.text();
            if(!isNaN(text) && text.trim() !== "") speed = parseFloat(text);
        } catch (e) {}
    }
    setInterval(syncSpeed, 3000);

    function init() {
        container.innerHTML = '';
        // 滑らかなループのため、セットを3つ並べる
        for (let i = 0; i < 3; i++) {
            // 3段ずつのセットを作成
            [[1,2,3],[4,5,6],[7,8,9]].forEach(rows => {
                const b = document.createElement('div'); b.className = 'block';
                rows.forEach(n => {
                    const l = document.createElement('div'); l.className = 'lane';
                    const f = document.createElement('iframe');
                    f.className = `r${n}`;
                    f.src = `${SRC}?lane=${n}`;
                    l.appendChild(f); b.appendChild(l);
                });
                container.appendChild(b);
            });
        }
    }

    // ドラッグ操作
    overlay.addEventListener('pointerdown', (e) => { isDragging = true; startX = e.clientX - posX; overlay.setPointerCapture(e.pointerId); });
    overlay.addEventListener('pointermove', (e) => { if (!isDragging) return; posX = e.clientX - startX; });
    overlay.addEventListener('pointerup', () => isDragging = false);

    function animate() {
        if (!isDragging) {
            posX += speed;
            const totalW = W * 3; // 3セット分の幅でループ
            if (posX <= -totalW) posX += totalW;
            if (posX > 0) posX -= totalW;
        }
        container.style.transform = `translate3d(${posX}px, 0, 0)`;
        requestAnimationFrame(animate);
    }
    init(); syncSpeed(); animate();
</script>
</body>
</html>
