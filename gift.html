<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* ウィジェット枠にぴったり収めるためのCSS設定 */
        body { 
            margin: 0; 
            background: transparent; 
            overflow: hidden; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* 4段分（132px × 4段 = 528px）が綺麗に収まる高さ */
        #viewport { 
            width: 100vw; 
            height: 530px; 
            position: relative; 
            overflow: hidden; 
            pointer-events: auto !important;
        }
        
        /* 縦に積まれた各ブロックが、横（Row方向）にズラリと並ぶコンテナ */
        #lane-container { 
            position: absolute; 
            display: flex; 
            flex-direction: row; 
            width: max-content; 
            top: 2px; 
            will-change: transform; 
            transform: translate3d(0, 0, 0); 
            pointer-events: none !important; 
        }

        /* 成功事例の構造：1つの縦箱（幅1122pxの中に、縦に4段のlaneがギッチリ積まれる） */
        .block { 
            display: flex; 
            flex-direction: column; 
            width: 1122px; 
            height: 528px; 
            flex-shrink: 0; 
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* 1つの行の高さ */
        .lane { 
            width: 1122px; 
            height: 132px; 
            position: relative; 
            overflow: hidden; 
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* 28行目までの巨大な縦長シートをすべて受け止めるサイズ設定（4000px） */
        iframe { 
            position: absolute; 
            width: 1200px; 
            height: 4000px; 
            border: none; 
            transform-origin: top left; 
        }

        /* 指でのスワイプやマウスを認識させるための透明な膜 */
        #touch-shield { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 9999; 
            background: rgba(0,0,0,0); 
            touch-action: none;
            pointer-events: auto !important;
            cursor: grab;
        }

        /* ✨【アイコンサイズ統一】文字まで綺麗によめる均一なサイズ（60px） */
        iframe { --gift-icon-size: 60px !important; }
        iframe[src*="streamtoearn"] img, 
        iframe[src*="streamtoearn"] .gift-icon, 
        iframe[src*="streamtoearn"] svg {
            width: 60px !important; 
            height: 60px !important; 
            object-fit: contain !important;
        }
    </style>
</head>
<body>
<div id="viewport">
    <div id="touch-shield"></div>
    <div id="lane-container"></div>
</div>
<script>
    const USER = "pchnsmdht-eng", REPO = "gift-list", W = 1122;
    const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    
    const container = document.getElementById('lane-container');
    const shield = document.getElementById('touch-shield');
    
    let posX = 0, speed = -1.0, isTouching = false, startX = 0;

    // リモコン（speed.txt）との同期
    async function syncSpeed() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/speed.txt?t=${Date.now()}`);
            const text = await res.text();
            const s = parseFloat(text.trim());
            if(!isNaN(s)) speed = s;
        } catch (e) {}
    }
    setInterval(syncSpeed, 1000);

    // スワイプ・ドラッグ検知（成功事例の快適な操作を完全維持）
    const handleStart = (e) => {
        isTouching = true;
        startX = e.clientX - posX;
        shield.setPointerCapture(e.pointerId);
    };
    const handleMove = (e) => {
        if (!isTouching) return;
        posX = e.clientX - startX;
    };
    const handleEnd = () => { isTouching = false; };

    shield.addEventListener('pointerdown', handleStart);
    shield.addEventListener('pointermove', handleMove);
    shield.addEventListener('pointerup', handleEnd);
    shield.addEventListener('pointercancel', handleEnd);

    // データ読み込み：縦4段 × 横7列（7ブロック）のデータ構造
    function init() {
        container.innerHTML = '';

        // 成功事例のロジック：1つのブロックに縦に4本の行（lane=1〜4、5〜8...）を詰め込み、それを横に7つの異なるブロックとして並べる
        const blocksData = [
            [1, 2, 3, 4],       // 1列目（1〜4行目）
            [5, 6, 7, 8],       // 2列目（5〜8行目）
            [9, 10, 11, 12],    // 3列目（9〜12行目）
            [13, 14, 15, 16],   // 4列目（13〜16行目）
            [17, 18, 19, 20],   // 5列目（17〜20行目）
            [21, 22, 23, 24],   // 6列目（21〜24行目）
            [25, 26, 27, 28]    // 7列目（25〜28行目）
        ];

        // スライドがループした際に途切れないよう、7つのブロックのセットを3ループ分横に連結
        for (let loop = 0; loop < 3; loop++) {
            blocksData.forEach((rows) => {
                const b = document.createElement('div'); 
                b.className = 'block';

                rows.forEach(n => {
                    const l = document.createElement('div'); 
                    l.className = 'lane';
                    
                    const f = document.createElement('iframe');
                    f.src = `${SRC}?lane=${n}`;

                    // 🪛【1ミリの狂いもない動化クリッピング補正】
                    // 巨大シート（4000px高）から、それぞれの行（n）に応じた高さを寸分の狂いもなく自動で切り取って配置します。これで被りは100%直ります。
                    const topPx = (n - 1) * 132;
                    f.style.clipPath = `inset(${topPx}px 5px ${4000 - (topPx + 132)}px 0px)`;
                    f.style.transform = `translate3d(0, -${topPx}px, 0)`;

                    l.appendChild(f); 
                    b.appendChild(l);
                });
                container.appendChild(b);
            });
        }
    }

    // 無限ループアニメーション（7つの異なるブロックが丸ごと一斉に横に流れる）
    function animate() {
        if (!isTouching) {
            posX += speed;
        }
        
        const unitW = W * 7; // 7ブロック分の総横幅 = 7854px

        // 端まで流れたら滑らかに先頭へループ（これで違うギフトが被らず綺麗に無限に連なる）
        if (posX <= -unitW) posX += unitW;
        else if (posX >= 0) posX -= unitW;
        
        container.style.transform = `translate3d(${posX}px, 0, 0)`;
        requestAnimationFrame(animate);
    }

    init(); syncSpeed(); animate();
</script>
</body>
</html>
