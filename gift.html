<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        /* 縦に3段並べるコンテナ */
        #main-wrapper {
            display: flex;
            flex-direction: column; /* 縦並び */
            width: 100vw;
            height: 318px; /* 106px * 3 */
        }

        /* 各段の横長の窓 */
        .lane-wrapper {
            width: 100vw;
            height: 106px;
            position: relative;
            overflow: hidden;
            cursor: grab;
            border-bottom: 1px solid rgba(255,255,255,0.1); /* 境目が見やすいよう薄く線 */
        }

        .scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 106px;
            will-change: transform;
        }

        .item-box {
            position: relative;
            width: 131px;
            height: 106px;
            flex-shrink: 0;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1200px;
            border: none;
            pointer-events: none;
            transform-origin: 0 0;
            transform: scale(0.85); /* アイコンサイズ調整 */
        }

        /* 段ごとの切り抜き位置 */
        .clip-1 { clip-path: inset(5px 1010px 900px 5px); }
        .clip-2 { clip-path: inset(135px 1010px 770px 5px); transform: translateY(-135px) scale(0.85); }
        .clip-3 { clip-path: inset(265px 1010px 640px 5px); transform: translateY(-265px) scale(0.85); }
    </style>
</head>
<body>

<div id="main-wrapper">
    <div class="lane-wrapper" id="lane-1"><div class="scroller" id="scroll-1"></div></div>
    <div class="lane-wrapper" id="lane-2"><div class="scroller" id="scroll-2"></div></div>
    <div class="lane-wrapper" id="lane-3"><div class="scroller" id="scroll-3"></div></div>
</div>

<script>
    const TARGET_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const ITEM_WIDTH = 131;
    let isDragging = false;
    let startX = 0;
    let currentPosX = [0, 0, 0]; // 各段の座標

    // 3つの段それぞれに中身を詰める
    [1, 2, 3].forEach(num => {
        const scroller = document.getElementById(`scroll-${num}`);
        for (let i = 0; i < 15; i++) { // 横は制限なし（多めに生成）
            const box = document.createElement('div');
            box.className = 'item-box';
            const f = document.createElement('iframe');
            f.src = TARGET_URL;
            f.className = `clip-${num}`;
            box.appendChild(f);
            scroller.appendChild(box);
        }
    });

    function animate() {
        if (!isDragging) {
            for (let i = 0; i < 3; i++) {
                currentPosX[i] -= (1.2 + (i * 0.2)); // 段ごとに少し速度を変えると自然です
                if (currentPosX[i] <= -ITEM_WIDTH) currentPosX[i] += ITEM_WIDTH;
                document.getElementById(`scroll-${i+1}`).style.transform = `translateX(${currentPosX[i]}px)`;
            }
        }
        requestAnimationFrame(animate);
    }

    // ドラッグ操作（全体または各段）
    document.getElementById('main-wrapper').addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.pageX;
        this.basePosX = [...currentPosX];
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const diff = e.pageX - startX;
        for (let i = 0; i < 3; i++) {
            currentPosX[i] = this.basePosX[i] + diff;
            document.getElementById(`scroll-${i+1}`).style.transform = `translateX(${currentPosX[i]}px)`;
        }
    });

    window.addEventListener('mouseup', () => isDragging = false);

    animate();
</script>
</body>
</html>
