<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { background-color: transparent; color: #FFFFFF; font-family: "Meiryo", sans-serif; overflow: hidden; margin: 0; padding: 0; }
        .container { width: 450px; height: 200px; position: relative; }
        .list-item { display: flex; align-items: center; height: 80px; margin-bottom: 10px; text-shadow: 2px 2px 4px #000; }
        .icon-img { width: 70px; height: 70px; object-fit: contain; margin-right: 20px; }
        .text { font-size: 35px; font-weight: bold; }
        .gift-name { color: #FF69B4; }
    </style>
</head>
<body>
    <div class="container" id="gift-list-container">Loading...</div>
    <script>
        const WIDGET_ID = "69fdeb1847acbc197268808a"; 
        async function updateList() {
            try {
                const response = await fetch(`https://app.streamtoearn.io/api/overlay/${WIDGET_ID}`);
                const data = await response.json();
                let html = '<marquee direction="up" scrollamount="3" style="height: 200px;">';
                data.events.forEach(event => {
                    if(event.enabled) {
                        html += `<div class="list-item"><img src="${event.image_url}" class="icon-img"><span class="text"><span class="gift-name">${event.gift_name}</span> ＝ ${event.command_name}</span></div>`;
                    }
                });
                html += '</marquee>';
                document.getElementById('gift-list-container').innerHTML = html;
            } catch (e) {
                document.getElementById('gift-list-container').innerHTML = "Error loading data";
            }
        }
        updateList();
        setInterval(updateList, 60000);
    </script>
</body>
</html>
