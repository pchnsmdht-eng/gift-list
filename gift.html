<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        /* 131x106の窓枠 */
        #wrapper { width: 100vw; height: 106px; position: relative; cursor: grab; overflow: hidden; }
        
        #scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 106px;
            will-change: transform;
        }

        .item-box {
            position: relative;
            width: 131px;
            height: 106px;
            flex-shrink: 0;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1200px; /* 3段分読み込める高さ */
            border: none;
            pointer-events: none;
            transform-origin: 0 0;
            transform: scale(0.73); /* アイコンサイズ調整 */
        }

        /* --- 3段それぞれの切り抜き位置 --- */
        
        .part-1 {
            top: 0; clip-path: inset(0px 1018px 653px 0px); 
        }

        .part-2 {
            top: 0; clip-path: inset(146px 1018px 507px 0px);
            transform: translateY(-106px) scale(0.73);
        }

        .part-3 {
            top: 0; clip-path: inset(292px 1018px 361px 0px);
            transform: translateY(-212px) scale(0.73);
        }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="scroller"></div>
</div>

<script>
    const TARGET_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const scroller = document.getElementById('scroller');
    const wrapper = document.getElementById('wrapper');

    const ITEM_WIDTH = 131;

    // 「1段目・2段目・3段目」をペアで並べる
    function init() {
        for (let i = 0; i < 6; i++) {
            [1, 2, 3].forEach(num => {
                const box = document.createElement('div');
                box.className = 'item-box';
                const f = document.createElement('iframe');
                f.src = TARGET_URL;
                f.className = `part-${num}`;
                box.appendChild(f);
                scroller.appendChild(box);
            });
        }
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.5;

    function animate() {
        if (!isDragging) {
            posX += speed;
            // 3枚1セット（131px * 3 = 393px）分流れたらループ
            const unitWidth = ITEM_WIDTH * 3;
            if (posX <= -unitWidth) posX += unitWidth;
        }
        scroller.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    wrapper.addEventListener('mousedown', (e) => { isDragging = true; startX = e.pageX - posX; });
    window.addEventListener('mousemove', (e) => { if (isDragging) posX = e.pageX - startX; });
    window.addEventListener('mouseup', () => isDragging = false);

    init();
    animate();
</script>
</body>
</html>
