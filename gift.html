<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        #viewport {
            width: 100vw;
            height: 390px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        /* 各段の枠 */
        .lane {
            width: 100vw;
            height: 130px;
            position: relative;
            overflow: hidden;
        }

        /* iframeは各段1枚だけ！ */
        iframe {
            position: absolute;
            width: 1200px;
            height: 1500px;
            border: none;
            pointer-events: none;
            will-change: transform; /* GPU加速 */
        }
    </style>
</head>
<body>

<div id="viewport">
    <div class="lane"><iframe id="f1"></iframe></div>
    <div class="lane"><iframe id="f2"></iframe></div>
    <div class="lane"><iframe id="f3"></iframe></div>
</div>

<script>
    const BASE_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 1200;
    const iframes = [document.getElementById('f1'), document.getElementById('f2'), document.getElementById('f3')];

    // 初回読み込み（キャッシュ回避）
    function loadIframes() {
        iframes.forEach((f, i) => {
            f.src = `${BASE_URL}?v=${Date.now()}_${i}`;
        });
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.8;

    function animate() {
        if (!isDragging) {
            posX += speed;
            // 3セット分(3600px)のループ
            if (posX <= -(W * 3)) posX += (W * 3);
        }

        // 現在どのセット(0:1-3段目, 1:4-6段目, 2:7-9段目)を表示すべきか計算
        const scrollX = posX % W;
        const setIndex = Math.floor(Math.abs(posX) / W) % 3;

        iframes.forEach((f, i) => {
            // 表示する段（row）をセットに合わせて変更
            const rowOffset = setIndex * 3;
            const targetY = -( (i + rowOffset) * 130 );
            
            // GPUで動かすことでCPU負荷を軽減
            f.style.transform = `translate3d(${scrollX}px, ${targetY}px, 0)`;
            
            // クリップ範囲も動的に更新（全9段分をカバー）
            const top = (i + rowOffset) * 130;
            f.style.clipPath = `inset(${top}px 0px ${1500 - (top + 130)}px 0px)`;
        });

        requestAnimationFrame(animate);
    }

    const vp = document.getElementById('viewport');
    vp.onmousedown = (e) => { isDragging = true; startX = e.pageX - posX; };
    window.onmousemove = (e) => { if (isDragging) posX = e.pageX - startX; };
    window.onmouseup = () => isDragging = false;

    // 10分おきにリフレッシュ（CPUに優しい頻度）
    setInterval(loadIframes, 600000);

    loadIframes();
    animate();
</script>
</body>
</html>
