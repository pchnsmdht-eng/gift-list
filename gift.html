<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        /* 135px * 3 = 405px */
        #viewport {
            width: 100vw;
            height: 405px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        .lane-container {
            position: absolute;
            display: flex;
            width: max-content;
            height: 405px;
            will-change: transform;
        }

        .lane-block {
            display: flex;
            flex-direction: column;
            width: 1200px;
            height: 405px;
        }

        .lane {
            width: 1200px;
            height: 135px;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1200px;
            border: none;
            pointer-events: none;
        }

        /* 抜き出し位置を135px刻みで固定 */
        .r1 { top: 0; clip-path: inset(0px 0px 1065px 0px); }
        .r2 { top: 0; clip-path: inset(135px 0px 930px 0px); transform: translateY(-135px); }
        .r3 { top: 0; clip-path: inset(270px 0px 795px 0px); transform: translateY(-270px); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="lane-container"></div>
</div>

<script>
    const URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 1200;
    const container = document.getElementById('lane-container');

    // 1200pxの塊を2つ作り、横に並べてループさせる一番シンプルな形
    function init() {
        for (let i = 0; i < 2; i++) {
            const block = document.createElement('div');
            block.className = 'lane-block';
            for (let n = 1; n <= 3; n++) {
                const lane = document.createElement('div');
                lane.className = 'lane';
                const f = document.createElement('iframe');
                f.src = `${URL}?v=${Date.now()}_${i}_${n}`;
                f.className = `r${n}`;
                lane.appendChild(f);
                block.appendChild(lane);
            }
            container.appendChild(block);
        }
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.8; // 右から左（←）

    function animate() {
        if (!isDragging) {
            posX += speed;
            if (posX <= -W) {
                posX += W;
            }
        }
        container.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    const vp = document.getElementById('viewport');
    vp.onmousedown = (e) => { isDragging = true; startX = e.pageX - posX; };
    window.onmousemove = (e) => { if (isDragging) posX = e.pageX - startX; };
    window.onmouseup = () => isDragging = false;

    init();
    animate();
</script>
</body>
</html>
