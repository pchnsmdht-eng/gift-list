<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none;
        }
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* 横方向に並べるコンテナ */
        #scroll-container {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            display: flex;
            flex-direction: row; 
            gap: 10px; /* 横の隙間 */
            padding: 5px;
            cursor: grab;
            touch-action: pan-x;
        }
        /* 縦に6つ画像を並べる列ユニット */
        .column-unit {
            display: flex;
            flex-direction: column;
            gap: 5px; /* 縦の隙間 */
            flex-shrink: 0;
        }
        /* 画像1個ずつの窓（枠なし） */
        .gift-item {
            width: 120px; /* 6段並べるため少しサイズを調整 */
            height: 120px; 
            overflow: hidden;
            background: transparent;
            border: none;
            position: relative;
            pointer-events: none;
        }
        iframe {
            width: 450px;
            height: 5000px;
            border: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            transform-origin: top;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- 1列目（縦に1〜6枚目） -->
        <div class="column-unit">
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: 0px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -135px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -270px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -405px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -540px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -675px;"></iframe></div>
        </div>
        <!-- 2列目（縦に7〜12枚目） -->
        <div class="column-unit">
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -810px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -945px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1080px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1215px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1350px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1485px;"></iframe></div>
        </div>
        <!-- 必要に応じて「3列目」以降も同様に追加可能です -->
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer, startX, initialPos;

    function step() {
        if (!isPaused) {
            pos -= 0.8; // 横移動の速度
            if (Math.abs(pos) > container.scrollWidth) {
                pos = window.innerWidth;
            }
            container.style.left = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startX = e.touches ? e.touches[0].pageX : e.pageX;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        if (!isPaused) return;
        const currentX = e.touches ? e.touches[0].pageX : e.pageX;
        pos = initialPos + (currentX - startX);
        container.style.left = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});
    requestAnimationFrame(step);
</script>
</body>
</html>
