<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: transparent; user-select: none; }
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; }

        /* 2列グリッド：全体の幅が変われば枠のサイズも自動で変わる */
        #scroll-container {
            position: absolute;
            top: 0;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px;
            padding: 10px;
            box-sizing: border-box;
            cursor: grab;
            touch-action: pan-y;
        }

        /* 個別の画像枠：リサイズしても正方形を維持 */
        .gift-item {
            aspect-ratio: 1 / 1; 
            width: 100%;
            overflow: hidden;
            border: 2px solid #ff0055;
            background: rgba(0,0,0,0.8);
            border-radius: 12px;
            position: relative;
            pointer-events: none;
        }

        /* サイトの埋め込み設定 */
        iframe {
            width: 1000px; /* 十分な幅で読み込む */
            height: 5000px;
            border: none;
            position: absolute;
            transform: scale(0.65); /* 枠内に収めるスケール */
            transform-origin: top left;
        }

        /* 左側の列用：サイトの左端にある画像を狙う */
        .left-col iframe { left: -10px; }
        /* 右側の列用：サイトの右側にある画像を狙う（ミラー解消の鍵） */
        .right-col iframe { left: -160px; }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- 1行目 -->
        <div class="gift-item left-col"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: 0px;"></iframe></div>
        <div class="gift-item right-col"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: 0px;"></iframe></div>
        
        <!-- 2行目 -->
        <div class="gift-item left-col"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -150px;"></iframe></div>
        <div class="gift-item right-col"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -150px;"></iframe></div>
        
        <!-- 3行目 -->
        <div class="gift-item left-col"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -300px;"></iframe></div>
        <div class="gift-item right-col"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -300px;"></iframe></div>

        <!-- 4行目 -->
        <div class="gift-item left-col"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -450px;"></iframe></div>
        <div class="gift-item right-col"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -450px;"></iframe></div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer, startY, initialPos;

    function step() {
        if (!isPaused) {
            pos -= 1;
            if (Math.abs(pos) > container.scrollHeight) pos = window.innerHeight;
            container.style.top = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startY = e.touches ? e.touches[0].pageY : e.pageY;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        const currentY = e.touches ? e.touches[0].pageY : e.pageY;
        pos = initialPos + (currentY - startY);
        container.style.top = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});
    requestAnimationFrame(step);
</script>
</body>
</html>
