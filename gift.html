<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { background-color: transparent; color: #FFFFFF; font-family: "Meiryo", sans-serif; overflow: hidden; margin: 0; padding: 0; }
        .window { width: 450px; height: 300px; position: relative; overflow-y: auto; scrollbar-width: none; }
        .window::-webkit-scrollbar { display: none; }
        .list-item { display: flex; align-items: center; height: 80px; margin-bottom: 20px; text-shadow: 2px 2px 4px #000; cursor: grab; }
        .icon-img { width: 70px; height: 70px; object-fit: contain; margin-right: 20px; pointer-events: none; }
        .text { font-size: 30px; font-weight: bold; pointer-events: none; }
    </style>
</head>
<body>
    <div class="window" id="sw">
        <div class="scroll-box">
            <!-- URLは固定。お友達はこの「行」をコピーして増やすだけで反映されます -->
            <div class="list-item"><img src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" class="icon-img"><span class="text">GIFT <span style="color:#FF69B4;">ACTIVE</span></span></div>
            <div class="list-item"><img src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" class="icon-img"><span class="text">GIFT <span style="color:#FF69B4;">ACTIVE</span></span></div>
        </div>
    </div>
    <script>
        const w = document.getElementById('sw');
        let speed = 1, interval, timer;
        function start() { 
            interval = setInterval(() => { 
                w.scrollTop += speed; 
                if(w.scrollTop >= w.scrollHeight - w.clientHeight) w.scrollTop = 0; 
            }, 50); 
        }
        function stop() { clearInterval(interval); }
        w.addEventListener('mousedown', () => { stop(); clearTimeout(timer); });
        w.addEventListener('mouseup', () => { timer = setTimeout(start, 5000); });
        start();
    </script>
</body>
</html>
