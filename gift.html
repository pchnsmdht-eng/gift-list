<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        /* 縦131px × 3段 = 393px に拡張 */
        #viewport {
            width: 100vw;
            height: 393px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        /* 各段の枠を131pxに */
        .lane {
            width: 100vw;
            height: 131px;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1500px;
            border: none;
            pointer-events: none;
            will-change: transform; /* GPU加速 */
        }
    </style>
</head>
<body>

<div id="viewport">
    <div class="lane"><iframe id="f1"></iframe></div>
    <div class="lane"><iframe id="f2"></iframe></div>
    <div class="lane"><iframe id="f3"></iframe></div>
</div>

<script>
    const BASE_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 1200;
    const H = 131; // 1段の高さを131に変更
    const iframes = [document.getElementById('f1'), document.getElementById('f2'), document.getElementById('f3')];

    function loadIframes() {
        iframes.forEach((f, i) => {
            f.src = `${BASE_URL}?v=${Date.now()}_${i}`;
        });
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.8;

    function animate() {
        if (!isDragging) {
            posX += speed;
            if (posX <= -(W * 3)) posX += (W * 3);
        }

        const scrollX = posX % W;
        const setIndex = Math.floor(Math.abs(posX) / W) % 3;

        iframes.forEach((f, i) => {
            const rowOffset = setIndex * 3;
            // 縦位置の計算を131px基準に修正
            const targetY = -( (i + rowOffset) * H );
            
            f.style.transform = `translate3d(${scrollX}px, ${targetY}px, 0)`;
            
            // クリップ範囲も131pxに合わせて1pxずつ拡張
            const top = (i + rowOffset) * H;
            f.style.clipPath = `inset(${top}px 0px ${1500 - (top + H)}px 0px)`;
        });

        requestAnimationFrame(animate);
    }

    const vp = document.getElementById('viewport');
    vp.onmousedown = (e) => { isDragging = true; startX = e.pageX - posX; };
    window.onmousemove = (e) => { if (isDragging) posX = e.pageX - startX; };
    window.onmouseup = () => isDragging = false;

    setInterval(loadIframes, 600000);
    loadIframes();
    animate();
</script>
</body>
</html>
