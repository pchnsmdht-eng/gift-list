<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        #wrapper { width: 100vw; height: 100vh; position: relative; cursor: grab; }
        
        #scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 100%;
            will-change: transform;
        }

        .item-box {
            position: relative;
            width: 1000px; /* 横幅 */
            height: 100vh;
            flex-shrink: 0;
        }

        iframe {
            position: absolute;
            width: 1000px;
            height: 200vh;
            border: none;
            pointer-events: none;
        }

        /* --- 切れ目調整セクション --- */
        
        /* 上段の設定 */
        .top-part {
            top: 0;
            height: 380px; /* 🔴 1段目の高さに合わせて調整 */
            clip-path: inset(0 0 52% 0); /* 🔴 下から52%を隠す（切れ目を見て調整） */
        }

        /* 下段の設定 */
        .bottom-part {
            top: 0;
            height: 380px;
            /* 🔴 上から48%を隠して「2段目」の頭を出す */
            clip-path: inset(48% 0 0 0); 
            /* 下段を「1段目のすぐ下」ではなく「1段目と同じ高さ」に無理やり持ち上げる */
            transform: translateY(-48%); 
        }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="scroller"></div>
</div>

<script>
    const TARGET_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const scroller = document.getElementById('scroller');
    const wrapper = document.getElementById('wrapper');

    // ペアを生成
    for (let i = 0; i < 4; i++) {
        // 上半分ユニット
        const boxTop = document.createElement('div');
        boxTop.className = 'item-box';
        const fTop = document.createElement('iframe');
        fTop.src = TARGET_URL;
        fTop.className = 'top-part';
        boxTop.appendChild(fTop);
        scroller.appendChild(boxTop);

        // 下半分ユニット（これが右隣に並ぶ）
        const boxBottom = document.createElement('div');
        boxBottom.className = 'item-box';
        const fBottom = document.createElement('iframe');
        fBottom.src = TARGET_URL;
        fBottom.className = 'bottom-part';
        boxBottom.appendChild(fBottom);
        scroller.appendChild(boxBottom);
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.8;

    function animate() {
        if (!isDragging) {
            posX += speed;
            if (posX <= -2000) posX = 0;
        }
        scroller.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    wrapper.addEventListener('mousedown', (e) => { isDragging = true; startX = e.pageX - posX; });
    window.addEventListener('mousemove', (e) => { if (isDragging) posX = e.pageX - startX; });
    window.addEventListener('mouseup', () => isDragging = false);

    animate();
</script>
</body>
</html>
