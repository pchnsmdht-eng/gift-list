<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        /* 131x106の枠を固定 */
        #wrapper { width: 100vw; height: 106px; position: relative; cursor: grab; overflow: hidden; }
        
        #scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 106px;
            will-change: transform;
        }

        .item-box {
            position: relative;
            width: 131px; /* 横幅 */
            height: 106px; /* 高さ */
            flex-shrink: 0;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            /* 🔴 ここを固定：元のページのサイズで読み込む */
            width: 1200px; 
            height: 800px; 
            border: none;
            pointer-events: none;
            /* 🔴 勝手に縮小させない */
            transform: scale(1.0); 
            transform-origin: top left;
        }

        /* --- 1段目と2段目を「窓」にピッタリ合わせる --- */
        
        .top-part {
            top: 0;
            left: 0;
            /* 1段目のアイコンの位置（左上から131x106の範囲だけ切り抜く） */
            clip-path: inset(0px 1069px 694px 0px); 
        }

        .bottom-part {
            top: 0;
            left: 0;
            /* 2段目のアイコンの位置（106px分下の位置を切り抜く） */
            clip-path: inset(106px 1069px 588px 0px);
            /* 切り抜いた下段を、窓の高さまで持ち上げる */
            transform: translateY(-106px);
        }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="scroller"></div>
</div>

<script>
    const TARGET_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const scroller = document.getElementById('scroller');
    const wrapper = document.getElementById('wrapper');

    const ITEM_WIDTH = 131;

    // 1段目と2段目を交互に生成（合計20枚）
    for (let i = 0; i < 10; i++) {
        const boxT = document.createElement('div'); boxT.className = 'item-box';
        const fT = document.createElement('iframe'); fT.src = TARGET_URL; fT.className = 'top-part';
        boxT.appendChild(fT); scroller.appendChild(boxT);

        const boxB = document.createElement('div'); boxB.className = 'item-box';
        const fB = document.createElement('iframe'); fB.src = TARGET_URL; fB.className = 'bottom-part';
        boxB.appendChild(fB); scroller.appendChild(boxB);
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.2;

    function animate() {
        if (!isDragging) {
            posX += speed;
            const unitWidth = ITEM_WIDTH * 2;
            if (posX <= -unitWidth) posX += unitWidth;
        }
        scroller.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    wrapper.addEventListener('mousedown', (e) => { isDragging = true; startX = e.pageX - posX; });
    window.addEventListener('mousemove', (e) => { if (isDragging) posX = e.pageX - startX; });
    window.addEventListener('mouseup', () => isDragging = false);

    animate();
</script>
</body>
</html>
