<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none;
        }
        /* TikTok Studioの枠に合わせて表示 */
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* 横方向に並べるためのメインコンテナ */
        #scroll-container {
            position: absolute;
            left: 0;
            top: 0;
            /* 縦の表示範囲を約600px付近に調整 */
            height: 600px;
            display: flex; 
            flex-direction: row; 
            gap: 15px; /* 横の隙間 */
            padding: 10px;
            cursor: grab;
            touch-action: pan-x;
        }
        /* 縦に6つ画像を並べる列ユニット */
        .column-unit {
            display: flex;
            flex-direction: column;
            gap: 8px; /* 縦の隙間 */
            flex-shrink: 0;
        }
        /* 画像1枚分の窓（枠なし） */
        .gift-item {
            width: 140px; 
            height: 140px; 
            overflow: hidden;
            background: transparent;
            border: none;
            position: relative;
            pointer-events: none;
        }
        /* 画像の縮尺と解像度の調整 (200幅ベースで読み込み) */
        iframe {
            width: 500px; /* 内部解像度を高めに確保 */
            height: 6000px;
            border: none;
            position: absolute;
            left: 50%;
            /* scaleを調整して、窓の中に画像を大きく表示 */
            transform: translateX(-50%) scale(1.1);
            transform-origin: top;
            filter: none;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- 第1カラム（1〜6枚目） -->
        <div class="column-unit">
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: 0px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -155px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -310px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -465px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -620px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -775px;"></iframe></div>
        </div>
        <!-- 第2カラム（7〜12枚目） -->
        <div class="column-unit">
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -930px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1085px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1240px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1395px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1550px;"></iframe></div>
            <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1705px;"></iframe></div>
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer, startX, initialPos;

    // 自動横スライド
    function step() {
        if (!isPaused) {
            pos -= 1.0; 
            // コンテナの末端まで行ったらループ
            if (Math.abs(pos) > container.scrollWidth) {
                pos = window.innerWidth;
            }
            container.style.left = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    // 手動スライドUI
    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startX = e.touches ? e.touches[0].pageX : e.pageX;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        if (!isPaused) return;
        const currentX = e.touches ? e.touches[0].pageX : e.pageX;
        pos = initialPos + (currentX - startX);
        container.style.left = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        // 操作終了3秒後に再開
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});
    requestAnimationFrame(step);
</script>
</body>
</html>
