<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none;
        }
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* 横方向にスライドするメインコンテナ */
        #scroll-container {
            position: absolute;
            left: 0;
            top: 0;
            display: flex; 
            flex-direction: row; 
            gap: 15px; /* 列ごとの横の隙間 */
            padding: 10px;
            cursor: grab;
            touch-action: pan-x;
        }
        /* 縦に6つ画像を並べる列ユニット（これが5つ並びます） */
        .column-unit {
            display: flex;
            flex-direction: column;
            gap: 10px; /* 縦の隙間 */
            flex-shrink: 0;
        }
        /* 画像1枚分の窓（枠なし・完全透明） */
        .gift-item {
            width: 140px; 
            height: 140px; 
            overflow: hidden;
            background: transparent;
            border: none; /* 枠フレームなし */
            position: relative;
            pointer-events: none;
        }
        /* 外部サイトの画像切り出し調整 */
        iframe {
            width: 500px; /* 内部解像度 */
            height: 8000px;
            border: none;
            position: absolute;
            left: 50%;
            /* 縮尺調整：画像が窓にぴったり収まるようスケール設定 */
            transform: translateX(-50%) scale(1.1);
            transform-origin: top;
            filter: none;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">

</div>

<script>
    const container = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer, startX, initialPos;

    function step() {
        if (!isPaused) {
            pos -= 0.8; // スピード調整
            if (Math.abs(pos) > container.scrollWidth) {
                pos = window.innerWidth;
            }
            container.style.left = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startX = e.touches ? e.touches[0].pageX : e.pageX;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        if (!isPaused) return;
        const currentX = e.touches ? e.touches[0].pageX : e.pageX;
        pos = initialPos + (currentX - startX);
        container.style.left = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});
    requestAnimationFrame(step);
</script>
</body>
