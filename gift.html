<!DOCTYPE html>
<html style="margin:0; padding:0; overflow:hidden; background:transparent;">
<body style="margin:0; padding:0; background:transparent;">
    <!-- StreamtoearnのURLを直接ここに埋め込みます -->
    <div id="scroll-wrapper" style="position:absolute; top:0; width:100%;">
        <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" 
                style="width:100vw; height:5000px; border:none; background:transparent;"></iframe>
    </div>

    <script>
        let pos = 0;
        const wrapper = document.getElementById('scroll-wrapper');
        // 勝手に動き、一番下まで行ったら勝手に戻る
        setInterval(() => {
            pos -= 1; 
            wrapper.style.top = pos + 'px';
            if (pos < -3000) pos = 600; 
        }, 25);
    </script>
</body>
</html>
