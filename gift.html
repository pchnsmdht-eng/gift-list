<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: transparent; overflow: hidden; user-select: none; }
        
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 手動ドラッグ専用コンテナ：自動スライドは一切なし */
        #scroll-container {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            gap: 15px; /* 列ごとの隙間 */
            padding: 10px;
            cursor: grab;
            touch-action: pan-x;
            will-change: transform;
        }
        #scroll-container:active { cursor: grabbing; }

        /* 
           各列を iframe そのものの幅（400px程度）で表示します。
           変に削ったりずらしたりしないので、画像が消えることはありません。
        */
        .column {
            width: 400px; 
            height: 100vh; 
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        iframe {
            width: 100%; 
            height: 10000px; /* 全アイテムが表示される十分な高さ */
            border: none;
            pointer-events: none; /* ドラッグ操作を優先 */
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- 
           中身をそのまま5列並べます。
           自動で動くことは一切なく、あなたが手で動かした通りにだけ移動します。
        -->
        <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe></div>
        <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe></div>
        <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe></div>
        <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe></div>
        <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe></div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let isDragging = false;
    let startX = 0;
    let currentPos = 0;

    const onStart = (e) => {
        isDragging = true;
        startX = (e.pageX || e.touches[0].pageX) - currentPos;
    };

    const onMove = (e) => {
        if (!isDragging) return;
        currentPos = (e.pageX || e.touches[0].pageX) - startX;
        container.style.transform = `translateX(${currentPos}px)`;
    };

    const onEnd = () => {
        isDragging = false;
    };

    // マウス操作
    container.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);

    // タッチ操作
    container.addEventListener('touchstart', onStart);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('touchend', onEnd);
</script>
</body>
</html>
