<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    #master-container { width: 100%; height: 100%; }
    
    /* 余白を切り取るための窓 */
    .iframe-wrapper {
        width: 100vw;
        height: 100vh;
        overflow: hidden; /* ここで余白を隠す */
        position: relative;
    }
    iframe {
        width: 100vw;
        height: 100vh;
        border: none;
        pointer-events: none;
        position: absolute;
        top: 0;
        left: 0;
    }
</style>
</head>
<body>
    <div id="master-container">
        <div class="iframe-wrapper" id="crop-area">
            <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ここにあなたのFirebase設定を貼り付けてください
        const firebaseConfig = {
          apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc",
          authDomain: "gift-list-app-53ef2.firebaseapp.com",
          projectId: "gift-list-app-53ef2",
          storageBucket: "gift-list-app-53ef2.firebasestorage.app",
          messagingSenderId: "161949465085",
          appId: "1:161949465085:web:3574bdee443e4fcec70194",
          measurementId: "G-B3PJELG3Q9"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const cropArea = document.getElementById('crop-area');

        onValue(ref(db, 'settings'), (snapshot) => {
            const data = snapshot.val() || {};
            // スマホから送られてくる高さ設定（例: 40vh）を反映
            cropArea.style.height = (data.cropHeight || 100) + 'vh';
        });
    </script>
</body>
</html>
