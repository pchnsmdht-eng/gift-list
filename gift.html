<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        #wrapper { width: 100vw; height: 100vh; position: relative; cursor: grab; }
        
        #scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 106px; /* 指定の高さ */
            will-change: transform;
        }

        .item-box {
            position: relative;
            width: 131px; /* 指定の横幅 */
            height: 106px;
            flex-shrink: 0;
        }

        iframe {
            position: absolute;
            width: 131px;
            height: 212px; /* 106pxの2倍（上下2段分） */
            border: none;
            pointer-events: none;
        }

        /* --- 131x106サイズ用の切り抜き調整 --- */
        
        /* 上半分パーツ（1段目） */
        .top-part {
            top: 0;
            clip-path: inset(0 0 50% 0);
        }

        /* 下半分パーツ（2段目を1段目の高さまで持ち上げる） */
        .bottom-part {
            top: 0;
            clip-path: inset(50% 0 0 0);
            transform: translateY(-106px); /* ちょうど1段分持ち上げる */
        }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="scroller"></div>
</div>

<script>
    const TARGET_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const scroller = document.getElementById('scroller');
    const wrapper = document.getElementById('wrapper');

    // 指定サイズ 131px
    const ITEM_WIDTH = 131;

    // 途切れないように多めに（8ペア）生成
    for (let i = 0; i < 8; i++) {
        // 上半分
        const boxTop = document.createElement('div');
        boxTop.className = 'item-box';
        const fTop = document.createElement('iframe');
        fTop.src = TARGET_URL;
        fTop.className = 'top-part';
        boxTop.appendChild(fTop);
        scroller.appendChild(boxTop);

        // 下半分（これが右隣に並ぶ）
        const boxBottom = document.createElement('div');
        boxBottom.className = 'item-box';
        const fBottom = document.createElement('iframe');
        fBottom.src = TARGET_URL;
        fBottom.className = 'bottom-part';
        boxBottom.appendChild(fBottom);
        scroller.appendChild(boxBottom);
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.2; // サイズが小さいので少しゆっくりめに設定

    function animate() {
        if (!isDragging) {
            posX += speed;
            // 2枚（上・下）の合計幅 262px 分流れたらループ
            if (posX <= -(ITEM_WIDTH * 2)) {
                posX = 0;
            }
        }
        scroller.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    // ドラッグ操作
    wrapper.addEventListener('mousedown', (e) => { 
        isDragging = true; 
        startX = e.pageX - posX; 
    });
    window.addEventListener('mousemove', (e) => { 
        if (isDragging) posX = e.pageX - startX; 
    });
    window.addEventListener('mouseup', () => { 
        isDragging = false; 
    });

    animate();
</script>
</body>
</html>
