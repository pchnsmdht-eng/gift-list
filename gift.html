<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        #viewport {
            width: 100vw;
            height: 405px; /* 135px * 3 */
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        .lane {
            width: 100vw;
            height: 135px;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1200px;
            border: none;
            pointer-events: none;
            will-change: transform;
        }

        /* 🔴 シンプルに各段の抜き出し位置を固定 */
        .r1 { top: 0; clip-path: inset(0px 0px 1065px 0px); }
        .r2 { top: 0; clip-path: inset(135px 0px 930px 0px); transform: translateY(-135px); }
        .r3 { top: 0; clip-path: inset(270px 0px 795px 0px); transform: translateY(-270px); }
    </style>
</head>
<body>

<div id="viewport">
    <div class="lane" id="l1"></div>
    <div class="lane" id="l2"></div>
    <div class="lane" id="l3"></div>
</div>

<script>
    const URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 1200;
    const lanes = [document.getElementById('l1'), document.getElementById('l2'), document.getElementById('l3')];

    // 各レーンに2枚ずつiframeを置いてループ（合計6枚、これが限界の軽さです）
    function init() {
        for (let n = 1; n <= 3; n++) {
            const container = document.getElementById(`l${n}`);
            container.innerHTML = ''; 
            for (let i = 0; i < 2; i++) {
                const f = document.createElement('iframe');
                // キャッシュ対策で末尾を変える
                f.src = `${URL}?lane=${n}&i=${i}&t=${Date.now()}`;
                f.className = `r${n}`;
                f.style.left = `${i * W}px`;
                container.appendChild(f);
            }
        }
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.8; // 右から左へ

    function animate() {
        if (!isDragging) {
            posX += speed;
            if (posX <= -W) posX += W;
        }
        
        // 3つのレーンをまとめて動かす
        lanes.forEach(lane => {
            lane.style.transform = `translateX(${posX}px)`;
        });
        
        requestAnimationFrame(animate);
    }

    const vp = document.getElementById('viewport');
    vp.onmousedown = (e) => { isDragging = true; startX = e.pageX - posX; };
    window.onmousemove = (e) => { if (isDragging) posX = e.pageX - startX; };
    window.onmouseup = () => isDragging = false;

    init();
    animate();
</script>
</body>
</html>
