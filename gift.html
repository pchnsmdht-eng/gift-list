<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    
    #master-container { width: 100%; height: 100%; transform-origin: top left; }

    /* 各段の表示枠（はみ出た部分を隠す窓の役割） */
    .row-wrapper {
        width: 100vw;
        height: 33.33vh; /* 画面の1/3の高さ（3段） */
        overflow: hidden;
        position: relative;
    }

    /* 中でスクロールする長いコンテナ（磁石のようなくっつきを実現） */
    .row-container {
        display: flex;
        width: 200vw; /* 画面2つ分の幅を確保 */
        height: 100%;
        will-change: transform;
    }

    /* 外部サイトの読み込み枠 */
    iframe {
        width: 100vw; /* ぴったり画面サイズ */
        height: 100%;
        border: none;
        pointer-events: none;
        flex-shrink: 0; /* 縮むのを防止 */
    }

    /* ハードウェアアクセラレーション（ラグ軽減） */
    .hardware-accel {
        backface-visibility: hidden;
        transform: translateZ(0);
    }

    /* ぴったりループさせるアニメーション（画面1つ分だけスライドして一瞬で戻る） */
    @keyframes slideLeft {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100vw); }
    }

    @keyframes slideRight {
        0% { transform: translateX(-100vw); }
        100% { transform: translateX(0); }
    }
</style>
</head>
<body>
    <div id="master-container">
        <div class="row-wrapper">
            <div class="row-container" id="row1">
                <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
                <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
            </div>
        </div>
        <div class="row-wrapper">
            <div class="row-container" id="row2">
                <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
                <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
            </div>
        </div>
        <div class="row-wrapper">
            <div class="row-container" id="row3">
                <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
                <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        // 取得済みのFirebase設定
        const firebaseConfig = {
          apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc",
          authDomain: "gift-list-app-53ef2.firebaseapp.com",
          projectId: "gift-list-app-53ef2",
          storageBucket: "gift-list-app-53ef2.firebasestorage.app",
          messagingSenderId: "161949465085",
          appId: "1:161949465085:web:3574bdee443e4fcec70194",
          measurementId: "G-B3PJELG3Q9"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const masterContainer = document.getElementById('master-container');
        const rows = document.querySelectorAll('.row-container');

        onValue(ref(db, 'settings'), (snapshot) => {
            const data = snapshot.val() || {};
            const speed = data.speed || 0;
            const size = data.size || 1.0;
            const optimize = data.optimize || false;

            masterContainer.style.transform = `scale(${size})`;

            rows.forEach(row => {
                if(optimize) {
                    row.classList.add('hardware-accel');
                } else {
                    row.classList.remove('hardware-accel');
                }

                if (speed === 0) {
                    row.style.animation = 'none';
                } else {
                    // スピード計算（数値が大きいほど速く流れる）
                    const duration = 50 / Math.abs(speed);
                    const direction = speed > 0 ? 'slideRight' : 'slideLeft';
                    row.style.animation = `${direction} ${duration}s linear infinite`;
                }
            });

            // コントローラーからのPing要求に対し、受け取ったパラメータを添えて送り返す
            if (data.pingRequest) {
                set(ref(db, 'pingResponse'), { 
                    time: data.pingRequest,
                    echoSpeed: speed,
                    echoSize: size,
                    echoOpt: optimize
                });
            }
        });
    </script>
</body>
</html>
