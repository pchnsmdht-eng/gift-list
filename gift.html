<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 1. すべての余白を強制排除 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            overflow: hidden; 
            background: transparent !important; 
            user-select: none;
        }
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* 2. 画像コンテナ（隙間なし） */
        #scroll-container {
            position: absolute;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: row;
            gap: 0; /* 横の隙間なし */
            cursor: grab;
            touch-action: pan-x;
            will-change: transform;
        }
        .column-unit {
            display: flex;
            flex-direction: column;
            gap: 0; /* 縦の隙間なし */
            flex-shrink: 0;
        }
        /* 3. 画像切り出し窓（フレームなし） */
        .gift-item {
            width: 148px; /* 画像の切り出し幅 */
            height: 148px; /* 画像の切り出し高さ */
            overflow: hidden;
            background: transparent;
            border: none !important; /* 枠線を完全に消去 */
            position: relative;
            pointer-events: none;
        }
        iframe {
            width: 500px; /* 内部の解像度 */
            height: 8000px;
            border: none;
            position: absolute;
            left: 50%;
            /* 縮尺調整：窓に画像が収まるようズーム */
            transform: translateX(-50%) scale(1.1);
            transform-origin: top;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- セットA（30枚） -->
        <div id="content-a" style="display: flex; gap: 0;"></div>
        <!-- セットB（ループ用コピー） -->
        <div id="content-b" style="display: flex; gap: 0;"></div>
    </div>
</div>

<script>
    const contentA = document.getElementById('content-a');
    const contentB = document.getElementById('content-b');
    const container = document.getElementById('scroll-container');
    const url = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";

    // 縦6段×横5列の生成
    function buildUnits(target) {
        let giftIdx = 0;
        for (let i = 0; i < 5; i++) {
            let col = document.createElement('div');
            col.className = 'column-unit';
            for (let j = 0; j < 6; j++) {
                let item = document.createElement('div');
                item.className = 'gift-item';
                // 150px刻みで隙間（白線）が出ないように調整
                item.innerHTML = `<iframe src="${url}" style="top: ${giftIdx * -150}px;"></iframe>`;
                col.appendChild(item);
                giftIdx++;
            }
            target.appendChild(col);
        }
    }

    buildUnits(contentA);
    buildUnits(contentB);

    let pos = 0;
    let isPaused = false;
    let resumeTimer, startX, initialPos;

    // 自動スクロール処理
    function move() {
        if (!isPaused) {
            pos -= 1.0; 
            const halfWidth = contentA.offsetWidth;
            // 継ぎ目を感じさせずにワープ
            if (Math.abs(pos) >= halfWidth) {
                pos = 0;
            }
            container.style.transform = `translate3d(${pos}px, 0, 0)`;
        }
        requestAnimationFrame(move);
    }

    // 手動スライドUI（横方向）
    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startX = e.touches ? e.touches[0].pageX : e.pageX;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        if (!isPaused) return;
        const currentX = e.touches ? e.touches[0].pageX : e.pageX;
        pos = initialPos + (currentX - startX);
        
        const halfWidth = contentA.offsetWidth;
        if (pos > 0) pos = -halfWidth;
        if (Math.abs(pos) >= halfWidth) pos = 0;

        container.style.transform = `translate3d(${pos}px, 0, 0)`;
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});

    window.onload = () => { setTimeout(move, 1000); };
</script>
</body>
</html>
