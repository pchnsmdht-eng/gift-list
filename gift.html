<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none;
        }
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* 縦1列に画像を強制整列 */
        #scroll-container {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px; /* 画像ごとの隙間 */
            padding: 0;
            cursor: grab;
            touch-action: pan-y;
        }
        /* 1個の画像を表示する「窓」のサイズ */
        .gift-item {
            width: 130px; /* ここの幅を調整すると画像の切り出し幅が変わる */
            height: 130px; /* ここの高さを調整すると画像の切り出し高さが変わる */
            overflow: hidden;
            background: transparent;
            border: none;
            position: relative;
            flex-shrink: 0;
            pointer-events: none;
        }
        /* 中身のサイトを拡大して、画像だけが窓に収まるように位置調整 */
        iframe {
            width: 500px;
            height: 5000px;
            border: none;
            position: absolute;
            left: 50%;
            /* transformで中心を合わせ、画像が一番綺麗に見える倍率に固定 */
            transform: translateX(-50%) scale(1.1);
            transform-origin: top;
            filter: none;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- 
           画像の縦位置（top）を「画像1枚＋隙間」の分だけ正確にずらしていきます。
           もし画像が上下にズレていたら、-145px, -290px... の数値を10ずつ増減させてください。
        -->
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -5px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -150px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -295px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -440px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -585px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -730px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -875px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1020px;"></iframe></div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer, startY, initialPos;

    function step() {
        if (!isPaused) {
            pos -= 1.0;
            // リストの末尾まで行ったらループ
            if (Math.abs(pos) > container.scrollHeight) {
                pos = window.innerHeight; 
            }
            container.style.top = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startY = e.touches ? e.touches[0].pageY : e.pageY;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        const currentY = e.touches ? e.touches[0].pageY : e.pageY;
        pos = initialPos + (currentY - startY);
        container.style.top = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});
    requestAnimationFrame(step);
</script>
</body>
</html>
