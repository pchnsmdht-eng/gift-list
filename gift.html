<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        #viewport {
            width: 100vw;
            height: 405px; /* 135px * 3段 */
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        #lane-container {
            position: absolute;
            display: flex;
            width: max-content;
            height: 405px;
            will-change: transform;
            left: 0;
        }

        .block {
            display: flex;
            flex-direction: column;
            width: 1200px;
            height: 405px;
            flex-shrink: 0;
        }

        .lane {
            width: 1200px;
            height: 135px;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1500px;
            border: none;
            pointer-events: none;
        }

        /* 🔴 135px刻みで全9段を定義 */
        .r1 { top: 0; clip-path: inset(0px 0px 1365px 0px); }
        .r2 { top: 0; clip-path: inset(135px 0px 1230px 0px); transform: translateY(-135px); }
        .r3 { top: 0; clip-path: inset(270px 0px 1095px 0px); transform: translateY(-270px); }
        .r4 { top: 0; clip-path: inset(405px 0px 960px 0px); transform: translateY(-405px); }
        .r5 { top: 0; clip-path: inset(540px 0px 825px 0px); transform: translateY(-540px); }
        .r6 { top: 0; clip-path: inset(675px 0px 690px 0px); transform: translateY(-675px); }
        .r7 { top: 0; clip-path: inset(810px 0px 555px 0px); transform: translateY(-810px); }
        .r8 { top: 0; clip-path: inset(945px 0px 420px 0px); transform: translateY(-945px); }
        .r9 { top: 0; clip-path: inset(1080px 0px 285px 0px); transform: translateY(-1080px); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="lane-container"></div>
</div>

<script>
    const URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 1200;
    const container = document.getElementById('lane-container');

    // 交代する3つのユニット
    const groups = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];

    function init() {
        container.innerHTML = '';
        // 🔴 シームレス化のために、全3ユニット(3600px分)を「2周分」物理的に繋ぐ
        for (let i = 0; i < 2; i++) {
            groups.forEach(rows => {
                const block = document.createElement('div');
                block.className = 'block';
                rows.forEach(n => {
                    const lane = document.createElement('div');
                    lane.className = 'lane';
                    const f = document.createElement('iframe');
                    f.src = `${URL}?lane=${n}&t=${Date.now()}_${Math.random()}`;
                    f.className = `r${n}`;
                    lane.appendChild(f);
                    block.appendChild(lane);
                });
                container.appendChild(block);
            });
        }
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.8; 

    function animate() {
        if (!isDragging) {
            posX += speed;
            
            // 🔴 3ユニット分（3600px）流れた瞬間に座標をリセット
            // 後ろに2周目が繋がっているので、見た目上の途切れは一切ありません
            const cycleWidth = W * 3;
            if (posX <= -cycleWidth) {
                posX += cycleWidth;
            }
        }
        container.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    const vp = document.getElementById('viewport');
    vp.onmousedown = (e) => { isDragging = true; startX = e.pageX - posX; };
    window.onmousemove = (e) => { if (isDragging) posX = e.pageX - startX; };
    window.onmouseup = () => isDragging = false;

    init();
    animate();
</script>
</body>
</html>
