<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: transparent; overflow: hidden; user-select: none; }
        
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 手動ドラッグ専用コンテナ：自動スライドの命令は一切ありません */
        #scroll-container {
            position: absolute;
            top: 0;
            left: 0;
            cursor: grab;
            touch-action: pan-x;
            will-change: transform;
        }
        #scroll-container:active { cursor: grabbing; }

        /* 元サイトをそのままのサイズで読み込み */
        iframe {
            width: 100vw;
            height: 15000px; /* 全アイテムを出し切るための高さ */
            border: none;
            pointer-events: none; /* ドラッグ操作を優先 */
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- 余計な分割はせず、iframeを1枚だけそのまま読み込みます -->
        <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let currentY = 0;

    const onStart = (e) => {
        isDragging = true;
        const pageX = e.pageX || e.touches[0].pageX;
        const pageY = e.pageY || e.touches[0].pageY;
        startX = pageX - currentX;
        startY = pageY - currentY;
    };

    const onMove = (e) => {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();

        const pageX = e.pageX || e.touches[0].pageX;
        const pageY = e.pageY || e.touches[0].pageY;
        
        currentX = pageX - startX;
        currentY = pageY - startY;

        // 手で動かした通りにだけ移動
        container.style.transform = `translate(${currentX}px, ${currentY}px)`;
    };

    const onEnd = () => { isDragging = false; };

    container.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    container.addEventListener('touchstart', onStart);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onEnd);
</script>
</body>
</html>
