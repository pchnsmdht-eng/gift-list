<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* ウィジェット枠にぴったり収めるためのCSS設定 */
        body { 
            margin: 0; 
            background: transparent; 
            overflow: hidden; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* 4段分（528px）が綺麗に収まる高さに固定 */
        #viewport { 
            width: 100vw; 
            height: 530px; 
            position: relative; 
            overflow: hidden; 
            pointer-events: auto !important;
        }
        
        /* 巨大なギフトシートの塊が、横（Row方向）にスムーズに流れるコンテナ */
        #lane-container { 
            position: absolute; 
            display: flex; 
            flex-direction: row; 
            width: max-content; 
            top: 2px; 
            will-change: transform; 
            transform: translate3d(0, 0, 0); 
            pointer-events: none !important; 
        }

        /* 横7列 × 縦4段 = 28個のギフトが入る巨大な1つの塊（ブロック） */
        .gift-block { 
            display: flex; 
            flex-direction: column; 
            width: 2618px; /* 374px × 7列 = 2618px幅 */
            height: 528px; 
            flex-shrink: 0; 
            margin: 0 !important;
            /* ✨【被り防止】次のループとの間隔をしっかり空けるため、右側に1マス分の空白を設置 */
            margin-right: 374px !important; 
            padding: 0 !important;
        }

        /* ブロック内の各段（行）のトラック */
        .row-track {
            display: flex;
            flex-direction: row;
            width: 2618px;
            height: 132px;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* 成功事例の最も見やすかった1マスのサイズ */
        .gift-frame-wrapper { 
            width: 374px; 
            height: 132px; 
            position: relative; 
            overflow: hidden; 
            flex-shrink: 0;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* 元の3列縦長シート（最大4000px高）をすべて受け止めるサイズ設定 */
        iframe { 
            position: absolute; 
            width: 2000px; 
            height: 4000px; 
            border: none; 
            transform-origin: top left; 
        }

        /* 指でのスワイプやマウスを認識させるための透明な膜（完全維持） */
        #touch-shield { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 9999; 
            background: rgba(0,0,0,0); 
            touch-action: none;
            pointer-events: auto !important;
            cursor: grab;
        }

        /* ✨【アイコンサイズ統一】文字まで綺麗によめる均一なサイズ（60px） */
        iframe { --gift-icon-size: 60px !important; }
        iframe[src*="streamtoearn"] img, 
        iframe[src*="streamtoearn"] .gift-icon, 
        iframe[src*="streamtoearn"] svg {
            width: 60px !important; 
            height: 60px !important; 
            object-fit: contain !important;
        }
    </style>
</head>
<body>
<div id="viewport">
    <div id="touch-shield"></div>
    <div id="lane-container"></div>
</div>
<script>
    const USER = "pchnsmdht-eng", REPO = "gift-list";
    const FRAME_W = 374; 
    const COLS = 7; // 横に7列
    const ROWS = 4; // 縦に4段
    const BLOCK_W = FRAME_W * COLS; // 2618px
    const MARGIN_W = 374; // 右に離す隙間の幅
    const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    
    const container = document.getElementById('lane-container');
    const shield = document.getElementById('touch-shield');
    
    let posX = 0, speed = -1.0, isTouching = false, startX = 0;

    // リモコン（speed.txt）との同期
    async function syncSpeed() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/speed.txt?t=${Date.now()}`);
            const text = await res.text();
            const s = parseFloat(text.trim());
            if(!isNaN(s)) speed = s;
        } catch (e) {}
    }
    setInterval(syncSpeed, 1000);

    // スワイプ・ドラッグ検知（成功事例を完全維持）
    const handleStart = (e) => {
        isTouching = true;
        startX = e.clientX - posX;
        shield.setPointerCapture(e.pointerId);
    };
    const handleMove = (e) => {
        if (!isTouching) return;
        posX = e.clientX - startX;
    };
    const handleEnd = () => { isTouching = false; };

    shield.addEventListener('pointerdown', handleStart);
    shield.addEventListener('pointermove', handleMove);
    shield.addEventListener('pointerup', handleEnd);
    shield.addEventListener('pointercancel', handleEnd);

    // データの再構築：元の3列縦長シートから28個の異なるギフトを綺麗に切り出す
    function init() {
        container.innerHTML = '';

        // スライドがループした際に途切れないよう、塊を3つ横に連結
        for (let loop = 0; loop < 3; loop++) {
            const block = document.createElement('div');
            block.className = 'gift-block';

            for (let r = 1; r <= ROWS; r++) {
                const rowTrack = document.createElement('div');
                rowTrack.className = 'row-track';

                for (let c = 1; c <= COLS; c++) {
                    // 横7個で綺麗に折り返す連番インデックス（1〜28番）
                    const giftIndex = ((r - 1) * COLS) + c;

                    // 🪛【元の3列出力シートから、該当ギフトの位置を正確に逆算】
                    const origRow = Math.ceil(giftIndex / 3);
                    const origCol = (giftIndex - 1) % 3;
                    
                    const topPx = (origRow - 1) * 132;
                    const leftPx = origCol * 374;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'gift-frame-wrapper';

                    const iframe = document.createElement('iframe');
                    iframe.src = SRC; // 元のURLから直接データを取得
                    
                    // 1つずつのギフト枠を寸分の狂いもなくクリッピングして抽出
                    iframe.style.clipPath = `inset(${topPx}px ${2000 - (leftPx + 374)}px ${4000 - (topPx + 132)}px ${leftPx}px)`;
                    iframe.style.transform = `translate3d(-${leftPx}px, -${topPx}px, 0)`;

                    wrapper.appendChild(iframe);
                    rowTrack.appendChild(wrapper);
                }
                block.appendChild(rowTrack);
            }
            container.appendChild(block);
        }
    }

    // 無限ループアニメーション
    function animate() {
        if (!isTouching) {
            posX += speed;
        }
        
        // 1つの塊 ＋ 右マージン分の総横幅 = 2992px
        const totalUnitW = BLOCK_W + MARGIN_W; 

        // 端まで流れたら滑らかに先頭へループ（被らず綺麗に無限に連なる）
        if (posX <= -totalUnitW) posX += totalUnitW;
        else if (posX >= 0) posX -= totalUnitW;
        
        container.style.transform = `translate3d(${posX}px, 0, 0)`;
        requestAnimationFrame(animate);
    }

    init(); syncSpeed(); animate();
</script>
</body>
</html>
