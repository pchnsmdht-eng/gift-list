<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        /* 131px * 3段 + 上部3px = 396px */
        #viewport {
            width: 100vw;
            height: 396px; 
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        #lane-container {
            position: absolute;
            display: flex;
            gap: 0;
            width: max-content;
            height: 393px;
            will-change: transform;
            left: 0;
            top: 3px; /* 指定の上部3px余白 */
        }

        .block {
            display: flex;
            flex-direction: column;
            /* 🔴 左右の黒い余白を削り落とすため、幅を530pxに絞る */
            width: 530px; 
            height: 393px;
            flex-shrink: 0;
            margin: 0;
            padding: 0;
        }

        .lane {
            width: 530px; /* 🔴 ここも連動 */
            height: 131px;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            /* 元のデータ幅1200pxは維持 */
            width: 1200px;
            height: 1500px;
            border: none;
            pointer-events: none;
            /* 🔴 中身を大胆に左にずらして、ギフトの中心を表示させる */
            left: -335px; 
        }

        /* 🔴 131px刻みで、左右を大幅にカットした clip-path */
        /* insetの2番目（右カット）と4番目（左カット）を調整しました */
        .r1 { top: 0; clip-path: inset(0px 335px 1369px 335px); }
        .r2 { top: 0; clip-path: inset(131px 335px 1238px 335px); transform: translateY(-131px); }
        .r3 { top: 0; clip-path: inset(262px 335px 1107px 335px); transform: translateY(-262px); }
        
        .r4 { top: 0; clip-path: inset(393px 335px 976px 335px); transform: translateY(-393px); }
        .r5 { top: 0; clip-path: inset(524px 335px 845px 335px); transform: translateY(-524px); }
        .r6 { top: 0; clip-path: inset(655px 335px 714px 335px); transform: translateY(-655px); }
        
        .r7 { top: 0; clip-path: inset(786px 335px 583px 335px); transform: translateY(-786px); }
        .r8 { top: 0; clip-path: inset(917px 335px 452px 335px); transform: translateY(-917px); }
        .r9 { top: 0; clip-path: inset(1048px 335px 321px 335px); transform: translateY(-1048px); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="lane-container"></div>
</div>

<script>
    const BASE_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 530; // 🔴 精密計算：ギフト同士がピッタリくっつく幅
    const container = document.getElementById('lane-container');

    const groups = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];

    function init() {
        container.innerHTML = '';
        for (let i = 0; i < 2; i++) {
            groups.forEach(rows => {
                const block = document.createElement('div');
                block.className = 'block';
                rows.forEach(n => {
                    const lane = document.createElement('div');
                    lane.className = 'lane';
                    const f = document.createElement('iframe');
                    f.src = `${BASE_URL}?lane=${n}&t=${Date.now()}_${Math.random()}`;
                    f.className = `r${n}`;
                    lane.appendChild(f);
                    block.appendChild(lane);
                });
                container.appendChild(block);
            });
        }
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.8; 

    function animate() {
        if (!isDragging) {
            posX += speed;
            const cycleWidth = W * 3;
            // この新しい幅でループを同期
            if (posX <= -cycleWidth) {
                posX += cycleWidth;
            }
        }
        container.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    const vp = document.getElementById('viewport');
    vp.onmousedown = (e) => { isDragging = true; startX = e.pageX - posX; };
    window.onmousemove = (e) => { if (isDragging) posX = e.pageX - startX; };
    window.onmouseup = () => isDragging = false;

    init();
    animate();
</script>
</body>
</html>
