<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none;
        }
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        #scroll-container {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 10px;
            box-sizing: border-box;
            cursor: grab;
            touch-action: pan-y;
        }
        .gift-item {
            aspect-ratio: 1 / 1;
            width: 90%;
            max-width: 140px;
            overflow: hidden;
            /* 赤いサイドの縦線だけにする */
            border-left: 4px solid #ff0055;
            border-right: 4px solid #ff0055;
            background: rgba(0,0,0,0.6); 
            position: relative;
            flex-shrink: 0;
            pointer-events: none;
        }
        iframe {
            width: 450px; /* サイトを広めに読み込む */
            height: 5000px;
            border: none;
            position: absolute;
            left: 50%;
            /* 拡大率を上げて画像をしっかり中央に持ってくる */
            transform: translateX(-50%) scale(0.9);
            transform-origin: top;
            /* 画像を隠さない程度に明るさを調整（反転をやめました） */
            filter: brightness(1.2); 
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- 
           画像のズレを直すため、topの数値を調整しました。
           もし画像が半分しか映らない場合は、この -160px などの数字を微調整してください。
        -->
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -10px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -170px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -330px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -490px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -650px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -810px;"></iframe></div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer, startY, initialPos;

    function step() {
        if (!isPaused) {
            pos -= 1.2; // 気持ち速めにスライド
            if (Math.abs(pos) > container.scrollHeight) pos = window.innerHeight;
            container.style.top = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startY = e.touches ? e.touches[0].pageY : e.pageY;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        const currentY = e.touches ? e.touches[0].pageY : e.pageY;
        pos = initialPos + (currentY - startY);
        container.style.top = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});
    requestAnimationFrame(step);
</script>
</body>
</html>
