<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* ウィジェット枠にぴったり収めるためのCSS設定 */
        body { 
            margin: 0; 
            background: transparent; 
            overflow: hidden; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* ウィジェット領域：4段分が綺麗に収まる高さ */
        #viewport { 
            width: 100vw; 
            height: 530px; 
            position: relative; 
            overflow: hidden; 
            pointer-events: auto !important;
            transition: height 0.3s ease;
        }
        
        #lane-container { 
            position: absolute; 
            display: flex; 
            flex-direction: column; /* 4つの行トラックを縦に並べる */
            width: max-content; 
            top: 2px; 
            will-change: transform; 
            transform: translate3d(0, 0, 0); 
            pointer-events: none !important; 
        }

        /* 1つの段（行）。横に最大8個（374px × 8 = 2992px）のiframeが隙間なく結合されるトラック */
        .row-track {
            display: flex;
            flex-direction: row;
            width: max-content;
            height: 132px;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* 1マスのサイズ */
        .gift-frame-wrapper { 
            width: 374px; 
            height: 132px; 
            position: relative; 
            overflow: hidden; 
            flex-shrink: 0;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        iframe { 
            position: absolute; 
            width: 400px; 
            height: 1500px; 
            border: none; 
            transform-origin: top left; 
        }

        /* 指でのスワイプやマウスを認識させるための透明な膜 */
        #touch-shield { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 9999; 
            background: rgba(0,0,0,0); 
            touch-action: none;
            pointer-events: auto !important;
            cursor: grab;
        }

        /* ✨【アイコンサイズ統一】不揃いなギフトをすべて綺麗なサイズ（60px）に強制統一 */
        iframe { --gift-icon-size: 60px !important; }
        iframe[src*="streamtoearn"] img, 
        iframe[src*="streamtoearn"] .gift-icon, 
        iframe[src*="streamtoearn"] svg {
            width: 60px !important; 
            height: 60px !important; 
            object-fit: contain !important;
        }

        /* 抽出幅の切り取り補正 */
        .clip-iframe { top: 0; clip-path: inset(0px 5px 1368px 0px); }
        
        /* 自動引き算（4段目非表示）の設定 */
        .hide-4th #row-4 { display: none !important; }
    </style>
</head>
<body>
<div id="viewport">
    <div id="touch-shield"></div>
    <div id="lane-container">
        <div class="row-track" id="row-1"></div>
        <div class="row-track" id="row-2"></div>
        <div class="row-track" id="row-3"></div>
        <div class="row-track" id="row-4"></div>
    </div>
</div>
<script>
    const USER = "pchnsmdht-eng", REPO = "gift-list";
    const FRAME_W = 374; // 1マスの横幅
    const COLUMNS_PER_ROW = 8; // 1本のラインに並べる枠の数（8列）
    const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    
    const container = document.getElementById('lane-container');
    const shield = document.getElementById('touch-shield');
    const viewport = document.getElementById('viewport');
    
    let posX = 0, speed = -1.0, isTouching = false, startX = 0;
    let is4thValid = true;

    // リモコン（speed.txt）との同期（1秒ごと）
    async function syncSpeed() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/speed.txt?t=${Date.now()}`);
            const text = await res.text();
            const s = parseFloat(text.trim());
            if(!isNaN(s)) speed = s;
        } catch (e) {}
    }
    setInterval(syncSpeed, 1000);

    // ウィジェット上でのスワイプ・ドラッグ検知（完全維持）
    const handleStart = (e) => {
        isTouching = true;
        startX = e.clientX - posX;
        shield.setPointerCapture(e.pointerId);
    };
    const handleMove = (e) => {
        if (!isTouching) return;
        posX = e.clientX - startX;
    };
    const handleEnd = () => { isTouching = false; };

    shield.addEventListener('pointerdown', handleStart);
    shield.addEventListener('pointermove', handleMove);
    shield.addEventListener('pointerup', handleEnd);
    shield.addEventListener('pointercancel', handleEnd);

    // 4本のトラック（行）に、横方向に8個（ループ用に3倍連結）のiframeを配置する
    function init() {
        let failedCount = 0;

        for (let r = 1; r <= 4; r++) {
            const track = document.getElementById(`row-${r}`);
            track.innerHTML = '';

            // スライドや追従がループした際に途切れないよう、3ループ分を横に連結
            for (let loop = 0; loop < 3; loop++) {
                for (let c = 1; c <= COLUMNS_PER_ROW; c++) {
                    // 正確なレーン番号の割り当て計算（1行目:1~8、2行目:9~16、3行目:17~24、4行目:25~32）
                    const laneNumber = ((r - 1) * COLUMNS_PER_ROW) + c;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'gift-frame-wrapper';

                    const iframe = document.createElement('iframe');
                    iframe.src = `${SRC}?lane=${laneNumber}`;
                    iframe.className = 'clip-iframe';

                    // 👁️ 4段目の最後の列（32番目のレーン）にデータが存在するか監視
                    if (r === 4 && c === COLUMNS_PER_ROW) {
                        iframe.onload = () => {
                            try {
                                if (!iframe.contentWindow || iframe.contentWindow.length === 0) {
                                    throw new Error("Empty");
                                }
                            } catch (err) {
                                failedCount++;
                                // ギフトが認識されていなければ自動的に4段目を引き算して縮める
                                if (failedCount > 1 && is4thValid) switchTo3Lanes();
                            }
                        };
                        iframe.onerror = () => {
                            failedCount++;
                            if (is4thValid) switchTo3Lanes();
                        };
                    }

                    wrapper.appendChild(iframe);
                    track.appendChild(wrapper);
                }
            }
        }
    }

    // 4段目を非表示にし、高さを400pxに自動縮小する引き算安全装置
    function switchTo3Lanes() {
        is4thValid = false;
        viewport.style.height = "400px";
        document.body.classList.add('hide-4th');
    }

    // 無限ループ追従アニメーション（4つの行をすべて一斉に同調させて横スライド）
    function animate() {
        if (!isTouching) {
            posX += speed;
        }
        
        const maxTrackW = FRAME_W * COLUMNS_PER_ROW; // 8個分の総横幅 = 2992px

        // 端まで流れたら滑らかに先頭へループ（追従を途切れさせない処理）
        if (posX <= -maxTrackW) posX += maxTrackW;
        else if (posX >= 0) posX -= maxTrackW;
        
        const tracks = document.querySelectorAll('.row-track');
        tracks.forEach(t => { 
            t.style.transform = `translate3d(${posX}px, 0, 0)`; 
        });

        requestAnimationFrame(animate);
    }

    init(); syncSpeed(); animate();
</script>
</body>
</html>
