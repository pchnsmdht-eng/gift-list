<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { background-color: transparent; color: #FFFFFF; font-family: "Meiryo", sans-serif; overflow: hidden; margin: 0; padding: 0; }
        .container { width: 450px; height: 100vh; position: relative; }
        
        /* スライド（アニメーション）の設定 */
        .scroll-container {
            display: flex;
            flex-direction: column;
            animation: scrollUp 20s linear infinite; /* 20秒で一周。速度はここで調整 */
        }

        .list-item { 
            display: flex; 
            align-items: center; 
            height: 80px; 
            margin-bottom: 10px; 
            text-shadow: 2px 2px 4px #000; 
        }

        .icon-img { width: 70px; height: 70px; object-fit: contain; margin-right: 20px; }
        .text { font-size: 35px; font-weight: bold; }
        .gift-name { color: #FF69B4; }

        /* 下から上へ流れる動きの定義 */
        @keyframes scrollUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); } /* リストを2倍書いて半分まで送ることでループさせる */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="scroll-container">
            <!-- 100個のギフトリスト（ここをお友達やexeで更新する） -->
            <div class="list-item"><img src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" class="icon-img"><span class="text">GIFT <span class="gift-name">001</span></span></div>
            <div class="list-item"><img src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" class="icon-img"><span class="text">GIFT <span class="gift-name">002</span></span></div>
            <!-- ... (ここに必要な数だけ並べる) ... -->
            
            <!-- ループを滑らかにするために同じ内容を下にコピーして配置 -->
            <div class="list-item"><img src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" class="icon-img"><span class="text">GIFT <span class="gift-name">001</span></span></div>
            <div class="list-item"><img src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" class="icon-img"><span class="text">GIFT <span class="gift-name">002</span></span></div>
        </div>
    </div>
</body>
</html>
