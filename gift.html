<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        #viewport { width: 100vw; height: 400px; position: relative; overflow: hidden; cursor: grab; }
        
        #lane-container { 
            position: absolute; display: flex; width: max-content; height: 396px;
            top: 2px;
            will-change: transform; transform: translate3d(0, 0, 0); pointer-events: none;
        }

        /* 1ブロックの幅を指定された132pxに合わせて固定 */
        .block { display: flex; flex-direction: column; width: 132px; height: 396px; flex-shrink: 0; margin-right: 5px; }
        
        /* 1段の高さを131pxに固定 */
        .lane { 
            width: 132px; 
            height: 131px; 
            position: relative; 
            overflow: hidden; 
            margin-bottom: 1px;
            background: transparent;
        }
        
        iframe { 
            position: absolute; 
            width: 1200px; 
            height: 1500px; 
            border: none; 
            background: transparent;
            transform-origin: top left;
        }

        /* 🔴 指定された123pxと132pxを基準に、重ならないように切り抜き */
        /* r1〜r3: 1段目（上・中・下） */
        .r1 { top: 0; clip-path: inset(0px 1068px 1369px 0px); }
        .r2 { top: 0; clip-path: inset(132px 1068px 1237px 0px); transform: translateY(-132px); }
        .r3 { top: 0; clip-path: inset(264px 1068px 1105px 0px); transform: translateY(-264px); }

        /* r4〜r6: 2段目（上・中・下） */
        .r4 { top: 0; clip-path: inset(396px 1068px 973px 0px); transform: translateY(-396px); }
        .r5 { top: 0; clip-path: inset(528px 1068px 841px 0px); transform: translateY(-528px); }
        .r6 { top: 0; clip-path: inset(660px 1068px 709px 0px); transform: translateY(-660px); }

        #touch-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: transparent; }
    </style>
</head>
<body>
<div id="viewport">
    <div id="touch-overlay"></div>
    <div id="lane-container"></div>
</div>
<script>
    const USER = "pchnsmdht-eng";
    const REPO = "gift-list";
    const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 137; // blockの幅(132) + 余白(5)
    const container = document.getElementById('lane-container');
    const overlay = document.getElementById('touch-overlay');
    let posX = 0; let speed = -1.0; let isDragging = false; let startX = 0;

    async function syncSpeed() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/speed.txt?t=${Date.now()}`);
            const text = await res.text();
            if(!isNaN(text) && text.trim() !== "") speed = parseFloat(text);
        } catch (e) {}
    }
    setInterval(syncSpeed, 3000);

    function init() {
        container.innerHTML = '';
        // 縦3つを1セットとして、横にたくさん並べてループさせる
        for (let i = 0; i < 15; i++) {
            [[1,2,3],[4,5,6]].forEach(rows => {
                const b = document.createElement('div'); b.className = 'block';
                rows.forEach(n => {
                    const l = document.createElement('div'); l.className = 'lane';
                    const f = document.createElement('iframe');
                    f.className = `r${n}`;
                    f.src = `${SRC}?lane=${n}`;
                    l.appendChild(f); b.appendChild(l);
                });
                container.appendChild(b);
            });
        }
    }

    overlay.addEventListener('pointerdown', (e) => { isDragging = true; startX = e.clientX - posX; overlay.setPointerCapture(e.pointerId); });
    overlay.addEventListener('pointermove', (e) => { if (!isDragging) return; posX = e.clientX - startX; });
    overlay.addEventListener('pointerup', () => isDragging = false);

    function animate() {
        if (!isDragging) {
            posX += speed;
            const totalW = W * 30; // ブロック数に合わせてループ
            if (posX <= -totalW) posX += totalW;
            if (posX > 0) posX -= totalW;
        }
        container.style.transform = `translate3d(${posX}px, 0, 0)`;
        requestAnimationFrame(animate);
    }
    init(); syncSpeed(); animate();
</script>
</body>
</html>
