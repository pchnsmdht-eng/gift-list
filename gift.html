<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none; 
        }
        /* 指定サイズ W155 H600 の表示エリア */
        #viewport {
            width: 155px;
            height: 600px;
            overflow: hidden;
            position: relative;
        }
        /* スライドする中身のコンテナ（2列グリッド） */
        #scroll-container {
            position: absolute;
            top: 0;
            width: 155px;
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2列に整列 */
            gap: 5px;
            padding: 5px;
            box-sizing: border-box;
            cursor: grab;
            touch-action: pan-y;
        }
        /* 画像1枚分を切り出す枠（2列用にサイズ調整） */
        .gift-item {
            width: 70px; 
            height: 70px;
            overflow: hidden;
            border: 1px solid #ff0055;
            background: rgba(0,0,0,0.8);
            border-radius: 6px;
            position: relative;
            pointer-events: none;
        }
        /* 埋め込む外部サイト */
        iframe {
            width: 400px;
            height: 5000px;
            border: none;
            position: absolute;
            /* 画像の中央が見えるように調整 */
            left: -165px; 
            transform: scale(0.6); /* 2列用に少し縮小 */
            transform-origin: top left;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- topの値を調整して、表示したい画像を並べる -->
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: 0px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -100px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -200px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -300px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -400px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -500px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -600px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -700px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -800px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -900px;"></iframe></div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer;
    let startY, initialPos;

    // 自動スライド
    function step() {
        if (!isPaused) {
            pos -= 1;
            // 全て流れきったらループ
            if (Math.abs(pos) > container.scrollHeight) {
                pos = 600; 
            }
            container.style.top = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    // スライド操作
    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startY = e.touches ? e.touches[0].pageY : e.pageY;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        const currentY = e.touches ? e.touches[0].pageY : e.pageY;
        pos = initialPos + (currentY - startY);
        container.style.top = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});

    requestAnimationFrame(step);
</script>
</body>
</html>
