<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { background-color: transparent; color: #FFFFFF; font-family: "Meiryo", sans-serif; overflow: hidden; margin: 0; padding: 0; }
        .container { width: 450px; height: 250px; position: relative; }
        .list-item { display: flex; align-items: center; height: 80px; margin-bottom: 10px; text-shadow: 2px 2px 4px #000; }
        .icon-img { width: 70px; height: 70px; object-fit: contain; margin-right: 20px; }
        .text { font-size: 35px; font-weight: bold; }
        .gift-name { color: #FF69B4; }
    </style>
</head>
<body>
    <div class="container">
        <marquee direction="up" scrollamount="3" style="height: 250px;">
            <div class="list-item"><img src="Rose.png" class="icon-img"><span class="text"><span class="gift-name">バラ</span> ＝ 車変更</span></div>
            <div class="list-item"><img src="Ice Cream.png" class="icon-img"><span class="text"><span class="gift-name">アイス</span> ＝ 修理</span></div>
            <div class="list-item"><img src="Finger Heart.png" class="icon-img"><span class="text"><span class="gift-name">指ハート</span> ＝ 加速</span></div>
            <div class="list-item"><img src="Doughnut.png" class="icon-img"><span class="text"><span class="gift-name">ドーナッツ</span> ＝ 低重力</span></div>
            <div class="list-item"><img src="Money Gun.png" class="icon-img"><span class="text"><span class="gift-name">マネーガン</span> ＝ 大爆発</span></div>
            <div class="list-item"><img src="GG.png" class="icon-img"><span class="text"><span class="gift-name">GG</span> ＝ 武装集団</span></div>
            <div class="list-item"><img src="Heart.png" class="icon-img"><span class="text"><span class="gift-name">いいね</span> ＝ 指名手配MAX</span></div>
        </marquee>
    </div>
</body>
</html>
