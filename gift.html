<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none;
        }
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* 移動するコンテナ：中身を2倍にしてループの隙間を埋める */
        #scroll-container {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex; 
            flex-direction: row; 
            gap: 20px;
            padding: 20px;
            cursor: grab;
            touch-action: pan-x;
            white-space: nowrap;
        }
        .column-unit {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
        }
        .gift-item {
            width: 140px; 
            height: 140px; 
            overflow: hidden;
            background: transparent;
            border: none;
            position: relative;
            pointer-events: none;
        }
        iframe {
            width: 500px;
            height: 8000px;
            border: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scale(1.1);
            transform-origin: top;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container" shadow-root="open">
        <!-- JavaScriptで画像を生成します -->
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    const url = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";

    // 縦6段×横5列を「2セット」作ることで、ループの継ぎ目を消す
    function createGifts() {
        for (let loop = 0; loop < 2; loop++) { // 2セット生成
            let giftIndex = 0;
            for (let i = 0; i < 5; i++) {
                let col = document.createElement('div');
                col.className = 'column-unit';
                for (let j = 0; j < 6; j++) {
                    let item = document.createElement('div');
                    item.className = 'gift-item';
                    item.innerHTML = `<iframe src="${url}" style="top: ${giftIndex * -155}px;"></iframe>`;
                    col.appendChild(item);
                    giftIndex++;
                }
                container.appendChild(col);
            }
        }
    }
    createGifts();

    let pos = 0;
    let isPaused = false;
    let resumeTimer, startX, initialPos;

    function step() {
        if (!isPaused) {
            pos -= 1.0; 
            // 半分（1セット分）進んだら、瞬時に位置を0に戻す（これで無限に見える）
            const halfWidth = container.scrollWidth / 2;
            if (Math.abs(pos) >= halfWidth) {
                pos = 0;
            }
            container.style.transform = `translate3d(${pos}px, -50%, 0)`;
        }
        requestAnimationFrame(step);
    }

    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startX = e.touches ? e.touches[0].pageX : e.pageX;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        const currentX = e.touches ? e.touches[0].pageX : e.pageX;
        pos = initialPos + (currentX - startX);
        
        // 手動操作時もループの範囲を超えないよう調整
        const halfWidth = container.scrollWidth / 2;
        if (pos > 0) pos = -halfWidth;
        if (Math.abs(pos) >= halfWidth) pos = 0;

        container.style.transform = `translate3d(${pos}px, -50%, 0)`;
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});
    requestAnimationFrame(step);
</script>
</body>
</html>
