<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: transparent; overflow: hidden; }
        
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* スライドするコンテナ */
        #scroll-container {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            gap: 10px; /* 列ごとの間隔 */
            will-change: transform;
        }

        /* 1列（6枚分）の窓 */
        .column {
            width: 150px; 
            height: 940px; 
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        iframe {
            width: 450px; 
            height: 12000px;
            border: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scale(1.02); 
            transform-origin: top;
            pointer-events: none;
        }

        /* AセットとBセットの区切りをなくすためのラップ */
        .set {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- セットA -->
        <div class="set" id="set-a">
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -5px;"></iframe></div>
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -945px;"></iframe></div>
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1885px;"></iframe></div>
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -2825px;"></iframe></div>
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -3765px;"></iframe></div>
        </div>
        <!-- セットB（ループの継ぎ目を埋める用） -->
        <div class="set" id="set-b">
            <!-- セットAと同じ内容を配置 -->
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    const setA = document.getElementById('set-a');
    const setB = document.getElementById('set-b');

    // セットAをセットBにコピーして無限ループを物理的に作る
    setB.innerHTML = setA.innerHTML;

    let pos = 0;
    const speed = 0.8; // スピード調整

    function move() {
        pos -= speed;
        
        // セットAの横幅分（列幅+間隔の合計）移動したら位置をリセット
        // これにより、見た目の変化なしに無限にループし続けます
        const resetPoint = setA.offsetWidth + 10; 
        
        if (Math.abs(pos) >= resetPoint) {
            pos = 0;
        }
        
        container.style.transform = `translateX(${pos}px)`;
        requestAnimationFrame(move);
    }

    // ページ読み込み完了後にスライドを開始
    window.onload = () => {
        setTimeout(move, 2000);
    };
</script>
</body>
</html>
