<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* ウィジェット枠にぴったり収めるためのCSS設定 */
        body { 
            margin: 0; 
            background: transparent; 
            overflow: hidden; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* 4段分（528px）が綺麗に収まる高さに完全固定 */
        #viewport { 
            width: 100vw; 
            height: 530px; 
            position: relative; 
            overflow: hidden; 
            pointer-events: auto !important;
        }
        
        #lane-container { 
            position: absolute; 
            display: flex; 
            width: max-content; 
            top: 2px; 
            will-change: transform; 
            transform: translate3d(0, 0, 0); 
            pointer-events: none !important; 
        }

        /* 成功事例の1122px幅、高さは4段分の528pxに固定 */
        .block { 
            display: flex; 
            flex-direction: column; 
            width: 1122px; 
            height: 528px; 
            flex-shrink: 0; 
            margin: 0 !important;
            padding: 0 !important;
        }
        
        .lane { 
            width: 1122px; 
            height: 132px; 
            position: relative; 
            overflow: hidden; 
            margin: 0 !important;
            padding: 0 !important;
        }
        
        iframe { 
            position: absolute; 
            width: 1200px; 
            height: 1500px; 
            border: none; 
            transform-origin: top left; 
        }

        /* 指でのスワイプやマウスを認識させるための透明な膜 */
        #touch-shield { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 9999; 
            background: rgba(0,0,0,0); 
            touch-action: none;
            pointer-events: auto !important;
            cursor: grab;
        }

        /* ✨【アイコンサイズ統一】文字まで綺麗によめる均一なサイズ（60px） */
        iframe { --gift-icon-size: 60px !important; }
        iframe[src*="streamtoearn"] img, 
        iframe[src*="streamtoearn"] .gift-icon, 
        iframe[src*="streamtoearn"] svg {
            width: 60px !important; 
            height: 60px !important; 
            object-fit: contain !important;
        }

        /* 👁️‍🗨️ 灰色の細い枠線のズレを完全に防ぐ5px補正のカット位置（4段目まで網羅） */
        .r1 { top: 0; clip-path: inset(0px 5px 1368px 0px); }
        .r2 { top: 0; clip-path: inset(132px 5px 1236px 0px); transform: translateY(-132px); }
        .r3 { top: 0; clip-path: inset(264px 5px 1104px 0px); transform: translateY(-264px); }
        .r4 { top: 0; clip-path: inset(396px 5px 972px 0px); transform: translateY(-396px); }
        
        .r5 { top: 0; clip-path: inset(528px 5px 840px 0px); transform: translateY(-528px); }
        .r6 { top: 0; clip-path: inset(660px 5px 708px 0px); transform: translateY(-660px); }
        .r7 { top: 0; clip-path: inset(792px 5px 576px 0px); transform: translateY(-792px); }
        .r8 { top: 0; clip-path: inset(924px 5px 444px 0px); transform: translateY(-924px); }
    </style>
</head>
<body>
<div id="viewport">
    <div id="touch-shield"></div>
    <div id="lane-container"></div>
</div>
<script>
    const USER = "pchnsmdht-eng", REPO = "gift-list", W = 1122;
    const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const container = document.getElementById('lane-container');
    const shield = document.getElementById('touch-shield');
    
    let posX = 0, speed = -1.0, isTouching = false, startX = 0;

    // リモコン（speed.txt）との同期
    async function syncSpeed() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/speed.txt?t=${Date.now()}`);
            const text = await res.text();
            const s = parseFloat(text.trim());
            if(!isNaN(s)) speed = s;
        } catch (e) {}
    }
    setInterval(syncSpeed, 1000);

    // スワイプ・ドラッグ検知（成功事例を完全維持）
    const handleStart = (e) => {
        isTouching = true;
        startX = e.clientX - posX;
        shield.setPointerCapture(e.pointerId);
    };
    const handleMove = (e) => {
        if (!isTouching) return;
        posX = e.clientX - startX;
    };
    const handleEnd = () => { isTouching = false; };

    shield.addEventListener('pointerdown', handleStart);
    shield.addEventListener('pointermove', handleMove);
    shield.addEventListener('pointerup', handleEnd);
    shield.addEventListener('pointercancel', handleEnd);

    // データ読み込み：「横3個×2ブロック ＝ 横6個」、縦に4段のデータ構造
    function init() {
        container.innerHTML = '';

        // 成功事例のロジックを継承：
        // 横に6個並べるために、3個幅のブロックを2つ（1122px × 2）用意し、中にそれぞれ4段ずつ積みます
        const blocksData = [
            [1, 2, 3, 4],   // 左側のブロック（1〜4行目、横3個×縦4段）
            [5, 6, 7, 8]    // 右側のブロック（5〜8行目、横3個×縦4段）
        ];

        // スライドがループした際に途切れないよう、横に5ループ分連結
        for (let loop = 0; loop < 5; loop++) {
            blocksData.forEach((rows) => {
                const b = document.createElement('div'); 
                b.className = 'block';

                rows.forEach(n => {
                    const l = document.createElement('div'); 
                    l.className = 'lane';
                    
                    const f = document.createElement('iframe');
                    f.src = `${SRC}?lane=${n}`;
                    f.className = `r${n}`;

                    l.appendChild(f); 
                    b.appendChild(l);
                });
                container.appendChild(b);
            });
        }
    }

    // 無限ループアニメーション
    function animate() {
        if (!isTouching) {
            posX += speed;
        }
        
        // 2ブロック分（横6個分）の総横幅 ＝ 2244px で滑らかにループ
        const unitW = W * 2; 

        if (posX <= -unitW) posX += unitW;
        else if (posX >= 0) posX -= unitW;
        
        container.style.transform = `translate3d(${posX}px, 0, 0)`;
        requestAnimationFrame(animate);
    }

    init(); syncSpeed(); animate();
</script>
</body>
</html>
