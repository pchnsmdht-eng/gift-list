<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }

        /* 表示枠はあなたの指定した「横5列(1870px) × 縦3段(400px)」で完全固定 */
        #viewport { 
            width: 1870px; /* 374px × 5列 = 1870px */
            height: 400px; /* 132px × 3段 = 396px */
            position: relative; 
            overflow: hidden; 
            pointer-events: auto !important;
        }
        
        #lane-container { 
            position: absolute; 
            display: flex; 
            flex-direction: row;
            width: max-content; 
            top: 2px; 
            will-change: transform; 
            transform: translate3d(0, 0, 0); 
            pointer-events: none !important; 
        }

        /* 成功事例の1122px幅、高さは3段分の396pxに完全最適化 */
        .block { 
            display: flex; 
            flex-direction: column; 
            width: 1122px; 
            height: 396px; 
            flex-shrink: 0; 
            margin: 0 !important;
            padding: 0 !important;
        }
        
        .lane { 
            width: 1122px; 
            height: 132px; 
            position: relative; 
            overflow: hidden; 
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* 巨大シートをすべて受け止めるサイズ設定 */
        iframe { 
            position: absolute; 
            width: 1200px; 
            height: 8000px; 
            border: none; 
            transform-origin: top left; 
        }

        #touch-shield { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 9999; 
            background: rgba(0,0,0,0); 
            touch-action: none;
            pointer-events: auto !important;
            cursor: grab;
        }

        /* ✨【アイコンサイズ統一】文字まで綺麗によめる均一なサイズ（60px） */
        iframe { --gift-icon-size: 60px !important; }
        iframe[src*="streamtoearn"] img, 
        iframe[src*="streamtoearn"] .gift-icon, 
        iframe[src*="streamtoearn"] svg {
            width: 60px !important; height: 60px !important; object-fit: contain !important;
        }
    </style>
</head>
<body>
<div id="viewport">
    <div id="touch-shield"></div>
    <div id="lane-container"></div>
</div>
<script>
    const USER = "pchnsmdht-eng", REPO = "gift-list", W = 1122;
    const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const container = document.getElementById('lane-container');
    const shield = document.getElementById('touch-shield');
    
    let posX = 0, speed = -1.0, isTouching = false, startX = 0;
    let currentGiftCount = 50; // デフォルト50個
    let totalBlocksCount = 0;

    // リモコン（speed.txt）との同期
    async function syncSpeed() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/speed.txt?t=${Date.now()}`);
            const text = await res.text();
            const parts = text.trim().split(',');
            
            const s = parseFloat(parts[0]);
            if(!isNaN(s)) speed = s;
            
            // リモコンから送られてきた個数を読み取る
            const c = parts[1] ? parseInt(parts[1], 10) : 50;
            if(!isNaN(c) && currentGiftCount !== c) {
                currentGiftCount = c;
                init(); // 個数が切り替わったらその瞬間に裏の部屋の広さをリサイズ！
            }
        } catch (e) {}
    }
    setInterval(syncSpeed, 1000);

    // スワイプ・ドラッグ検知（完全維持）
    const handleStart = (e) => {
        isTouching = true;
        startX = e.clientX - posX;
        shield.setPointerCapture(e.pointerId);
    };
    const handleMove = (e) => {
        if (!isTouching) return;
        posX = e.clientX - startX;
    };
    const handleEnd = () => { isTouching = false; };

    shield.addEventListener('pointerdown', handleStart);
    shield.addEventListener('pointermove', handleMove);
    shield.addEventListener('pointerup', handleEnd);
    shield.addEventListener('pointercancel', handleEnd);

    // ⚡【全自動リサイズ構造】選択された個数に応じて、必要なブロック数だけをぴったり生成！
    function init() {
        container.innerHTML = '';

        const linesNeeded = Math.ceil(currentGiftCount / 3);
        const blocksCount = Math.ceil(linesNeeded / 3);

        const blocksData = [];
        for (let i = 0; i < blocksCount; i++) {
            const startLine = i * 3 + 1;
            blocksData.push([startLine, startLine + 1, startLine + 2]);
        }

        totalBlocksCount = blocksData.length;

        // ループ用に3回連結
        for (let loop = 0; loop < 3; loop++) {
            blocksData.forEach((rows) => {
                const b = document.createElement('div'); 
                b.className = 'block';

                rows.forEach(n => {
                    const l = document.createElement('div'); l.className = 'lane';
                    const f = document.createElement('iframe');
                    f.src = `${SRC}?lane=${n}`;

                    // 灰色の枠線ズレ（5px補正）を全自動で計算してカット
                    const topPx = (n - 1) * 132;
                    f.style.clipPath = `inset(${topPx}px 5px ${8000 - (topPx + 132)}px 0px)`;
                    f.style.transform = `translate3d(0, -${topPx}px, 0)`;

                    l.appendChild(f); b.appendChild(l);
                });
                container.appendChild(b);
            });
        }
    }

    // 無限ループアニメーション
    function animate() {
        if (!isTouching) {
            posX += speed;
        }
        
        // 実際のデータ量に1ミリの狂いもなくジャストフィットした総横幅でループ！
        const unitW = W * totalBlocksCount; 

        if (posX <= -unitW) posX += unitW;
        else if (posX >= 0) posX -= unitW;
        
        container.style.transform = `translate3d(${posX}px, 0, 0)`;
        requestAnimationFrame(animate);
    }

    init(); syncSpeed(); animate();
</script>
</body>
</html>
