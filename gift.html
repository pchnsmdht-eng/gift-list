<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        /* 縦130pxを3つ積み上げ、合計390pxのコンテナ */
        #main-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 390px; /* 130 * 3 */
        }

        /* 各段（レーン）の高さ130px固定 */
        .lane {
            width: 100vw;
            height: 130px;
            position: relative;
            overflow: hidden;
        }

        /* 横に流れるコンベア */
        .scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 130px;
            will-change: transform;
        }

        /* 各セルのサイズ：高さ130pxに合わせる */
        .cell {
            position: relative;
            width: 160px; /* 横幅はアイコンが切れない程度に設定 */
            height: 130px;
            flex-shrink: 0;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1200px;
            border: none;
            pointer-events: none;
            transform-origin: 0 0;
            /* アイコンが130pxの高さに綺麗に収まるよう倍率を調整 */
            transform: scale(1.0); 
        }

        /* --- 各段の抜き出し位置（130px間隔で調整） --- */
        .row-1 { clip-path: inset(0px 1040px 1070px 0px); }
        .row-2 { 
            clip-path: inset(130px 1040px 940px 0px); 
            transform: translateY(-130px); 
        }
        .row-3 { 
            clip-path: inset(260px 1040px 810px 0px); 
            transform: translateY(-260px); 
        }
    </style>
</head>
<body>

<div id="main-container">
    <div class="lane"><div class="scroller" id="lane1"></div></div>
    <div class="lane"><div class="scroller" id="lane2"></div></div>
    <div class="lane"><div class="scroller" id="lane3"></div></div>
</div>

<script>
    const URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const CELL_W = 160; 
    let positions = [0, 0, 0];
    let isDragging = false;
    let startX = 0;

    // 各段にセルを流し込む（横無限に見えるよう多めに生成）
    for (let n = 1; n <= 3; n++) {
        const scroller = document.getElementById(`lane${n}`);
        for (let i = 0; i < 20; i++) {
            const div = document.createElement('div');
            div.className = 'cell';
            const f = document.createElement('iframe');
            f.src = URL;
            f.className = `row-${n}`;
            div.appendChild(f);
            scroller.appendChild(div);
        }
    }

    function animate() {
        if (!isDragging) {
            for (let i = 0; i < 3; i++) {
                positions[i] -= 1.5; // スピード
                // 1セル分進んだら位置を戻して無限ループ
                if (positions[i] <= -CELL_W) positions[i] += CELL_W;
                document.getElementById(`lane${i+1}`).style.transform = `translateX(${positions[i]}px)`;
            }
        }
        requestAnimationFrame(animate);
    }

    // ドラッグUI：左右にスライドして確認可能
    const container = document.getElementById('main-container');
    container.onmousedown = (e) => { isDragging = true; startX = e.pageX; this.oldP = [...positions]; };
    window.onmousemove = (e) => {
        if (!isDragging) return;
        const diff = e.pageX - startX;
        for (let i = 0; i < 3; i++) {
            positions[i] = this.oldP[i] + diff;
            document.getElementById(`lane${i+1}`).style.transform = `translateX(${positions[i]}px)`;
        }
    };
    window.onmouseup = () => isDragging = false;

    animate();
</script>
</body>
</html>
