<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            overflow: hidden; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* 画面はいつもの4段分（528px）のコンパクトなサイズに固定 */
        #viewport { 
            width: 100vw; 
            height: 528px; 
            position: relative; 
            overflow: hidden; 
            transition: height 0.3s ease;
        }
        
        /* 4つの段（行）を管理するコンテナ */
        #lane-container { 
            position: absolute; 
            display: flex; 
            flex-direction: column; 
            top: 0; 
            left: 0;
            width: max-content;
        }

        /* 1つの段（行）。横に最大8つのiframe（4個は画面内、残りの4個は右の場外）が隙間なく並ぶトラック */
        .row-track {
            display: flex;
            flex-direction: row;
            width: max-content;
            height: 132px;
            margin: 0 !important;
            padding: 0 !important;
            will-change: transform;
            transform: translate3d(0, 0, 0);
        }
        
        /* 1つのギフトアイコン枠（横374px × 縦132px） */
        .gift-frame-wrapper { 
            width: 374px; 
            height: 132px; 
            position: relative; 
            overflow: hidden; 
            flex-shrink: 0;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        iframe { 
            position: absolute; 
            width: 400px; 
            height: 1500px; 
            border: none; 
            transform-origin: top left; 
        }

        /* ✨【アイコンサイズ統一】不揃いなギフトをすべて綺麗なサイズ（60px）に揃える命令 */
        iframe {
            --gift-icon-size: 60px !important;
        }
        iframe[src*="streamtoearn"] img, 
        iframe[src*="streamtoearn"] .gift-icon,
        iframe[src*="streamtoearn"] svg {
            width: 60px !important;
            height: 60px !important;
            object-fit: contain !important;
        }

        /* 各iframeの表示切り取り位置を1ミリの狂いもなく完全補正 */
        .clip-iframe { top: 0; clip-path: inset(0px 5px 1368px 0px); }

        /* 不要な段を自動で引き算して消すためのクラス */
        .hide-4th #row-4 { display: none !important; }
    </style>
</head>
<body>
<div id="viewport">
    <div id="lane-container">
        <div class="row-track" id="row-1"></div>
        <div class="row-track" id="row-2"></div>
        <div class="row-track" id="row-3"></div>
        <div class="row-track" id="row-4"></div>
    </div>
</div>

<script>
    const FRAME_W = 374; // 1マスの横幅
    const COLUMNS_PER_ROW = 8; // 1本のラインに並べる最大数（8個）
    const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const BIN_URL = "https://api.jsonbin.io/v3/b/6614f17be41b4d34e4dede5b/latest";
    
    let posX = 0;
    let speed = 0; 
    let is4thValid = true;

    // 4本の段（行）に対して、それぞれ右側へ向かって合計8個のiframeをズラリと連結する
    function init() {
        let failedCount = 0;

        for (let r = 1; r <= 4; r++) {
            const track = document.getElementById(`row-${r}`);
            track.innerHTML = '';

            // スライドした時に途切れないよう、8個のセットを3ループ分（24列分）横に繋げておく
            for (let loop = 0; loop < 3; loop++) {
                for (let c = 1; c <= COLUMNS_PER_ROW; c++) {
                    // 各マスに正しいレーン番号を割り当て
                    // （1段目の1〜8個目=lane1〜8、4段目の1〜8個目=lane25〜32）
                    const laneNumber = ((r - 1) * COLUMNS_PER_ROW) + c;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'gift-frame-wrapper';

                    const iframe = document.createElement('iframe');
                    iframe.src = `${SRC}?lane=${laneNumber}`;
                    iframe.className = 'clip-iframe';

                    // 👁️【自動引き算判定】4段目の後半（8個目の枠など）にギフトが認識されているかチェック
                    if (r === 4 && c === COLUMNS_PER_ROW) {
                        iframe.onload = () => {
                            try {
                                if (!iframe.contentWindow || iframe.contentWindow.length === 0) throw new Error();
                            } catch (e) {
                                failedCount++;
                                // もしデータが認識されていなければ、自動的に4段目を引き算して画面を縮める
                                if (failedCount > 1 && is4thValid) switchTo3Lanes();
                            }
                        };
                        iframe.onerror = () => {
                            failedCount++;
                            if (is4thValid) switchTo3Lanes();
                        };
                    }

                    wrapper.appendChild(iframe);
                    track.appendChild(wrapper);
                }
            }
        }
    }

    // 4段目が不要なときに自動で高さを引き算する（3段分 396px に縮める）
    function switchTo3Lanes() {
        is4thValid = false;
        document.getElementById('viewport').style.height = "396px";
        document.body.classList.add('hide-4th');
    }

    // スピコンの数値を読み込む
    async function checkSpeed() {
        try {
            const res = await fetch(BIN_URL);
            if (res.ok) { 
                const data = await res.json();
                if (data && data.record && typeof data.record.speed === 'number') {
                    speed = data.record.speed;
                }
            }
        } catch (e) {}
    }

    // ⏱️ 右へ左へ、後ろからピッタリ追従してついてくる滑らかなスクロール処理
    function animate() {
        const maxTrackW = FRAME_W * COLUMNS_PER_ROW; // 8個分の総横幅（2992px）

        if (speed !== 0) {
            // スライダーの指示通りに、横に並んだアイコンを追従スクロール
            posX += (speed * 0.7); 

            // 端まで流れたら滑らかに先頭へループ（追従が途切れないようにする）
            if (posX <= -maxTrackW) posX += maxTrackW;
            else if (posX >= 0) posX -= maxTrackW;
            
            // 4つの段（行）をすべて同じ速度で一斉に横スライド
            const tracks = document.querySelectorAll('.row-track');
            tracks.forEach(t => {
                t.style.transform = `translate3d(${posX}px, 0, 0)`;
            });
        }
        requestAnimationFrame(animate);
    }

    setInterval(checkSpeed, 1000); 
    init(); 
    animate();
</script>
</body>
</html>
