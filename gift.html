<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        /* 縦130px × 3段 = 390px の固定エリア */
        #viewport {
            width: 100vw;
            height: 390px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        /* 3つの段を一つのユニットとして右へ流す */
        #scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 390px;
            will-change: transform;
        }

        /* データの1ブロック（1200px幅） */
        .data-block {
            display: flex;
            flex-direction: column;
            width: 1200px;
            height: 390px;
            flex-shrink: 0;
        }

        .lane {
            width: 1200px;
            height: 130px;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1200px;
            border: none;
            pointer-events: none;
            transform-origin: 0 0;
        }

        /* 🔴 抜き出し位置の設定 */
        .r1 { top: 0; clip-path: inset(0px 0px 1070px 0px); }
        .r2 { top: 0; clip-path: inset(130px 0px 940px 0px); transform: translateY(-130px); }
        .r3 { top: 0; clip-path: inset(260px 0px 810px 0px); transform: translateY(-260px); }
        
        /* 🔴 後半（下半分）用の抜き出し位置（数値はデータの並びに合わせ調整） */
        .r4 { top: 0; clip-path: inset(390px 0px 680px 0px); transform: translateY(-390px); }
        .r5 { top: 0; clip-path: inset(520px 0px 550px 0px); transform: translateY(-520px); }
        .r6 { top: 0; clip-path: inset(650px 0px 420px 0px); transform: translateY(-650px); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroller"></div>
</div>

<script>
    const URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const BLOCK_W = 1200;
    const scroller = document.getElementById('scroller');

    // 「前半3段セット」と「後半3段セット」を生成
    function init() {
        // 前半(1,2,3段目)と後半(4,5,6段目)を配列にしてループで回す
        const groups = [[1, 2, 3], [4, 5, 6]];
        
        // シームレスループのために2回繰り返す
        for (let i = 0; i < 2; i++) {
            groups.forEach(rows => {
                const block = document.createElement('div');
                block.className = 'data-block';
                rows.forEach(n => {
                    const lane = document.createElement('div');
                    lane.className = 'lane';
                    const f = document.createElement('iframe');
                    f.src = URL;
                    f.className = `r${n}`;
                    lane.appendChild(f);
                    block.appendChild(lane);
                });
                scroller.appendChild(block);
            });
        }
    }

    let posX = -(BLOCK_W * 2); // 初期位置
    let isDragging = false;
    let startX = 0;
    let speed = 1.5; // 右方向

    function animate() {
        if (!isDragging) {
            posX += speed;
            // 前半+後半（2400px）分進んだらリセット
            if (posX >= 0) {
                posX -= (BLOCK_W * 2);
            }
        }
        scroller.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    const vp = document.getElementById('viewport');
    vp.onmousedown = (e) => { isDragging = true; startX = e.pageX - posX; };
    window.onmousemove = (e) => { if (isDragging) posX = e.pageX - startX; };
    window.onmouseup = () => isDragging = false;

    init();
    animate();
</script>
</body>
</html>
