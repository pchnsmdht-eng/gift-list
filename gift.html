<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* ウィジェット枠にぴったり収めるためのCSS設定 */
        body { 
            margin: 0; 
            background: transparent; 
            overflow: hidden; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* 画面に見える表示枠は「横5個(1870px)×縦3段(400px)」の黄金比で完全固定 */
        #viewport { 
            width: 1870px; /* 374px × 5列 = 1870px */
            height: 400px; /* 132px × 3段 = 396px（余白込み400px） */
            position: relative; 
            overflow: hidden; 
            pointer-events: auto !important;
        }
        
        #lane-container { 
            position: absolute; 
            display: flex; 
            flex-direction: row;
            width: max-content; 
            top: 2px; 
            will-change: transform; 
            transform: translate3d(0, 0, 0); 
            pointer-events: none !important; 
        }

        /* 成功事例の1122px幅、高さは3段分の396pxに完全最適化 */
        .block { 
            display: flex; 
            flex-direction: column; 
            width: 1122px; 
            height: 396px; 
            flex-shrink: 0; 
            margin: 0 !important;
            padding: 0 !important;
        }
        
        .lane { 
            width: 1122px; 
            height: 132px; 
            position: relative; 
            overflow: hidden; 
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* 100個以上の巨大な縦長シートをすべて受け止めるサイズ設定 */
        iframe { 
            position: absolute; 
            width: 1200px; 
            height: 8000px; /* 100個以上のデータに対応するため縦幅を拡張 */
            border: none; 
            transform-origin: top left; 
        }

        /* 指でのスワイプやマウスを認識させるための透明な膜 */
        #touch-shield { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 9999; 
            background: rgba(0,0,0,0); 
            touch-action: none;
            pointer-events: auto !important;
            cursor: grab;
        }

        /* ✨【アイコンサイズ統一】文字まで綺麗によめる均一なサイズ（60px） */
        iframe { --gift-icon-size: 60px !important; }
        iframe[src*="streamtoearn"] img, 
        iframe[src*="streamtoearn"] .gift-icon, 
        iframe[src*="streamtoearn"] svg {
            width: 60px !important; 
            height: 60px !important; 
            object-fit: contain !important;
        }
    </style>
</head>
<body>
<div id="viewport">
    <div id="touch-shield"></div>
    <div id="lane-container"></div>
</div>
<script>
    const USER = "pchnsmdht-eng", REPO = "gift-list", W = 1122;
    const SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const container = document.getElementById('lane-container');
    const shield = document.getElementById('touch-shield');
    
    let posX = 0, speed = -1.0, isTouching = false, startX = 0;
    let totalBlocksCount = 0; // 自動生成されたブロックの総数

    // リモコン（speed.txt）との同期
    async function syncSpeed() {
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/speed.txt?t=${Date.now()}`);
            const text = await res.text();
            const s = parseFloat(text.trim());
            if(!isNaN(s)) speed = s;
        } catch (e) {}
    }
    setInterval(syncSpeed, 1000);

    // スワイプ・ドラッグ検知（完全維持）
    const handleStart = (e) => {
        isTouching = true;
        startX = e.clientX - posX;
        shield.setPointerCapture(e.pointerId);
    };
    const handleMove = (e) => {
        if (!isTouching) return;
        posX = e.clientX - startX;
    };
    const handleEnd = () => { isTouching = false; };

    shield.addEventListener('pointerdown', handleStart);
    shield.addEventListener('pointermove', handleMove);
    shield.addEventListener('pointerup', handleEnd);
    shield.addEventListener('pointercancel', handleEnd);

    // ➔ 【ここが最大の進化】ギフトが何個になっても自動でブロックを組み上げるロジック
    function init() {
        container.innerHTML = '';

        // ギフト100個（34行）〜150個（50行）まで対応できるよう、
        // 3行ずつのブロックを「17ブロック分（計51行、153個枠）」自動で計算して作成します。
        const maxLines = 51; 
        const blocksData = [];
        for (let i = 1; i <= maxLines; i += 3) {
            blocksData.push([i, i+1, i+2]);
        }

        totalBlocksCount = blocksData.length; // ブロック総数を自動記録 (17ブロック)

        // スライドが途切れないよう、3ループ分横に連結
        for (let loop = 0; loop < 3; loop++) {
            blocksData.forEach((rows) => {
                const b = document.createElement('div'); 
                b.className = 'block';

                rows.forEach(n => {
                    const l = document.createElement('div'); 
                    l.className = 'lane';

                    const f = document.createElement('iframe');
                    f.src = `${SRC}?lane=${n}`;

                    // 🪛【手動の手間ゼロ】何行目になっても、灰色の細い枠線ズレ（5px補正）を全自動で計算してカット
                    const topPx = (n - 1) * 132;
                    f.style.clipPath = `inset(${topPx}px 5px ${8000 - (topPx + 132)}px 0px)`;
                    f.style.transform = `translate3d(0, -${topPx}px, 0)`;

                    l.appendChild(f); 
                    b.appendChild(l);
                });
                container.appendChild(b);
            });
        }
    }

    // 無限ループアニメーション
    function animate() {
        if (!isTouching) {
            posX += speed;
        }
        
        // 自動生成されたブロックの総幅（1122px × 17ブロック ＝ 19074px）を自動計算して滑らかにループ
        const unitW = W * totalBlocksCount; 

        if (posX <= -unitW) posX += unitW;
        else if (posX >= 0) posX -= unitW;
        
        container.style.transform = `translate3d(${posX}px, 0, 0)`;
        requestAnimationFrame(animate);
    }

    init(); syncSpeed(); animate();
</script>
</body>
</html>
