<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none; 
        }
        /* TikTok Studioの枠全体を使い切る */
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* 画像を2列に並べるコンテナ。全体の幅に合わせて自動リサイズ */
        #scroll-container {
            position: absolute;
            top: 0;
            width: 100%;
            display: grid;
            /* 2列に固定。リサイズに合わせて各枠の幅も自動で変わる */
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
            cursor: grab;
            touch-action: pan-y;
        }
        /* 各画像の枠。枠の幅に合わせて正方形を維持 */
        .gift-item {
            aspect-ratio: 1 / 1; 
            width: 100%;
            overflow: hidden;
            border: 2px solid #ff0055;
            background: rgba(0,0,0,0.8);
            border-radius: 12px;
            position: relative;
            pointer-events: none;
        }
        /* 外部サイトの画像部分を拡大して各枠に収める */
        iframe {
            width: 500%; /* 中身のサイトを大きく読み込んで画像を抽出 */
            height: 5000px;
            border: none;
            position: absolute;
            left: -195%; /* 1列目と2列目で微調整が必要な場合はここ */
            top: 0;
            transform: scale(0.6); /* 枠内に収まるよう縮小 */
            transform-origin: top left;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- topの値を画像一個分（この場合は約160pxずつ）ずらして配置 -->
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: 0px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: 0px; left: -340%;"></iframe></div>
        
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -160px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -160px; left: -340%;"></iframe></div>
        
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -320px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -320px; left: -340%;"></iframe></div>
        
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -480px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -480px; left: -340%;"></iframe></div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer;
    let startY, initialPos;

    function step() {
        if (!isPaused) {
            pos -= 1;
            if (Math.abs(pos) > container.scrollHeight) {
                pos = window.innerHeight;
            }
            container.style.top = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startY = e.touches ? e.touches[0].pageY : e.pageY;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        const currentY = e.touches ? e.touches[0].pageY : e.pageY;
        pos = initialPos + (currentY - startY);
        container.style.top = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});

    requestAnimationFrame(step);
</script>
</body>
</html>
