<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        #wrapper { width: 100vw; height: 106px; position: relative; cursor: grab; overflow: hidden; }
        
        #scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 106px;
            will-change: transform;
        }

        .item-box {
            position: relative;
            width: 131px;
            height: 106px;
            flex-shrink: 0;
        }

        iframe {
            position: absolute;
            width: 131px;
            height: 212px;
            border: none;
            pointer-events: none;
        }

        .top-part {
            top: 0;
            clip-path: inset(0 0 50% 0);
        }

        .bottom-part {
            top: 0;
            clip-path: inset(50% 0 0 0);
            transform: translateY(-106px);
        }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="scroller"></div>
</div>

<script>
    const TARGET_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const scroller = document.getElementById('scroller');
    const wrapper = document.getElementById('wrapper');

    const ITEM_WIDTH = 131;

    // 途切れないよう多めに生成
    for (let i = 0; i < 10; i++) {
        const boxTop = document.createElement('div');
        boxTop.className = 'item-box';
        const fTop = document.createElement('iframe');
        fTop.src = TARGET_URL;
        fTop.className = 'top-part';
        boxTop.appendChild(fTop);
        scroller.appendChild(boxTop);

        const boxBottom = document.createElement('div');
        boxBottom.className = 'item-box';
        const fBottom = document.createElement('iframe');
        fBottom.src = TARGET_URL;
        fBottom.className = 'bottom-part';
        boxBottom.appendChild(fBottom);
        scroller.appendChild(boxBottom);
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.2;

    function animate() {
        if (!isDragging) {
            posX += speed;
            
            // 🔴 修正：0に戻さず、1ユニット分(262px)戻すことで繋ぎ目をシームレス化
            const unitWidth = ITEM_WIDTH * 2;
            if (posX <= -unitWidth) {
                posX += unitWidth;
            }
        }
        scroller.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    wrapper.addEventListener('mousedown', (e) => { 
        isDragging = true; 
        startX = e.pageX - posX; 
    });
    window.addEventListener('mousemove', (e) => { 
        if (isDragging) posX = e.pageX - startX; 
    });
    window.addEventListener('mouseup', () => { 
        isDragging = false; 
    });

    animate();
</script>
</body>
</html>
