<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            margin: 0; 
            padding: 0; 
            background: transparent !important; 
            overflow-x: hidden;
        }
        
        /* ページ全体を収めるコンテナ */
        #viewport {
            width: 100vw;
            height: 100vh;
        }

        /* 指定URLを一切加工せずにそのまま表示 */
        .full-content {
            width: 100%;
            /* 50個以上のアイテムがすべて入り切る高さを確保 */
            height: 10000px; 
            border: none;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div id="viewport">
    <iframe class="full-content" src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
</div>

</body>
</html>
