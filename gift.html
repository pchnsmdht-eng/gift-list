<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent; 
            user-select: none;
            color: #ffffff !important;
        }
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        #scroll-container {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 10px;
            box-sizing: border-box;
            cursor: grab;
            touch-action: pan-y;
        }
        .gift-item {
            aspect-ratio: 1 / 1;
            width: 90%;
            max-width: 150px;
            overflow: hidden;
            /* 四角い枠を消し、左右の縦線（サイド線）だけにしました */
            border-left: 3px solid #ff0055;
            border-right: 3px solid #ff0055;
            border-top: none;
            border-bottom: none;
            background: rgba(0,0,0,0.4); /* 背景を少し薄くして見やすく */
            border-radius: 0; /* サイド線のみにするため角丸を解除 */
            position: relative;
            flex-shrink: 0;
            pointer-events: none;
        }
        iframe {
            width: 500px;
            height: 5000px;
            border: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            transform-origin: top;
            /* 文字を白く見せるための色反転 */
            filter: brightness(0) invert(1);
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- topの値で表示位置を調整 -->
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: 0px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -150px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -300px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -450px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -600px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -750px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -900px;"></iframe></div>
        <div class="gift-item"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1050px;"></iframe></div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    let pos = 0;
    let isPaused = false;
    let resumeTimer, startY, initialPos;

    function step() {
        if (!isPaused) {
            pos -= 1;
            if (Math.abs(pos) > container.scrollHeight) pos = window.innerHeight;
            container.style.top = pos + 'px';
        }
        requestAnimationFrame(step);
    }

    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startY = e.touches ? e.touches[0].pageY : e.pageY;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        const currentY = e.touches ? e.touches[0].pageY : e.pageY;
        pos = initialPos + (currentY - startY);
        container.style.top = pos + 'px';
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});
    requestAnimationFrame(step);
</script>
</body>
</html>
