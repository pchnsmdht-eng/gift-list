<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        /* 1. 余白の徹底排除 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: transparent; overflow: hidden; user-select: none; }
        
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 2. 手動ドラッグコンテナ（自動スライドは一切なし） */
        #scroll-container {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            gap: 12px; /* 列ごとの隙間 */
            padding: 5px;
            cursor: grab;
            will-change: transform;
        }
        #scroll-container:active { cursor: grabbing; }

        /* 3. 1列（6枚分）を管理する窓 */
        .column {
            width: 152px; /* 横幅を最適化 */
            height: 940px; /* 縦6枚分が収まる高さ */
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        /* 4. 元サイトそのままの表示 */
        iframe {
            width: 480px; 
            height: 10000px;
            border: none;
            position: absolute;
            left: 50%;
            /* ズレを最小限にするための倍率固定 */
            transform: translateX(-50%) scale(1.0); 
            transform-origin: top;
            pointer-events: none;
        }

        .set { display: flex; gap: 12px; }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <div class="set" id="set-a">
            <!-- 
              各列のtop値を「1枚あたりの高さ」ではなく「6枚セットの区切り」で調整。
              もし1枚目がズレる場合は、ここの -5px を -10px などに変えるだけで全列直ります。
            -->
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -5px;"></iframe></div>
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -950px;"></iframe></div>
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -1895px;"></iframe></div>
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -2840px;"></iframe></div>
            <div class="column"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa" style="top: -3785px;"></iframe></div>
        </div>
        <div class="set" id="set-b"></div>
    </div>
</div>

<script>
    const container = document.getElementById('scroll-container');
    const setA = document.getElementById('set-a');
    const setB = document.getElementById('set-b');

    setB.innerHTML = setA.innerHTML;

    let isDragging = false;
    let startX = 0;
    let currentPos = 0;

    const getResetPoint = () => setA.offsetWidth + 12;

    const onStart = (e) => {
        isDragging = true;
        startX = (e.pageX || e.touches[0].pageX) - currentPos;
    };

    const onMove = (e) => {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();

        currentPos = (e.pageX || e.touches[0].pageX) - startX;

        const resetPoint = getResetPoint();
        if (currentPos > 0) {
            currentPos = -resetPoint;
            startX = (e.pageX || e.touches[0].pageX) - currentPos;
        } else if (Math.abs(currentPos) >= resetPoint) {
            currentPos = 0;
            startX = (e.pageX || e.touches[0].pageX) - currentPos;
        }

        container.style.transform = `translateX(${currentPos}px)`;
    };

    const onEnd = () => { isDragging = false; };

    container.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    container.addEventListener('touchstart', onStart);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onEnd);
</script>
</body>
</html>
