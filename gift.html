<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        /* 窓枠のサイズを固定 */
        #wrapper { width: 100vw; height: 106px; position: relative; cursor: grab; overflow: hidden; }
        
        #scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 106px;
            will-change: transform;
        }

        .item-box {
            position: relative;
            width: 131px;
            height: 106px;
            flex-shrink: 0;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1200px;
            border: none;
            pointer-events: none;
            transform-origin: 0 0;
            /* 🔴 アイコンを枠に収める倍率 */
            transform: scale(0.85); 
        }

        /* --- 1段目・2段目・3段目の切り抜き設定 --- */
        .p1 { top: 0; clip-path: inset(5px 1010px 900px 5px); }
        .p2 { top: 0; clip-path: inset(135px 1010px 770px 5px); transform: translateY(-135px) scale(0.85); }
        .p3 { top: 0; clip-path: inset(265px 1010px 640px 5px); transform: translateY(-265px) scale(0.85); }
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="scroller"></div>
    </div>

<script>
    const TARGET_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const scroller = document.getElementById('scroller');
    const wrapper = document.getElementById('wrapper');
    const W = 131;

    // 「1段目・2段目・3段目」を一つのセットとして、横に並べる
    function init() {
        for (let i = 0; i < 8; i++) {
            [1, 2, 3].forEach(n => {
                const box = document.createElement('div');
                box.className = 'item-box';
                const f = document.createElement('iframe');
                f.src = TARGET_URL;
                f.className = `p${n}`;
                box.appendChild(f);
                scroller.appendChild(box);
            });
        }
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.5;

    function animate() {
        if (!isDragging) {
            posX += speed;
            // 3枚1セット（131px * 3 = 393px）分流れたらループ
            const unit = W * 3;
            if (posX <= -unit) posX += unit;
        }
        scroller.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    // ドラッグUI
    wrapper.onmousedown = (e) => { isDragging = true; startX = e.pageX - posX; };
    window.onmousemove = (e) => { if (isDragging) posX = e.pageX - startX; };
    window.onmouseup = () => isDragging = false;

    init();
    animate();
</script>
</body>
</html>
