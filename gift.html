<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    
    /* 拡大・縮小に対応するため、コンテナをベースにします */
    #master-container { 
        width: 100vw; height: 100vh; 
        transform-origin: top left;
        transition: transform 0.2s ease;
    }
    
    #crop-wrapper {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        position: relative;
    }
    
    iframe {
        width: 100vw;
        height: 100vh;
        border: none;
        pointer-events: none;
        position: absolute;
        top: 0;
        left: 0;
    }
</style>
</head>
<body>
    <div id="master-container">
        <div id="crop-wrapper">
            <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc",
          authDomain: "gift-list-app-53ef2.firebaseapp.com",
          projectId: "gift-list-app-53ef2",
          storageBucket: "gift-list-app-53ef2.firebasestorage.app",
          messagingSenderId: "161949465085",
          appId: "1:161949465085:web:3574bdee443e4fcec70194",
          measurementId: "G-B3PJELG3Q9"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const container = document.getElementById('master-container');
        const wrapper = document.getElementById('crop-wrapper');

        onValue(ref(db, 'settings'), (snapshot) => {
            const data = snapshot.val() || {};
            // スマホから送られてくる値で「拡大率(scale)」と「高さ(cropHeight)」を制御
            container.style.transform = `scale(${data.scale || 1.0})`;
            wrapper.style.height = (data.cropHeight || 100) + 'vh';
        });
    </script>
</body>
</html>
