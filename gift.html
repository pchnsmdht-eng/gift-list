<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        /* 縦130pxを3段（合計390px） */
        #main-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 390px;
        }

        .lane {
            width: 100vw;
            height: 130px;
            position: relative;
            overflow: hidden;
        }

        /* 🔴 改善点：1つのレーンにつき、長いiframeを2枚だけ並べてループさせる */
        .scroller {
            position: absolute;
            display: flex;
            width: max-content;
            height: 130px;
            will-change: transform;
        }

        .gift-strip {
            position: relative;
            width: 1200px; /* 元のサイトの横幅 */
            height: 130px;
            flex-shrink: 0;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1200px;
            border: none;
            pointer-events: none;
        }

        /* 各段の抜き出し位置を固定 */
        .row-1 { top: 0; clip-path: inset(0px 0px 1070px 0px); }
        .row-2 { top: 0; clip-path: inset(130px 0px 940px 0px); transform: translateY(-130px); }
        .row-3 { top: 0; clip-path: inset(260px 0px 810px 0px); transform: translateY(-260px); }
    </style>
</head>
<body>

<div id="main-container">
    <div class="lane"><div class="scroller" id="l1"></div></div>
    <div class="lane"><div class="scroller" id="l2"></div></div>
    <div class="lane"><div class="scroller" id="l3"></div></div>
</div>

<script>
    const URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const STRIP_W = 1200; // 元のサイトの幅
    let positions = [0, 0, 0];
    let isDragging = false;
    let startX = 0;

    // 各段に「長いベルト」を2枚ずつ配置（これで無限ループさせる）
    [1, 2, 3].forEach(n => {
        const scroller = document.getElementById(`l${n}`);
        for (let i = 0; i < 2; i++) {
            const div = document.createElement('div');
            div.className = 'gift-strip';
            const f = document.createElement('iframe');
            f.src = URL;
            f.className = `row-${n}`;
            div.appendChild(f);
            scroller.appendChild(div);
        }
    });

    function animate() {
        if (!isDragging) {
            for (let i = 0; i < 3; i++) {
                positions[i] -= 1.5;
                // ベルト1枚分（1200px）進んだら戻す
                if (positions[i] <= -STRIP_W) positions[i] += STRIP_W;
                document.getElementById(`l${i+1}`).style.transform = `translateX(${positions[i]}px)`;
            }
        }
        requestAnimationFrame(animate);
    }

    const container = document.getElementById('main-container');
    container.onmousedown = (e) => { isDragging = true; startX = e.pageX; this.oldP = [...positions]; };
    window.onmousemove = (e) => {
        if (!isDragging) return;
        const diff = e.pageX - startX;
        for (let i = 0; i < 3; i++) {
            positions[i] = this.oldP[i] + diff;
            document.getElementById(`l${i+1}`).style.transform = `translateX(${positions[i]}px)`;
        }
    };
    window.onmouseup = () => isDragging = false;

    animate();
</script>
</body>
</html>
