<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    
    #master-container {
        width: 100%;
        height: 100%;
        transform-origin: top left;
        will-change: transform;
    }

    .row-container {
        display: flex;
        width: 200vw;
        height: 33.33vh;
    }

    iframe {
        width: 100vw;
        height: 100%;
        border: none;
        pointer-events: none;
    }

    .hardware-accel {
        backface-visibility: hidden;
        perspective: 1000px;
        transform: translateZ(0);
        will-change: transform;
    }

    @keyframes slideRight {
        0% { transform: translate3d(-100vw, 0, 0); }
        100% { transform: translate3d(0, 0, 0); }
    }

    @keyframes slideLeft {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-100vw, 0, 0); }
    }
</style>
</head>
<body>
    <div id="master-container">
        <div class="row-container" id="row1">
            <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
            <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
        </div>
        <div class="row-container" id="row2">
            <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
            <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
        </div>
        <div class="row-container" id="row3">
            <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
            <iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        // あなた専用のFirebase設定
        const firebaseConfig = {
          apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc",
          authDomain: "gift-list-app-53ef2.firebaseapp.com",
          projectId: "gift-list-app-53ef2",
          storageBucket: "gift-list-app-53ef2.firebasestorage.app",
          messagingSenderId: "161949465085",
          appId: "1:161949465085:web:3574bdee443e4fcec70194",
          measurementId: "G-B3PJELG3Q9"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const masterContainer = document.getElementById('master-container');
        const rows = document.querySelectorAll('.row-container');

        onValue(ref(db, 'settings'), (snapshot) => {
            const data = snapshot.val() || {};
            const speed = data.speed || 0;
            const size = data.size || 1.0;
            const optimize = data.optimize || false;

            masterContainer.style.transform = `scale(${size})`;

            rows.forEach(row => {
                if(optimize) {
                    row.classList.add('hardware-accel');
                } else {
                    row.classList.remove('hardware-accel');
                }

                if (speed === 0) {
                    row.style.animation = 'none';
                } else {
                    const duration = 30 / Math.abs(speed);
                    const direction = speed > 0 ? 'slideRight' : 'slideLeft';
                    row.style.animation = `${direction} ${duration}s linear infinite`;
                }
            });

            // コントローラーからのPing要求に応答を返す（通信テスト用）
            if (data.pingRequest) {
                set(ref(db, 'pingResponse'), { time: data.pingRequest });
            }
        });
    </script>
</body>
</html>
