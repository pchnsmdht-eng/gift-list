<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        /* 132px * 3段 = 396px */
        #viewport {
            width: 100vw;
            height: 396px; 
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        #lane-container {
            position: absolute;
            display: flex;
            width: max-content;
            height: 396px;
            will-change: transform;
            left: 0;
        }

        .block {
            display: flex;
            flex-direction: column;
            width: 1200px;
            height: 396px;
            flex-shrink: 0;
        }

        .lane {
            width: 1200px;
            height: 132px;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1500px;
            border: none;
            pointer-events: none;
        }

        /* 🔴 132px刻みで再計算した座標 */
        .r1 { top: 0; clip-path: inset(0px 0px 1368px 0px); }
        .r2 { top: 0; clip-path: inset(132px 0px 1236px 0px); transform: translateY(-132px); }
        .r3 { top: 0; clip-path: inset(264px 0px 1104px 0px); transform: translateY(-264px); }
        .r4 { top: 0; clip-path: inset(396px 0px 972px 0px); transform: translateY(-396px); }
        .r5 { top: 0; clip-path: inset(528px 0px 840px 0px); transform: translateY(-528px); }
        .r6 { top: 0; clip-path: inset(660px 0px 708px 0px); transform: translateY(-660px); }
        .r7 { top: 0; clip-path: inset(792px 0px 576px 0px); transform: translateY(-792px); }
        .r8 { top: 0; clip-path: inset(924px 0px 444px 0px); transform: translateY(-924px); }
        .r9 { top: 0; clip-path: inset(1056px 0px 312px 0px); transform: translateY(-1056px); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="lane-container"></div>
</div>

<script>
    const URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 1200;
    const container = document.getElementById('lane-container');

    const groups = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];

    function init() {
        container.innerHTML = '';
        for (let i = 0; i < 2; i++) {
            groups.forEach(rows => {
                const block = document.createElement('div');
                block.className = 'block';
                rows.forEach(n => {
                    const lane = document.createElement('div');
                    lane.className = 'lane';
                    const f = document.createElement('iframe');
                    f.src = `${URL}?lane=${n}&t=${Date.now()}_${Math.random()}`;
                    f.className = `r${n}`;
                    lane.appendChild(f);
                    block.appendChild(lane);
                });
                container.appendChild(block);
            });
        }
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.8; 

    function animate() {
        if (!isDragging) {
            posX += speed;
            const cycleWidth = W * 3;
            if (posX <= -cycleWidth) {
                posX += cycleWidth;
            }
        }
        container.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    const vp = document.getElementById('viewport');
    vp.onmousedown = (e) => { isDragging = true; startX = e.pageX - posX; };
    window.onmousemove = (e) => { if (isDragging) posX = e.pageX - startX; };
    window.onmouseup = () => isDragging = false;

    init();
    animate();
</script>
</body>
</html>
