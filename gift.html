<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        /* touch-action: none でブラウザのスクロールを無効化し、ドラッグに専念させます */
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        #viewport {
            width: 100vw;
            height: 396px; 
            position: relative;
            overflow: hidden;
            cursor: grab;
            /* 🔴 スマホの指操作を最優先にする設定 */
            user-select: none;
            -webkit-user-select: none;
        }

        #lane-container {
            position: absolute;
            display: flex;
            gap: 0;
            width: max-content;
            height: 393px;
            will-change: transform;
            left: 0;
            top: 3px; 
            /* 🔴 子要素のイベントを邪魔しない設定 */
            pointer-events: auto;
        }

        .block {
            display: flex;
            flex-direction: column;
            width: 1115px; 
            height: 393px;
            flex-shrink: 0;
            margin: 0;
            padding: 0;
            overflow: visible;
        }

        .lane {
            width: 1174px; 
            height: 131px;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 1500px;
            border: none;
            /* 🔴 iframeが操作を吸い取らないように無効化 */
            pointer-events: none;
        }

        .r1 { top: 0; clip-path: inset(0px 26px 1369px 0px); }
        .r2 { top: 0; clip-path: inset(131px 26px 1238px 0px); transform: translateY(-131px); }
        .r3 { top: 0; clip-path: inset(262px 26px 1107px 0px); transform: translateY(-262px); }
        .r4 { top: 0; clip-path: inset(393px 26px 976px 0px); transform: translateY(-393px); }
        .r5 { top: 0; clip-path: inset(524px 26px 845px 0px); transform: translateY(-524px); }
        .r6 { top: 0; clip-path: inset(655px 26px 714px 0px); transform: translateY(-655px); }
        .r7 { top: 0; clip-path: inset(786px 26px 583px 0px); transform: translateY(-786px); }
        .r8 { top: 0; clip-path: inset(917px 26px 452px 0px); transform: translateY(-917px); }
        .r9 { top: 0; clip-path: inset(1048px 26px 321px 0px); transform: translateY(-1048px); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="lane-container"></div>
</div>

<script>
    const URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 1115; 
    const container = document.getElementById('lane-container');
    const vp = document.getElementById('viewport');

    const groups = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];

    function init() {
        container.innerHTML = '';
        for (let i = 0; i < 4; i++) {
            groups.forEach(rows => {
                const block = document.createElement('div');
                block.className = 'block';
                rows.forEach(n => {
                    const lane = document.createElement('div');
                    lane.className = 'lane';
                    const f = document.createElement('iframe');
                    f.src = `${URL}?lane=${n}&t=${Date.now()}_${i}_${n}`;
                    f.className = `r${n}`;
                    lane.appendChild(f);
                    block.appendChild(lane);
                });
                container.appendChild(block);
            });
        }
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.8; 

    // 🔴 最新のPointer Eventsでマウス・タッチ両対応
    vp.onpointerdown = (e) => { 
        isDragging = true; 
        startX = e.pageX - posX; 
        vp.style.cursor = 'grabbing';
        vp.setPointerCapture(e.pointerId); // 指が枠外に出ても追い続ける
    };

    window.onpointermove = (e) => { 
        if (!isDragging) return;
        posX = e.pageX - startX; 
    };

    window.onpointerup = (e) => { 
        isDragging = false; 
        vp.style.cursor = 'grab';
    };

    function animate() {
        if (!isDragging) {
            posX += speed;
            const cycleWidth = W * 3; 
            if (posX <= -cycleWidth) {
                posX += cycleWidth;
            }
            // 右端まで行ったら戻る処理も一応カバー
            if (posX > 0) {
                posX -= cycleWidth;
            }
        }
        container.style.transform = `translateX(${posX}px)`;
        requestAnimationFrame(animate);
    }

    init();
    animate();
</script>
</body>
</html>
