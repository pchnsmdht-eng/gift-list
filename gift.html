<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; background: transparent !important; user-select: none; }
        
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 横スライドさせる巨大な壁 */
        #scroll-container {
            position: absolute;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: row;
            gap: 0;
            cursor: grab;
            touch-action: pan-x;
            will-change: transform; /* 描画をGPUに任せる */
        }

        /* 縦6枚を1つの「画像」として扱うユニット */
        .column-unit {
            display: flex;
            flex-direction: column;
            gap: 0;
            flex-shrink: 0;
            width: 148px; /* 1枚の横幅 */
        }

        .gift-item {
            width: 148px; 
            height: 148px; 
            overflow: hidden;
            position: relative;
            border: none !important;
            background: transparent;
        }

        /* 中身を1つのiframeで共通化 */
        .content-frame {
            position: absolute;
            width: 500px;
            height: 8000px;
            border: none;
            pointer-events: none;
            /* 拡大率と中央寄せを固定 */
            left: 50%;
            transform: translateX(-50%) scale(1.1);
            transform-origin: top;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div id="scroll-container">
        <!-- セットA（5列×6段） -->
        <div id="content-a" style="display: flex;"></div>
        <!-- セットB（ループ用） -->
        <div id="content-b" style="display: flex;"></div>
    </div>
</div>

<script>
    const contentA = document.getElementById('content-a');
    const contentB = document.getElementById('content-b');
    const container = document.getElementById('scroll-container');
    const url = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";

    function build(target) {
        let frag = document.createDocumentFragment();
        for (let i = 0; i < 5; i++) {
            let col = document.createElement('div');
            col.className = 'column-unit';
            for (let j = 0; j < 6; j++) {
                let item = document.createElement('div');
                item.className = 'gift-item';
                
                let frame = document.createElement('iframe');
                frame.src = url;
                frame.className = 'content-frame';
                // 表示位置の計算（-150px刻み）
                frame.style.top = `${(i * 6 + j) * -150}px`;
                // 【超重要】読み込み済みのリソースを再利用させる設定
                frame.loading = "eager"; 
                
                item.appendChild(frame);
                col.appendChild(item);
            }
            frag.appendChild(col);
        }
        target.appendChild(frag);
    }

    // 構築
    build(contentA);
    build(contentB);

    let pos = 0;
    let isPaused = false;
    let resumeTimer, startX, initialPos;

    function move() {
        if (!isPaused) {
            pos -= 1.5; // 少しスピードアップ
            const halfWidth = contentA.offsetWidth;
            if (Math.abs(pos) >= halfWidth) pos = 0;
            // leftではなくtranslate3dで動かすのが最速
            container.style.transform = `translate3d(${pos}px, 0, 0)`;
        }
        requestAnimationFrame(move);
    }

    // 手動操作
    function onStart(e) {
        isPaused = true;
        clearTimeout(resumeTimer);
        startX = e.touches ? e.touches[0].pageX : e.pageX;
        initialPos = pos;
        window.addEventListener(e.touches ? 'touchmove' : 'mousemove', onMove, {passive: false});
        window.addEventListener(e.touches ? 'touchend' : 'mouseup', onEnd);
    }

    function onMove(e) {
        const currentX = e.touches ? e.touches[0].pageX : e.pageX;
        pos = initialPos + (currentX - startX);
        const halfWidth = contentA.offsetWidth;
        if (pos > 0) pos = -halfWidth;
        if (Math.abs(pos) >= halfWidth) pos = 0;
        container.style.transform = `translate3d(${pos}px, 0, 0)`;
        if(e.cancelable) e.preventDefault();
    }

    function onEnd() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('touchmove', onMove);
        resumeTimer = setTimeout(() => { isPaused = false; }, 3000);
    }

    container.addEventListener('mousedown', onStart);
    container.addEventListener('touchstart', onStart, {passive: false});

    // 実行開始
    requestAnimationFrame(move);
</script>
</body>
</html>
