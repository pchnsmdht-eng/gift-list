<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            overflow: hidden; 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* 8段分の高さをきれいに収める枠（132px × 8段 = 1056px） */
        #viewport { 
            width: 100vw; 
            height: 1060px; 
            position: relative; 
            overflow: hidden; 
        }
        
        #lane-container { 
            position: absolute; 
            display: flex; 
            width: max-content; 
            top: 2px; 
            will-change: transform; 
            transform: translate3d(0, 0, 0); 
            pointer-events: none !important; 
        }

        /* 1ブロック（塊）の中に8つのレーンを縦に並べる */
        .block { 
            display: flex; 
            flex-direction: column; 
            width: 1122px; 
            height: 1056px; 
            flex-shrink: 0; 
            margin: 0 !important;
            padding: 0 !important;
        }
        
        .lane { 
            width: 1122px; 
            height: 132px; 
            position: relative; 
            overflow: hidden; 
            margin: 0 !important;
            padding: 0 !important;
        }
        
        iframe { 
            position: absolute; 
            width: 1200px; 
            height: 2000px; 
            border: none; 
            transform-origin: top left; 
        }

        /* ✨【重要】不揃いなギフトアイコンをすべて綺麗なサイズに統一する魔法の命令 */
        iframe {
            --gift-icon-size: 60px !important; /* サイズを好みに応じてここで一括調整できます */
        }
        
        /* iframeの内部にある画像やアイコン要素のサイズを強制的に統一 */
        iframe[src*="streamtoearn"] img, 
        iframe[src*="streamtoearn"] .gift-icon,
        iframe[src*="streamtoearn"] svg {
            width: 60px !important;
            height: 60px !important;
            object-fit: contain !important;
        }

        /* 1段目〜8段目までの表示切り取り位置（clip-path）を1ミリの狂いもなく完全補正 */
        .r1 { top: 0; clip-path: inset(0px 5px 1868px 0px); }
        .r2 { top: 0; clip-path: inset(132px 5px 1736px 0px); transform: translateY(-132px); }
        .r3 { top: 0; clip-path: inset(264px 5px 1604px 0px); transform: translateY(-264px); }
        .r4 { top: 0; clip-path: inset(396px 5px 1472px 0px); transform: translateY(-396px); }
        .r5 { top: 0; clip-path: inset(528px 5px 1340px 0px); transform: translateY(-528px); }
        .r6 { top: 0; clip-path: inset(660px 5px 1208px 0px); transform: translateY(-660px); }
        .r7 { top: 0; clip-path: inset(792px 5px 1076px 0px); transform: translateY(-792px); }
        .r8 { top: 0; clip-path: inset(924px 5px 944px 0px); transform: translateY(-924px); }
    </style>
</head>
<body>
<div id="viewport">
    <div id="lane-container"></div>
</div>

<script>
    const W = 1122, SRC = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const BIN_URL = "https://api.jsonbin.io/v3/b/6614f17be41b4d34e4dede5b/latest";
    const container = document.getElementById('lane-container');
    
    let posX = 0;
    let speed = 0; 

    // 8段のレーンを初期化して綺麗に組み立てる
    function init() {
        container.innerHTML = '';
        // ループしても途切れないように4つ分のブロックを横に並べる
        for (let i = 0; i < 4; i++) {
            const b = document.createElement('div'); 
            b.className = 'block';
            
            // 1〜8番目のレーンを1つのブロックの中に生成
            [1, 2, 3, 4, 5, 6, 7, 8].forEach(n => {
                const l = document.createElement('div'); 
                l.className = 'lane';
                
                const f = document.createElement('iframe'); 
                f.src = `${SRC}?lane=${n}`; 
                f.className = `r${n}`;
                
                l.appendChild(f); 
                b.appendChild(l);
            });
            container.appendChild(b);
        }
    }

    // スピコンの数値をJSONBinから安全に読み込む（1秒ごと）
    async function checkSpeed() {
        try {
            const res = await fetch(BIN_URL);
            if (res.ok) { 
                const data = await res.json();
                if (data && data.record && typeof data.record.speed === 'number') {
                    speed = data.record.speed;
                }
            }
        } catch (e) {}
    }

    // ⏱️ チカチカを一切起こさず、スーッと滑らかに流すスクロールアニメーション
    function animate() {
        const unitW = W * 4; // 4ブロック分の総横幅

        if (speed !== 0) {
            // スピコンの数値（1〜5、-1〜-5）に応じて左右に移動
            posX += (speed * 0.7); 

            // 端まで行ったら滑らかにループさせる処理
            if (posX <= -unitW) posX += unitW;
            else if (posX >= 0) posX -= unitW;
            
            container.style.transform = `translate3d(${posX}px, 0, 0)`;
        }
        requestAnimationFrame(animate);
    }

    setInterval(checkSpeed, 1000); 
    init(); 
    animate();
</script>
</body>
</html>
