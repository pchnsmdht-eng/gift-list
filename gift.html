<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; touch-action: none; }
        
        #viewport {
            width: 100vw;
            height: 405px; /* 135px * 3 */
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        .lane {
            width: 100vw;
            height: 135px;
            position: relative;
            overflow: hidden;
            /* 🔴 ブラウザに「ここは個別に描画しろ」と強制する設定 */
            transform: translateZ(0); 
            background: rgba(0,0,0,0.01); /* 描画を誘発 */
        }

        iframe {
            position: absolute;
            width: 1200px;
            height: 2000px; 
            border: none;
            pointer-events: none;
            will-change: transform;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div class="lane"><iframe id="f1"></iframe></div>
    <div class="lane"><iframe id="f2"></iframe></div>
    <div class="lane"><iframe id="f3"></iframe></div>
</div>

<script>
    const BASE_URL = "https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa";
    const W = 1200;
    const H = 135; 
    const iframes = [document.getElementById('f1'), document.getElementById('f2'), document.getElementById('f3')];

    // 🔴 同時読み込みを避け、1つずつ時間を空けて読み込む
    async function init() {
        for (let i = 0; i < iframes.length; i++) {
            // URLを完全にバラバラにして認識させる
            iframes[i].src = `${BASE_URL}?lane=${i}&t=${Date.now()}`;
            await new Promise(r => setTimeout(r, 200)); // 0.2秒待機
        }
    }

    let posX = 0;
    let isDragging = false;
    let startX = 0;
    let speed = -1.8;

    function animate() {
        if (!isDragging) {
            posX += speed;
            if (posX <= -(W * 3)) posX += (W * 3);
            if (posX > 0) posX -= (W * 3);
        }

        const setIndex = Math.floor(Math.abs(posX) / W) % 3;
        const scrollX = posX % W;

        iframes.forEach((f, i) => {
            const currentRow = i + (setIndex * 3);
            const targetY = -(currentRow * H);
            
            // 描画バグを防ぐため、常に座標を更新し続ける
            f.style.transform = `translate3d(${scrollX}px, ${targetY}px, 0)`;
            
            const top = currentRow * H;
            f.style.clipPath = `inset(${top}px 0px ${2000 - (top + H)}px 0px)`;
        });

        requestAnimationFrame(animate);
    }

    const vp = document.getElementById('viewport');
    vp.onmousedown = (e) => { isDragging = true; startX = e.pageX - posX; };
    window.onmousemove = (e) => { if (isDragging) posX = e.pageX - startX; };
    window.onmouseup = () => isDragging = false;

    init();
    animate();

    // 10分おきにリフレッシュ
    setInterval(init, 600000);
</script>
</body>
</html>
