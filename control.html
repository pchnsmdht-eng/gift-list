<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ルームコントローラー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .box {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .box-title {
            font-size: 13px;
            font-weight: bold;
            color: #888888;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 速度の大きな数字表示（揺れ防止のため高さを固定） */
        .slider-display {
            font-size: 52px;
            font-weight: bold;
            color: #00e5ff;
            text-align: center;
            margin-bottom: 10px;
            height: 60px;
            line-height: 60px;
        }

        /* 横幅いっぱいのスライダーバー */
        .speed-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 14px;
            border-radius: 7px;
            background: #333333;
            outline: none;
            margin: 15px 0;
        }

        /* 操作しやすい特大の青いつまみ */
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
        }
        .speed-slider::-moz-range-thumb {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
            border: none;
        }

        .labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666666;
            margin-top: 4px;
        }
        
        /* 🛑 停止ボタン（ピンク） */
        .btn-stop {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-sizing: border-box;
            background-color: #cf6679;
            color: #ffffff;
            margin-top: 20px;
        }

        /* 💬 背景が点滅しない・ガタガタ動かない固定メッセージ欄 */
        .status-box {
            background-color: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            width: 100%;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #status {
            font-size: 13px;
            color: #666666;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box">
            <div class="box-title">🧭 スライダー速度調整</div>
            <div class="slider-display" id="speed-display">0</div>
            
            <input type="range" id="speedInput" min="-5" max="5" value="0" class="speed-slider">
            
            <div class="labels">
                <span>≪ 左へ流す (1 〜 5)</span>
                <span>停止</span>
                <span>右へ流す (-1 〜 -5) ≫</span>
            </div>
            
            <button class="btn-stop" onclick="resetToZero()">🛑 停止（中央に戻す）</button>
        </div>

        <div class="status-box">
            <div id="status">待機中</div>
        </div>
    </div>

<script>
    // ==========================================
    // ⚠️ ここをご自身の環境に書き換えてください
    // ==========================================
    const RAW_USER  = "あなたのGitHubユーザー名";
    const RAW_REPO  = "あなたのリポジトリ名";
    const RAW_TOKEN = "あなたのGitHubトークン";
    const FILE = "speed.txt";

    // 全角スペースや【】記号を自動で除去してクラッシュを防ぐ安全処理
    const USER = RAW_USER.replace(/[【】\s\u3000]/g, "").trim();
    const REPO = RAW_REPO.replace(/[【】\s\u3000]/g, "").trim();
    const TOKEN = RAW_TOKEN.replace(/[【】\s\u3000]/g, "").replace(/[^a-zA-Z0-9_]/g, "").trim();

    const slider = document.getElementById('speedInput');
    const display = document.getElementById('speed-display');
    const statusDiv = document.getElementById('status');
    let timer = null;

    // スライダーを指で動かしている時の処理
    slider.addEventListener('input', (e) => {
        // 右に動かしたらマイナス、左に動かしたらプラスにするための反転処理
        const originalVal = parseInt(e.target.value, 10);
        const invertedVal = originalVal === 0 ? 0 : -originalVal;
        
        display.innerText = invertedVal; // 数字を連動表示
        
        // 通信がパンクしてチカチカするのを防ぐため、指が少し止まったら送信
        clearTimeout(timer);
        timer = setTimeout(() => { sendSpeed(invertedVal); }, 250);
    });

    // つまみから指を離した瞬間
    slider.addEventListener('change', (e) => {
        clearTimeout(timer);
        const originalVal = parseInt(e.target.value, 10);
        const invertedVal = originalVal === 0 ? 0 : -originalVal;
        sendSpeed(invertedVal);
    });

    // 🛑 停止ボタン
    function resetToZero() {
        clearTimeout(timer);
        slider.value = 0;
        display.innerText = "0";
        sendSpeed(0);
    }

    // GitHubへ速度を上書き保存する関数
    async function sendSpeed(val) {
        const url = `https://api.github.com/repos/${USER}/${REPO}/contents/${FILE}`;
        const content = String(val);
        statusDiv.innerText = "送信中...";
        
        try {
            const res = await fetch(url, { headers: { "Authorization": `token ${TOKEN}` } });
            if (!res.ok) throw new Error();
            const data = await res.json();
            const sha = data.sha;

            const base64Content = btoa(unescape(encodeURIComponent(content)));

            const updateRes = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "slider speed update", content: base64Content, sha: sha })
            });

            if (updateRes.ok) {
                statusDiv.innerText = `変更成功: ${content}`;
            } else {
                statusDiv.innerText = "書き換え失敗";
            }
        } catch (e) {
            statusDiv.innerText = "通信エラー（設定を確認してください）";
        }
    }
</script>
</body>
</html>
