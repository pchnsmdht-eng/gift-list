<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Speed Controller</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; padding: 30px; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 1.2rem; color: #aaa; }
        
        /* スライダーの見た目 */
        .slider-container { margin: 40px 0; }
        input[type=range] { width: 100%; height: 15px; border-radius: 10px; background: #444; outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; background: #007bff; border-radius: 50%; cursor: pointer; }

        .speed-val { font-size: 3rem; font-weight: bold; margin: 10px 0; color: #007bff; }
        .label { display: flex; justify-content: space-between; color: #666; font-size: 0.8rem; }
        
        button { width: 100%; padding: 15px; margin-top: 20px; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .apply-btn { background: #007bff; color: white; }
        .stop-btn { background: #e74c3c; color: white; }
        button:active { transform: scale(0.98); opacity: 0.8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎁 ギフトスクロール調整</h1>
        
        <div class="speed-val" id="current-val">-1.0</div>
        
        <div class="slider-container">
            <div class="label"><span>ゆっくり</span><span>爆速</span></div>
            <input type="range" id="speed-slider" min="-10" max="10" step="0.1" value="-1.0" oninput="updateLabel(this.value)">
        </div>

        <button class="apply-btn" onclick="sendSpeed()">このスピードを配信に反映</button>
        <button class="stop-btn" onclick="quickStop()">一時停止 (0)</button>
    </div>

    <script>
        const USER = "あなたのユーザー名";
        const REPO = "あなたのリポジトリ名";
        const TOKEN = "ghp_XXXXXXXXXXXXXXXXXXXX"; 

        function updateLabel(val) {
            document.getElementById('current-val').innerText = parseFloat(val).toFixed(1);
        }

        async function quickStop() {
            document.getElementById('speed-slider').value = 0;
            updateLabel(0);
            sendSpeed();
        }

        async function sendSpeed() {
            const val = document.getElementById('speed-slider').value;
            const url = `https://api.github.com/repos/${USER}/${REPO}/contents/speed.txt`;
            
            try {
                const res = await fetch(url, { headers: { "Authorization": `token ${TOKEN}` } });
                const data = await res.json();

                const updateRes = await fetch(url, {
                    method: "PUT",
                    headers: { "Authorization": `token ${TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: "speed updated via slider",
                        content: btoa(val),
                        sha: data.sha
                    })
                });

                if(updateRes.ok) alert("反映しました！約15〜30秒で配信画面が変わります。");
                else alert("エラー：トークン設定を確認してください。");
            } catch (e) { alert("通信エラー"); }
        }
    </script>
</body>
</html>
