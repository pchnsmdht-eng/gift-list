<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スピードコントローラー</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }
        h3 { margin-bottom: 20px; color: #aaaaaa; font-size: 16px; }
        
        .btn-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 90vw;
            max-width: 400px;
            margin-bottom: 20px;
        }
        button {
            padding: 20px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: #2a2a2a;
            color: white;
            cursor: pointer;
            transition: background 0.1s;
        }
        button:active { background-color: #444444; }
        .stop-btn { background-color: #d32f2f; grid-column: span 3; }
        .stop-btn:active { background-color: #b71c1c; }
        
        #status { font-size: 14px; color: #888888; margin-top: 15px; }
    </style>
</head>
<body>

    <h3>⏱️ スピード調整</h3>
    <div class="btn-container">
        <button onclick="sendSpeed(-15)">≪ 速く</button>
        <button onclick="sendSpeed(-5)">＜ 左</button>
        <button onclick="sendSpeed(-1)">微微</button>
        
        <button onclick="sendSpeed(1)">微微</button>
        <button onclick="sendSpeed(5)">右 ＞</button>
        <button onclick="sendSpeed(15)">速く ≫</button>
        
        <button class="stop-btn" onclick="sendSpeed(0)">🛑 完全停止</button>
    </div>

    <div id="status">通信待機中...</div>

<script>
    // 🔴 ご自身の環境に合わせて設定してください
    const USER = "【あなたのGitHubユーザー名】";
    const REPO = "【あなたのリポジトリ名】";
    const TOKEN = "【あなたのGitHubトークン】";
    const FILE = "speed.txt";

    async function sendSpeed(val) {
        const url = `https://api.github.com/repos/${USER}/${REPO}/contents/${FILE}`;
        const statusDiv = document.getElementById('status');
        const content = String(val);
        
        try {
            statusDiv.innerText = "送信中...";
            const res = await fetch(url, { headers: { Authorization: `token ${TOKEN}` } });
            if (!res.ok) throw new Error("ファイル取得失敗");
            const data = await res.json();
            const sha = data.sha;

            const base64Content = btoa(unescape(encodeURIComponent(content)));

            const updateRes = await fetch(url, {
                method: "PUT",
                headers: { Authorization: `token ${TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "update speed", content: base64Content, sha: sha })
            });

            if (updateRes.ok) {
                statusDiv.innerText = `変更成功: ${content}`;
            } else {
                statusDiv.innerText = "書き換え失敗";
            }
        } catch (e) {
            statusDiv.innerText = `エラー: ${e.message}`;
        }
    }
</script>
</body>
</html>
