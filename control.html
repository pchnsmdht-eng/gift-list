<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コントローラー</title>
    <style>
        body { background: #121212; color: #fff; padding: 20px; font-family: sans-serif; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 12px; }
        #status { margin-top: 10px; text-align: center; color: #69f0ae; }
    </style>
</head>
<body>
    <div class="box">
        <input type="range" id="speed" min="-5" max="5" value="0" style="width:100%">
    </div>
    <div id="status">システム稼働中</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";
        
        const app = initializeApp({ databaseURL: "https://stream-control-default-rtdb.firebaseio.com/" });
        const db = getDatabase(app);
        
        document.getElementById('speed').oninput = (e) => {
            set(ref(db, 'speed'), -e.target.value);
            document.getElementById('status').innerText = "送信成功";
        };
    </script>
</body>
</html>
