<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controller UI</title>
    <style>
        :root { --accent: #00e5ff; --bg: #121212; --card: #1e1e1e; }
        body { background: var(--bg); color: #fff; font-family: 'Helvetica Neue', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
        .header { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; text-align: center; }
        #val-display { font-size: 72px; font-weight: bold; color: var(--accent); text-align: center; margin: 20px 0; text-shadow: 0 0 20px rgba(0,229,255,0.3); }
        
        input[type=range] { -webkit-appearance: none; width: 100%; height: 8px; background: #333; border-radius: 5px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; background: var(--accent); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px var(--accent); }
        
        #status { margin-top: 20px; padding: 10px; text-align: center; font-size: 12px; color: #666; border-radius: 10px; }
        .active { color: var(--accent) !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">Speed Control</div>
        <div id="val-display">0</div>
        <input type="range" id="s" min="-5" max="5" value="0">
    </div>
    <div id="status">Ready</div>
</div>

<script>
    const T = "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";
    const slider = document.getElementById('s');
    const display = document.getElementById('val-display');
    const status = document.getElementById('status');

    slider.oninput = (e) => { display.innerText = -e.target.value; };
    
    slider.onchange = async (e) => {
        const val = -e.target.value;
        status.innerText = "Syncing...";
        try {
            const res = await fetch("https://api.github.com/repos/pchnsmdht-eng/gift-list/contents/speed.txt", {headers:{"Authorization":"token "+T}});
            const data = await res.json();
            await fetch("https://api.github.com/repos/pchnsmdht-eng/gift-list/contents/speed.txt", {
                method:"PUT",
                headers:{"Authorization":"token "+T,"Content-Type":"application/json"},
                body:JSON.stringify({message:"update",content:btoa(val+",50"),sha:data.sha})
            });
            status.innerText = "Synced: " + val;
            status.classList.add('active');
        } catch(e) { status.innerText = "Error"; }
    };
</script>
</body>
</html>
