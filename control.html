<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    #master-container { width: 100%; height: 100%; transform-origin: top left; will-change: transform; }
    .marquee-track { display: flex; width: 8000px; will-change: transform; }
    .iframe-wrapper { width: 4000px; height: 698px; overflow: hidden; position: relative; }
    iframe { width: 4000px; height: 1200px; border: none; pointer-events: none; position: absolute; top: 0; left: 0; }
    .hardware-accel { backface-visibility: hidden; transform: translateZ(0); }
    @keyframes slideRight { 0% { transform: translate3d(-4000px, 0, 0); } 100% { transform: translate3d(0, 0, 0); } }
    @keyframes slideLeft { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-4000px, 0, 0); } }
</style>
</head>
<body>
    <div id="master-container">
        <div class="marquee-track" id="track">
            <div class="iframe-wrapper"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe></div>
            <div class="iframe-wrapper"><iframe src="https://app.streamtoearn.io/overlay/69d7b4d8e377b523a9c6a3aa"></iframe></div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        const firebaseConfig = { apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc", authDomain: "gift-list-app-53ef2.firebaseapp.com", projectId: "gift-list-app-53ef2", storageBucket: "gift-list-app-53ef2.firebasestorage.app", messagingSenderId: "161949465085", appId: "1:161949465085:web:3574bdee443e4fcec70194", measurementId: "G-B3PJELG3Q9" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const masterContainer = document.getElementById('master-container');
        const track = document.getElementById('track');
        const wrappers = document.querySelectorAll('.iframe-wrapper');
        onValue(ref(db, 'settings'), (snapshot) => {
            const data = snapshot.val() || {};
            const speed = data.speed || 0;
            const size = data.size || 0.3;
            const crop = data.crop || 100;
            masterContainer.style.transform = `scale(${size})`;
            wrappers.forEach(w => { w.style.height = `${(crop / 100) * 698}px`; });
            if(data.optimize) track.classList.add('hardware-accel'); else track.classList.remove('hardware-accel');
            if (speed === 0) { track.style.animationPlayState = 'paused'; } 
            else { track.style.animationName = speed > 0 ? 'slideRight' : 'slideLeft'; track.style.animationDuration = `${50 / Math.abs(speed)}s`; track.style.animationPlayState = 'running'; }
            if (data.pingRequest) set(ref(db, 'pingResponse'), { time: data.pingRequest });
        });
    </script>
</body>
</html>
