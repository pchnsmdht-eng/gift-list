<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
    <input type="range" id="s" min="-5" max="5" value="0">
    <div id="m">待機中</div>
    <script>
        const T = "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";
        document.getElementById('s').onchange = async (e) => {
            const val = -e.target.value;
            try {
                const res = await fetch("https://api.github.com/repos/pchnsmdht-eng/gift-list/contents/speed.txt", {headers:{"Authorization":"token "+T}});
                const data = await res.json();
                await fetch("https://api.github.com/repos/pchnsmdht-eng/gift-list/contents/speed.txt", {
                    method:"PUT",
                    headers:{"Authorization":"token "+T,"Content-Type":"application/json"},
                    body:JSON.stringify({message:"update",content:btoa(val+",50"),sha:data.sha})
                });
                document.getElementById('m').innerText = "完了: " + val;
            } catch(e) { document.getElementById('m').innerText = "失敗"; }
        };
    </script>
</body>
</html>
