<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ルームコントローラー</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .box { background: #1e1e1e; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        #speed-display { font-size: 40px; color: #00e5ff; text-align: center; }
        .speed-slider { width: 100%; height: 20px; }
        #debug-log { height: 120px; overflow-y: auto; background: #000; padding: 10px; font-size: 12px; color: #69f0ae; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="box">
        <div id="speed-display">0</div>
        <input type="range" id="speedInput" min="-5" max="5" value="0" class="speed-slider">
    </div>
    <div class="box">
        <div id="debug-log"></div>
    </div>

<script>
    const USER = "pchnsmdht-eng", REPO = "gift-list", FILE = "speed.txt";
    // ⚠️ ここにトークンを書き込んでください
    const T = "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"; 

    function addLog(msg) {
        const log = document.getElementById('debug-log');
        const entry = document.createElement('div');
        entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        log.prepend(entry);
    }

    async function send(val, count) {
        const url = `https://api.github.com/repos/${USER}/${REPO}/contents/${FILE}`;
        try {
            const res = await fetch(`${url}?t=${Date.now()}`, { headers: { "Authorization": `token ${T}` } });
            const data = await res.json();
            const content = btoa(unescape(encodeURIComponent(`${val},${count}`)));
            
            const updateRes = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${T}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "update", content: content, sha: data.sha })
            });
            if (updateRes.ok) addLog(`送信成功: 速度[${val}]`);
            else throw new Error("更新失敗");
        } catch (e) { addLog(`❌ エラー: ${e.message}`); }
    }

    document.getElementById('speedInput').addEventListener('change', (e) => {
        const val = -parseInt(e.target.value, 10);
        document.getElementById('speed-display').innerText = val;
        send(val, 50);
    });
</script>
</body>
</html>
