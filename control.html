<style>
    body { 
        background: #000000; /* 真っ黒 */
        color: #ffffff; 
        font-family: sans-serif; 
        display: flex; flex-direction: column; align-items: center; 
        padding: 20px; margin: 0; 
    }
    .control-panel { 
        width: 300px; 
        background: #1a1a1a; 
        padding: 20px; 
        border: 2px solid #ffffff; /* 枠線を白く強調 */
        border-radius: 12px; 
    }
    .val { 
        font-size: 32px; color: #ffff00; /* 黄色で最高視認性 */
        text-align: center; margin-bottom: 15px; font-weight: bold; 
    }
    .slider { 
        width: 100%; height: 12px; background: #404040; 
        -webkit-appearance: none; border-radius: 6px; margin-bottom: 20px; 
        border: 1px solid #ffffff; /* スライダーにも枠線 */
    }
    .slider::-webkit-slider-thumb { 
        -webkit-appearance: none; width: 24px; height: 24px; 
        background: #ffffff; border-radius: 50%; cursor: pointer; 
    }
    .btns { display: flex; gap: 8px; margin-bottom: 20px; }
    .btn { 
        flex: 1; padding: 10px; font-size: 12px; background: #333333; 
        border: 2px solid #ffffff; color: #ffffff; cursor: pointer; font-weight: bold;
    }
    .btn.active { background: #ffff00; color: #000000; border: 2px solid #ffff00; }
    #log { 
        width: 280px; height: 50px; overflow-y: auto; 
        font-size: 10px; color: #ffffff; border: 1px solid #ffffff; 
        padding: 5px; font-family: monospace;
    }
</style>
