<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Speed Remote</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; padding: 20px; }
        .card { background: #2a2a2a; padding: 25px; border-radius: 20px; max-width: 400px; margin: auto; }
        .speed-val { font-size: 3.5rem; font-weight: bold; color: #007bff; margin: 20px 0; }
        input[type=range] { width: 100%; height: 15px; background: #444; border-radius: 10px; outline: none; -webkit-appearance: none; margin: 20px 0; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 35px; height: 35px; background: #007bff; border-radius: 50%; cursor: pointer; border: 3px solid #fff; }
        button { width: 100%; padding: 18px; margin-top: 15px; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        .apply { background: #007bff; color: white; }
        .stop { background: #e74c3c; color: white; }
        .label { display: flex; justify-content: space-between; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:#aaa">🎁 ギフトスピード調整</h2>
        <div class="speed-val" id="val">-1.0</div>
        <div class="slider-container">
            <div class="label"><span>ゆっくり</span><span>爆速</span></div>
            <input type="range" id="slider" min="-10" max="10" step="0.1" value="-1.0" oninput="document.getElementById('val').innerText=parseFloat(this.value).toFixed(1)">
        </div>
        <button class="apply" onclick="send()">配信に反映する</button>
        <button class="stop" onclick="document.getElementById('slider').value=0; document.getElementById('val').innerText='0.0'; send()">一時停止 (0)</button>
    </div>

    <script>
        const USER = "pchnsmdht-eng";
        const REPO = "gift-list";
        // 🔴 下の "" の中にトークンを貼り付けてください
        const TOKEN = "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"; 

        async function send() {
            const val = document.getElementById('slider').value;
            const url = `https://api.github.com/repos/${USER}/${REPO}/contents/speed.txt`;
            try {
                const res = await fetch(url, { headers: { "Authorization": `token ${TOKEN}` } });
                const data = await res.json();
                const update = await fetch(url, {
                    method: "PUT",
                    headers: { "Authorization": `token ${TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "update", content: btoa(val), sha: data.sha })
                });
                if(update.ok) alert("反映しました！");
                else alert("トークンエラー：権限を確認してください");
            } catch (e) { alert("エラーが発生しました"); }
        }
    </script>
</body>
</html>
