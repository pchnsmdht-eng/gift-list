<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スピードスライダー</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }
        h3 { margin-top: 40px; margin-bottom: 10px; color: #aaaaaa; font-size: 16px; text-align: center; }
        
        .slider-container {
            width: 90vw;
            max-width: 400px;
            background-color: #1e1e1e;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        #speed-display {
            font-size: 36px;
            font-weight: bold;
            color: #00e5ff;
            margin-bottom: 20px;
        }

        .speed-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 14px;
            border-radius: 7px;
            background: #333333;
            outline: none;
        }

        /* スマホで掴みやすい大きなつまみ */
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,229,255,0.5);
        }
        .speed-slider::-moz-range-thumb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,229,255,0.5);
            border: none;
        }

        .labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
            font-size: 13px;
            color: #777777;
        }

        .stop-btn {
            width: 90vw;
            max-width: 400px;
            padding: 22px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: #d32f2f;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .stop-btn:active { background-color: #b71c1c; }
        
        #status { font-size: 13px; color: #888888; margin-top: 25px; text-align: center; width: 90vw; word-break: break-all; }
    </style>
</head>
<body>

    <h3>⏱️ スライダー速度調整</h3>
    
    <div class="slider-container">
        <div id="speed-display">0</div>
        
        <input type="range" id="speedInput" min="-15" max="15" value="0" class="speed-slider">
        
        <div class="labels">
            <span>≪ 左へ流す</span>
            <span>停止</span>
            <span>右へ流す ≫</span>
        </div>
    </div>

    <button class="stop-btn" onclick="resetToZero()">🛑 スライダーを中央に戻す（停止）</button>

    <div id="status">通信待機中...</div>

<script>
    // 🔴 ご自身のGitHub環境に書き換えてください（多少のスペース・記号ミスは自動除去されます）
    const RAW_USER = "【あなたのGitHubユーザー名】";
    const RAW_REPO = "【あなたのリポジトリ名】";
    const RAW_TOKEN = "【あなたのGitHubトークン】";
    const FILE = "speed.txt";

    // エラーの原因となる見えない文字や全角スペース、不要な【】を自動で掃除する機能
    const USER = RAW_USER.replace(/[【】\s]/g, "").trim();
    const REPO = RAW_REPO.replace(/[【】\s]/g, "").trim();
    const TOKEN = RAW_TOKEN.replace(/[【】\s\u3000]/g, "").replace(/[^a-zA-Z0-9_]/g, "").trim();

    const slider = document.getElementById('speedInput');
    const display = document.getElementById('speed-display');
    let timer = null;

    // スライダーを動かしているとき
    slider.addEventListener('input', (e) => {
        const val = e.target.value;
        display.innerText = val;
        
        // GitHubへの連続書き込みエラーを防ぐため0.25秒間止まったら送信
        clearTimeout(timer);
        timer = setTimeout(() => {
            sendSpeed(val);
        }, 250);
    });

    // 指を離した瞬間
    slider.addEventListener('change', (e) => {
        clearTimeout(timer);
        sendSpeed(e.target.value);
    });

    // 🛑 停止ボタン
    function resetToZero() {
        clearTimeout(timer);
        slider.value = 0;
        display.innerText = "0";
        sendSpeed("0");
    }

    // GitHubのspeed.txtを上書きするメイン処理
    async function sendSpeed(val) {
        const url = `https://api.github.com/repos/${USER}/${REPO}/contents/${FILE}`;
        const statusDiv = document.getElementById('status');
        const content = String(val);
        
        try {
            statusDiv.innerText = "設定を送信中...";
            
            // トークンチェック
            if(!TOKEN || TOKEN.startsWith("あなたの")) {
                statusDiv.innerText = "エラー: トークンが正しく入力されていません";
                return;
            }

            const res = await fetch(url, { 
                headers: { "Authorization": `token ${TOKEN}` } 
            });
            if (!res.ok) throw new Error("GitHubからファイル情報の取得に失敗しました。設定を見直してください。");
            const data = await res.json();
            const sha = data.sha;

            const base64Content = btoa(unescape(encodeURIComponent(content)));

            const updateRes = await fetch(url, {
                method: "PUT",
                headers: { 
                    "Authorization": `token ${TOKEN}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({ message: "slider update", content: base64Content, sha: sha })
            });

            if (updateRes.ok) {
                statusDiv.innerText = `変更成功: 現在の速度 [ ${content} ]`;
            } else {
                statusDiv.innerText = "GitHubの書き換えに失敗しました。";
            }
        } catch (e) {
            statusDiv.innerText = `エラー: ${e.message}`;
        }
    }
</script>
</body>
</html>
