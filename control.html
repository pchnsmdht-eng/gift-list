<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background: #0f172a; /* 視認性の高い深いダークブルー */
            color: #fff; font-family: sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; margin: 0; 
        }
        .panel { 
            width: 320px; background: #1e293b; padding: 20px; 
            border-radius: 12px; border: 2px solid #334155; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .val { font-size: 40px; color: #f0f9ff; text-align: center; margin-bottom: 10px; font-weight: bold; }
        .slider { 
            width: 100%; height: 8px; background: #334155; 
            -webkit-appearance: none; border-radius: 4px; margin-bottom: 20px; 
        }
        .slider::-webkit-slider-thumb { 
            -webkit-appearance: none; width: 24px; height: 24px; 
            background: #fb923c; border-radius: 50%; cursor: pointer; border: 3px solid #fff;
        }
        .btns { display: flex; gap: 10px; }
        .btn { 
            flex: 1; padding: 12px 0; font-size: 14px; background: #334155; 
            border: 1px solid #475569; color: #cbd5e1; cursor: pointer; border-radius: 8px;
        }
        .btn.active { background: #06b6d4; color: #fff; border: none; font-weight: bold; }
        #log { 
            width: 100%; height: 50px; font-size: 10px; color: #94a3b8; 
            margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px; overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div id="val" class="val">0</div>
        <input type="range" id="range" class="slider" min="-5" max="5" value="0">
        <div class="btns">
            <button class="btn" onclick="setCount(this, 50)">50</button>
            <button class="btn" onclick="setCount(this, 100)">100</button>
            <button class="btn" onclick="setCount(this, 150)">150</button>
        </div>
        <div id="log"></div>
    </div>

    <script>
        const G_TOKEN = "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";
        const G_URL = "https://api.github.com/repos/pchnsmdht-eng/gift-list/contents/speed.txt";
        let curCount = 50;

        function log(m) { document.getElementById('log').innerHTML = `> ${m}<br>` + document.getElementById('log').innerHTML; }
        
        function setCount(el, c) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            curCount = c;
            update(document.getElementById('range').value * -1, c);
        }

        async function update(s, c) {
            try {
                // 通信エラー対策：ヘッダーを厳格に指定
                const get = await fetch(G_URL, { headers: { "Authorization": "token " + G_TOKEN, "Cache-Control": "no-cache" } });
                if (!get.ok) throw new Error("API接続エラー: " + get.status);
                const data = await get.json();
                
                const res = await fetch(G_URL, {
                    method: "PUT",
                    headers: { "Authorization": "token " + G_TOKEN, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "update", content: btoa(`${s},${c}`), sha: data.sha })
                });
                if(res.ok) log(`送信成功: 速度[${s}] 個数[${c}]`); 
                else { const err = await res.json(); log("失敗: " + err.message); }
            } catch(e) { log("エラー: " + e.message); }
        }

        document.getElementById('range').oninput = (e) => {
            const v = e.target.value * -1;
            document.getElementById('val').innerText = v;
            update(v, curCount);
        };
    </script>
</body>
</html>
