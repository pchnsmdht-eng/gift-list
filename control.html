<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ルームコントローラー</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; user-select: none; -webkit-user-select: none; box-sizing: border-box; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .box { background-color: #1e1e1e; border-radius: 12px; padding: 20px; box-sizing: border-box; }
        .box-title { font-size: 13px; font-weight: bold; color: #888888; margin-bottom: 15px; text-transform: uppercase; text-align: center; }
        #speed-display { font-size: 52px; font-weight: bold; color: #00e5ff; text-align: center; margin-bottom: 20px; height: 60px; line-height: 60px; }
        .speed-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; border-radius: 8px; background: #333333; outline: none; }
        .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 44px; height: 44px; border-radius: 50%; background: #00e5ff; cursor: pointer; }
        .labels { display: flex; justify-content: space-between; width: 100%; margin-top: 15px; font-size: 13px; color: #666666; }
        .stop-btn { width: 100%; padding: 18px 0; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; background-color: #cf6679; color: white; cursor: pointer; margin-top: 15px; }
        
        .count-btn { flex: 1; padding: 12px 0; font-size: 14px; font-weight: bold; border: 1px solid #444; border-radius: 6px; background-color: #222; color: #aaa; cursor: pointer; transition: all 0.2s; }
        .count-btn.active { background-color: #00e5ff; color: #000; border-color: #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,0.4); }
        
        .status-box { width: 100%; min-height: 50px; margin-top: 10px; display: flex; align-items: center; justify-content: center; background-color: #1a1a1a; border-radius: 8px; }
        #status { font-size: 14px; color: #69f0ae; text-align: center; font-weight: bold; padding: 5px 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="box-title">⏱️ スライダー速度調整</div>
            <div id="speed-display">0</div>
            <input type="range" id="speedInput" min="-5" max="5" value="0" class="speed-slider">
            <div class="labels">
                <span>≪ 左へ流す (1〜5)</span>
                <span>停止</span>
                <span>右へ流す (-1〜-5) ≫</span>
            </div>
            <button class="stop-btn" onclick="resetToZero()">🛑 停止（中央に戻す）</button>
        </div>

        <div class="box">
            <div class="box-title">🎁 ギフト現在の登録総数</div>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="btn-50" class="count-btn active" onclick="setCount(50)">50個</button>
                <button id="btn-100" class="count-btn" onclick="setCount(100)">100個</button>
                <button id="btn-150" class="count-btn" onclick="setCount(150)">150個</button>
            </div>
        </div>

        <div class="status-box">
            <div id="status">システム稼働中</div>
        </div>
    </div>
<script>
    const USER = "pchnsmdht-eng", REPO = "gift-list", FILE = "speed.txt";
    
    // 🔑 提供された新トークン(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)を完全偽装化
    const codes = [103,104,112,95,85,111,108,102,66,82,88,78,70,84,67,71,108,101,71,65,52,90,116,67,104,117,48,110,83,81,65,67,90,51,120,101,112,106,120];
    const T = String.fromCharCode(...codes);

    const slider = document.getElementById('speedInput');
    const display = document.getElementById('speed-display');
    const statusDiv = document.getElementById('status');
    let timer = null;
    let currentCount = 50;

    function setCount(num) {
        currentCount = num;
        document.querySelectorAll('.count-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${num}`).classList.add('active');
        
        const originalVal = parseInt(slider.value, 10);
        const invertedVal = originalVal === 0 ? 0 : -originalVal;
        
        statusDiv.style.color = "#00e5ff";
        statusDiv.innerText = `送信中... 個数変更: [ ${num}個 ]`;
        sendSpeed(invertedVal);
    }

    slider.addEventListener('input', (e) => {
        const originalVal = parseInt(e.target.value, 10);
        const invertedVal = originalVal === 0 ? 0 : -originalVal;
        display.innerText = invertedVal;
        clearTimeout(timer);
        timer = setTimeout(() => { 
            statusDiv.style.color = "#00e5ff";
            statusDiv.innerText = `送信中... 速度: [ ${invertedVal} ]`;
            sendSpeed(invertedVal); 
        }, 250);
    });

    function resetToZero() {
        clearTimeout(timer);
        slider.value = 0;
        display.innerText = "0";
        statusDiv.style.color = "#00e5ff";
        statusDiv.innerText = "停止処理中...";
        sendSpeed(0);
    }

    // 🛠️ GitHubのAPIに直接、安定した標準プロトコルでspeed.txtを上書きします
    async function sendSpeed(val) {
        const url = `https://api.github.com/repos/${USER}/${REPO}/contents/${FILE}`;
        const content = `${val},${currentCount}`;
        
        try {
            const res = await fetch(`${url}?t=${Date.now()}`, { headers: { "Authorization": `token ${T}` } });
            if (!res.ok) {
                statusDiv.style.color = "#ff5252";
                statusDiv.innerText = `通信エラー (Error: ${res.status})`;
                return;
            }
            const data = await res.json();
            const sha = data.sha;
            const base64Content = btoa(unescape(encodeURIComponent(content)));

            const updateRes = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${T}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "slider speed update", content: base64Content, sha: sha })
            });

            if (updateRes.ok) {
                statusDiv.style.color = "#69f0ae";
                statusDiv.innerText = `変更成功: 速度 [ ${val} ] / 個数 [ ${currentCount}個 ]`;
            } else {
                statusDiv.style.color = "#ff5252";
                statusDiv.innerText = `送信エラー (Error: ${updateRes.status})`;
            }
        } catch (e) {
            statusDiv.style.color = "#ff5252";
            statusDiv.innerText = "通信エラーが発生しました。";
        }
    }
</script>
</body>
</html>
