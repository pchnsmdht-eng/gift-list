<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スクロールスピードコントローラー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        
        h3 {
            margin-top: 40px;
            margin-bottom: 15px;
            color: #aaaaaa;
            font-size: 16px;
            text-align: center;
        }
        
        /* 枠が上下に動かないよう固定したコンテナ */
        .slider-container {
            width: 90vw;
            max-width: 400px;
            background-color: #1e1e1e;
            padding: 30px 20px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        /* 速度の数字（チカチカ・ガタつき防止の高さ固定） */
        #speed-display {
            font-size: 46px;
            font-weight: bold;
            color: #00e5ff;
            margin-bottom: 20px;
            height: 55px;
            line-height: 55px;
        }

        /* 横幅いっぱいに広がる使いやすいスライダー */
        .speed-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 16px;
            border-radius: 8px;
            background: #333333;
            outline: none;
        }

        /* スマホのブラウザで一番掴みやすい特大の丸つまみ */
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
        }
        .speed-slider::-moz-range-thumb {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
            border: none;
        }

        /* 左右の目盛りラベル */
        .labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
            font-size: 13px;
            color: #666666;
        }

        /* 🛑 完全停止ボタン（赤） */
        .stop-btn {
            width: 90vw;
            max-width: 400px;
            padding: 22px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: #d32f2f;
            color: white;
            cursor: pointer;
        }
        .stop-btn:active { background-color: #b71c1c; }
        
        /* 通信中などの文字で画面が揺れないよう、高さを固定した枠 */
        .status-box {
            width: 90vw;
            max-width: 400px;
            min-height: 50px;
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #status { font-size: 13px; color: #666666; text-align: center; }
    </style>
</head>
<body>

    <h3>⏱️ スライドでスピード調整</h3>
    
    <div class="slider-container">
        <div id="speed-display">0</div>
        
        <input type="range" id="speedInput" min="-5" max="5" value="0" class="speed-slider">
        
        <div class="labels">
            <span>≪ 左へスライド（1〜5）</span>
            <span>停止</span>
            <span>右へスライド（-1〜-5） ≫</span>
        </div>
    </div>

    <button class="stop-btn" onclick="resetToZero()">🛑 スライダーを中央に戻す（停止）</button>

    <div class="status-box">
        <div id="status">待機中</div>
    </div>

<script>
    // ==========================================
    // ⚠️ ここをご自身の環境に書き換えてください
    // ==========================================
    const RAW_USER  = "あなたのGitHubユーザー名";
    const RAW_REPO  = "あなたのリポジトリ名";
    const RAW_TOKEN = "あなたのGitHubトークン";
    const FILE = "speed.txt";

    // 全角スペースや記号を自動で消去してエラーを防ぐガード
    const USER = RAW_USER.replace(/[【】\s\u3000]/g, "").trim();
    const REPO = RAW_REPO.replace(/[【】\s\u3000]/g, "").trim();
    const TOKEN = RAW_TOKEN.replace(/[【】\s\u3000]/g, "").replace(/[^a-zA-Z0-9_]/g, "").trim();

    const slider = document.getElementById('speedInput');
    const display = document.getElementById('speed-display');
    const statusDiv = document.getElementById('status');
    let timer = null;

    // スライダーを動かした時の処理
    slider.addEventListener('input', (e) => {
        // 通常のスライダーは右に動かすとプラスになりますが、
        // ご希望通り「右に動かすとマイナス（-1〜-5）」にするため、数値をひっくり返します。
        const originalVal = parseInt(e.target.value, 10);
        const invertedVal = originalVal === 0 ? 0 : -originalVal;
        
        display.innerText = invertedVal; // 画面の数字表示を連動
        
        // 連続送信によるエラー（チカチカ）を防ぐため、指が少し止まったら送信
        clearTimeout(timer);
        timer = setTimeout(() => { sendSpeed(invertedVal); }, 250);
    });

    // 指を離した瞬間（最終確定）
    slider.addEventListener('change', (e) => {
        clearTimeout(timer);
        const originalVal = parseInt(e.target.value, 10);
        const invertedVal = originalVal === 0 ? 0 : -originalVal;
        sendSpeed(invertedVal);
    });

    // 🛑 停止ボタンを押した時
    function resetToZero() {
        clearTimeout(timer);
        slider.value = 0;
        display.innerText = "0";
        sendSpeed(0);
    }

    // GitHubのspeed.txtを書き換えるシンプルな関数
    async function sendSpeed(val) {
        const url = `https://api.github.com/repos/${USER}/${REPO}/contents/${FILE}`;
        const content = String(val);
        statusDiv.innerText = "送信中...";
        
        try {
            const res = await fetch(url, { headers: { "Authorization": `token ${TOKEN}` } });
            if (!res.ok) throw new Error();
            const data = await res.json();
            const sha = data.sha;

            const base64Content = btoa(unescape(encodeURIComponent(content)));

            const updateRes = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "slider speed reset", content: base64Content, sha: sha })
            });

            if (updateRes.ok) {
                statusDiv.innerText = `変更成功: ${content}`;
            } else {
                statusDiv.innerText = "書き換え失敗";
            }
        } catch (e) {
            statusDiv.innerText = "通信エラー（設定を確認してください）";
        }
    }
</script>
</body>
</html>
