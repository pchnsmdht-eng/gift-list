<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ルームコントローラー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 各枠の共通スタイル */
        .box {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 18px;
            box-sizing: border-box;
        }
        
        .box-title {
            font-size: 13px;
            font-weight: bold;
            color: #888888;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 設定入力欄 */
        .input-group {
            margin-bottom: 10px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            color: #aaaaaa;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            background-color: #2b2b2b;
            border: 1px solid #333333;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        /* ボタン基本 */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn-save { background-color: #ffb300; color: #121212; }
        .btn-stop { background-color: #cf6679; color: #ffffff; margin-top: 15px; }

        /* スライダー */
        .slider-display {
            font-size: 46px;
            font-weight: bold;
            color: #00e5ff;
            text-align: center;
            margin-bottom: 10px;
            height: 55px;
            line-height: 55px;
        }
        .speed-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 12px;
            border-radius: 6px;
            background: #333333;
            outline: none;
            margin: 10px 0;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
        }
        .speed-slider::-moz-range-thumb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
            border: none;
        }
        .labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666666;
            margin-top: 4px;
        }
        
        /* 💬 チカチカ・ガタつきを完全に排除したステータスエリア */
        .status-box {
            background-color: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            width: 100%;
            min-height: 60px; /* 高さを完全に固定して画面の揺れを防ぐ */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #status {
            font-size: 12px;
            color: #aaaaaa;
            text-align: center;
            word-break: break-all;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box">
            <div class="box-title">⚙️ GitHub 接続設定</div>
            <div class="input-group">
                <label>GitHubユーザー名</label>
                <input type="text" id="gitUser" placeholder="ユーザー名を入力">
            </div>
            <div class="input-group">
                <label>リポジトリ名</label>
                <input type="text" id="gitRepo" placeholder="リポジトリ名を入力">
            </div>
            <div class="input-group">
                <label>個人アクセストークン</label>
                <input type="password" id="gitToken" placeholder="ghp_から始まるトークンを入力">
            </div>
            <button class="btn btn-save" onclick="saveConfig()">設定をスマホに保存</button>
        </div>

        <div class="box">
            <div class="box-title">⏱️ スライダー速度調整</div>
            <div class="slider-display" id="speed-display">0</div>
            <input type="range" id="speedInput" min="-15" max="15" value="0" class="speed-slider">
            <div class="labels">
                <span>≪ 左へ流す</span>
                <span>停止（中央）</span>
                <span>右へ流す ≫</span>
            </div>
            <button class="btn btn-stop" onclick="resetToZero()">🛑 停止（中央に戻す）</button>
        </div>

        <div class="status-box">
            <div id="status">設定フォームに入力し、保存ボタンを押してください。</div>
        </div>
    </div>

<script>
    const slider = document.getElementById('speedInput');
    const display = document.getElementById('speed-display');
    const statusDiv = document.getElementById('status');
    const FILE = "speed.txt";
    let timer = null;

    // 読み込み時に過去の設定を自動復元
    window.onload = function() {
        if(localStorage.getItem('git_user')) document.getElementById('gitUser').value = localStorage.getItem('git_user');
        if(localStorage.getItem('git_repo')) document.getElementById('gitRepo').value = localStorage.getItem('git_repo');
        if(localStorage.getItem('git_token')) document.getElementById('gitToken').value = localStorage.getItem('git_token');
        
        if(localStorage.getItem('git_user') && localStorage.getItem('git_repo') && localStorage.getItem('git_token')) {
            statusDiv.style.color = "#69f0ae";
            statusDiv.innerText = "設定が読み込まれました。スライダーを動かせます。";
        }
    };

    // 設定保存
    function saveConfig() {
        let u = document.getElementById('gitUser').value.trim();
        let r = document.getElementById('gitRepo').value.trim();
        let t = document.getElementById('gitToken').value.trim();

        // 不要な文字を全自動で除去
        u = u.replace(/[【】\s\u3000]/g, "");
        r = r.replace(/[【】\s\u3000]/g, "");
        t = t.replace(/[【】\s\u3000]/g, "").replace(/[^a-zA-Z0-9_]/g, "");

        if(!u || !r || !t) {
            statusDiv.style.color = "#ff5252";
            statusDiv.innerText = "入力欄に空欄があります。";
            return;
        }

        localStorage.setItem('git_user', u);
        localStorage.setItem('git_repo', r);
        localStorage.setItem('git_token', t);

        statusDiv.style.color = "#69f0ae";
        statusDiv.innerText = "設定をスマホに保存しました。接続テスト中...";
        sendSpeed("0");
    }

    slider.addEventListener('input', (e) => {
        const val = e.target.value;
        display.innerText = val;
        clearTimeout(timer);
        timer = setTimeout(() => { sendSpeed(val); }, 250);
    });

    slider.addEventListener('change', (e) => {
        clearTimeout(timer);
        sendSpeed(e.target.value);
    });

    function resetToZero() {
        clearTimeout(timer);
        slider.value = 0;
        display.innerText = "0";
        sendSpeed("0");
    }

    async function sendSpeed(val) {
        const user = localStorage.getItem('git_user');
        const repo = localStorage.getItem('git_repo');
        const token = localStorage.getItem('git_token');

        if(!user || !repo || !token) {
            statusDiv.style.color = "#ff5252";
            statusDiv.innerText = "設定が保存されていません。上の入力欄を埋めて保存してください。";
            return;
        }

        statusDiv.style.color = "#aaaaaa";
        statusDiv.innerText = "通信中...";

        const url = `https://api.github.com/repos/${user}/${repo}/contents/${FILE}`;
        const content = String(val);
        
        try {
            const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
            if (!res.ok) throw new Error("GitHubへの接続に失敗しました。設定（大文字小文字など）が本当に合っているか確認してください。");
            
            const data = await res.json();
            const sha = data.sha;
            const base64Content = btoa(unescape(encodeURIComponent(content)));

            const updateRes = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token
