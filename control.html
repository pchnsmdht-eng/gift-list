<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スピードスライダー</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        
        /* ⚙️ 設定フォームの見た目 */
        .config-box {
            width: 100%;
            max-width: 400px;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .config-title {
            font-size: 14px;
            font-weight: bold;
            color: #ffb300;
            margin-bottom: 12px;
        }
        .config-field {
            margin-bottom: 10px;
        }
        .config-field label {
            display: block;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 4px;
        }
        .config-field input {
            width: 100%;
            padding: 10px;
            background-color: #2b2b2b;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .save-btn {
            width: 100%;
            padding: 12px;
            background-color: #ffb300;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        
        /* ⏱️ スライダーの見た目 */
        .slider-container {
            width: 100%;
            max-width: 400px;
            background-color: #1e1e1e;
            padding: 25px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        #speed-display {
            font-size: 46px;
            font-weight: bold;
            color: #00e5ff;
            margin-bottom: 15px;
        }

        .speed-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 20px;
            border-radius: 10px;
            background: #333333;
            outline: none;
        }

        /* スマホで回しやすい大きなつまみ */
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(0,229,255,0.5);
        }
        .speed-slider::-moz-range-thumb {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #00e5ff;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(0,229,255,0.5);
            border: none;
        }

        .labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
            font-size: 13px;
            color: #888888;
        }

        /* 🛑 停止ボタン */
        .stop-btn {
            width: 100%;
            max-width: 400px;
            padding: 22px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: #d32f2f;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .stop-btn:active { background-color: #b71c1c; }
        
        /* 💬 日本語メッセージ欄 */
        #status { 
            font-size: 13px; 
            color: #aaa; 
            margin-top: 20px; 
            text-align: center; 
            width: 100%; 
            max-width: 400px;
            word-break: break-all;
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #1a1a1a;
        }
        .err-status { color: #ff5252 !important; background-color: rgba(255,82,82,0.1) !important; font-weight: bold; }
        .success-status { color: #69f0ae !important; background-color: rgba(105,240,174,0.1) !important; }
    </style>
</head>
<body>

    <div class="config-box">
        <div class="config-title">⚙️ GitHub接続設定（最初の一回だけ入力）</div>
        <div class="config-field">
            <label>GitHubユーザー名</label>
            <input type="text" id="gitUser" placeholder="ユーザー名を入力">
        </div>
        <div class="config-field">
            <label>リポジトリ名</label>
            <input type="text" id="gitRepo" placeholder="リポジトリ名を入力">
        </div>
