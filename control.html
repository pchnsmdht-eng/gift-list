<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ルームコントローラー</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        .box { background-color: #1e1e1e; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        #speed-display { font-size: 52px; color: #00e5ff; text-align: center; margin-bottom: 20px; }
        .speed-slider { width: 100%; height: 20px; }
        #debug-log { height: 120px; overflow-y: auto; background: #000; padding: 10px; font-family: monospace; font-size: 12px; color: #69f0ae; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="box">
        <div id="speed-display">0</div>
        <input type="range" id="speedInput" min="-5" max="5" value="0" class="speed-slider">
    </div>
    <div class="box">
        <div id="debug-log"></div>
    </div>

<script>
    const USER = "pchnsmdht-eng";
    const REPO = "gift-list";
    const FILE = "speed.txt";
    const T = "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";

    function addLog(msg) {
        const log = document.getElementById('debug-log');
        const entry = document.createElement('div');
        entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        log.prepend(entry);
    }

    async function send(val, count) {
        const url = `https://api.github.com/repos/${USER}/${REPO}/contents/${FILE}`;
        try {
            // 1. 最新のSHAを取得
            const res = await fetch(`${url}?t=${Date.now()}`, { 
                headers: { "Authorization": `token ${T}`, "Cache-Control": "no-cache" } 
            });
            if (!res.ok) throw new Error("ファイル取得失敗");
            const data = await res.json();
            
            // 2. 更新
            const updateRes = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${T}`, "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    message: "update", 
                    content: btoa(`${val},${count}`), 
                    sha: data.sha 
                })
            });

            if (updateRes.ok) {
                addLog(`成功: 速度[${val}]`);
            } else {
                const err = await updateRes.json();
                addLog(`失敗: ${err.message}`);
            }
        } catch (e) {
            addLog(`エラー: ${e.message}`);
        }
    }

    document.getElementById('speedInput').addEventListener('change', (e) => {
        const val = -parseInt(e.target.value, 10);
        document.getElementById('speed-display').innerText = val;
        send(val, 50);
    });
</script>
</body>
</html>
