<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; user-select: none; }
        .panel { width: 300px; }
        /* リモコン風ディスプレイ */
        .display { font-size: 40px; color: #00e5ff; text-align: center; margin-bottom: 20px; font-weight: bold; }
        /* リモコン風スライダー */
        .slider { width: 300px; height: 10px; background: #222; -webkit-appearance: none; border-radius: 5px; margin-bottom: 25px; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #00e5ff; }
        /* ボタン群：押しやすさを重視 */
        .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .btn { padding: 15px 0; background: #222; border: none; color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); background: #00e5ff; color: #000; }
        .btn.active { background: #00e5ff; color: #000; }
        #log { width: 300px; height: 50px; font-size: 9px; color: #555; margin-top: 20px; overflow: hidden; border-top: 1px solid #222; padding-top: 5px; }
    </style>
</head>
<body>
    <div class="panel">
        <div id="val" class="display">0</div>
        <input type="range" id="range" class="slider" min="-5" max="5" value="0">
        <div class="buttons">
            <button class="btn" onclick="setCount(this, 50)">50</button>
            <button class="btn" onclick="setCount(this, 100)">100</button>
            <button class="btn" onclick="setCount(this, 150)">150</button>
        </div>
        <div id="log"></div>
    </div>
    <script>
        const G_TOKEN = "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";
        const G_URL = "https://api.github.com/repos/pchnsmdht-eng/gift-list/contents/speed.txt";
        let curCount = 50;

        function log(m) { document.getElementById('log').innerText = m; }
        
        function setCount(el, c) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            curCount = c;
            update(document.getElementById('range').value * -1, c);
        }

        async function update(s, c) {
            try {
                const get = await fetch(G_URL, { headers: { "Authorization": "token " + G_TOKEN, "Cache-Control": "no-cache" }, mode: 'cors' });
                const data = await get.json();
                const res = await fetch(G_URL, {
                    method: "PUT",
                    mode: 'cors',
                    headers: { "Authorization": "token " + G_TOKEN, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "u", content: btoa(`${s},${c}`), sha: data.sha })
                });
                if(res.ok) log(`送信成功: 速度${s} / 個数${c}`); 
                else log("通信エラー: " + res.status);
            } catch(e) { log("エラー: " + e.message); }
        }

        document.getElementById('range').oninput = (e) => {
            const v = e.target.value * -1;
            document.getElementById('val').innerText = v;
            update(v, curCount);
        };
    </script>
</body>
</html>
