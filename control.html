<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ルームコントローラー</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; user-select: none; -webkit-user-select: none; box-sizing: border-box; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .box { background-color: #1e1e1e; border-radius: 12px; padding: 20px; box-sizing: border-box; }
        .box-title { font-size: 13px; font-weight: bold; color: #888888; margin-bottom: 15px; text-transform: uppercase; text-align: center; }
        #speed-display { font-size: 52px; font-weight: bold; color: #00e5ff; text-align: center; margin-bottom: 20px; height: 60px; line-height: 60px; }
        .speed-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; border-radius: 8px; background: #333333; outline: none; }
        .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 44px; height: 44px; border-radius: 50%; background: #00e5ff; cursor: pointer; }
        .labels { display: flex; justify-content: space-between; width: 100%; margin-top: 15px; font-size: 13px; color: #666666; }
        .stop-btn { width: 100%; padding: 18px 0; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; background-color: #cf6679; color: white; cursor: pointer; margin-top: 15px; }
        
        .count-btn { flex: 1; padding: 12px 0; font-size: 14px; font-weight: bold; border: 1px solid #444; border-radius: 6px; background-color: #222; color: #aaa; cursor: pointer; transition: all 0.2s; }
        .count-btn.active { background-color: #00e5ff; color: #000; border-color: #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,0.4); }

        .token-input { width: 100%; padding: 12px; background-color: #222; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 14px; text-align: center; outline: none; margin-top: 5px; }
        .token-btn { width: 100%; padding: 12px; background-color: #00e5ff; color: #000; font-weight: bold; border: none; border-radius: 6px; margin-top: 10px; cursor: pointer; }
        .status-box { width: 100%; min-height: 50px; margin-top: 10px; display: flex; align-items: center; justify-content: center; background-color: #1a1a1a; border-radius: 8px; }
        #status { font-size: 13px; color: #888888; text-align: center; padding: 5px 10px; }
    </style>
</head>

        <div class="box">
