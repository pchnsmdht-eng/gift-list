<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #222; color: #fff; padding: 20px; font-family: sans-serif; }
        .control-box { display: flex; flex-direction: column; gap: 20px; }
        input { font-size: 1.5rem; padding: 10px; border-radius: 5px; }
        button { padding: 15px; font-size: 1.2rem; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h3>配信リモートコントローラー</h3>
    <div class="control-box">
        <label>ギフト個数 (50-150)</label>
        <input type="number" id="count" value="50">
        
        <label>スピード (-5 ～ +5)</label>
        <input type="range" id="speed" min="-5" max="5" value="1">
        
        <button onclick="send()">配信へ反映</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        const db = getDatabase(initializeApp({ /* Firebase設定 */ }));
        
        window.send = () => {
            set(ref(db, 'settings'), {
                count: parseInt(document.getElementById('count').value),
                speed: parseInt(document.getElementById('speed').value)
            });
        };
    </script>
</body>
</html>
