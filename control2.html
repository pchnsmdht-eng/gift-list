<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #1a1a1a; color: #eee; padding: 15px; font-family: monospace; }
        .panel { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="range"], select { width: 100%; margin-bottom: 10px; background: #333; color: #fff; border: 1px solid #555; padding: 5px; box-sizing: border-box; }
        select { font-size: 1.1rem; padding: 10px; border-radius: 5px; }
        .value-display { font-size: 1.2rem; color: #0f0; margin-bottom: 20px; text-align: right; display: block; }
        .checkbox-group { display: flex; align-items: center; margin-bottom: 20px; }
        .checkbox-group input { margin-right: 10px; width: 20px; height: 20px; }
        
        .apply-btn { width: 100%; padding: 15px; background: #007bff; color: white; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
        .apply-btn:active { background: #0056b3; transform: translateY(2px); }

        #log-terminal { background: #000; color: #0f0; padding: 10px; height: 180px; overflow-y: auto; font-size: 0.85rem; border: 1px solid #444; line-height: 1.5; }
        .log-success { color: #00ff00; } .log-wait { color: #aaaaaa; } .log-info { color: #00bfff; }
    </style>
</head>
<body>
    <div class="panel">
        <label style="color: #00ffaa;">ループ列数パターン選択</label>
        <select id="columns" onchange="updateDisplay()">
            <option value="3" selected>3列ループ（標準）</option>
            <option value="4">4列ループ（広範囲）</option>
        </select>
        <span class="value-display" id="columns-val" style="color: #00ffaa;">セット予定: 3列ループ</span>

        <label style="color: #ffff00;">① 仮想画面の横幅 (折り返し位置の調整: 400px ～ 3000px)</label>
        <input type="range" id="windowWidth" min="400" max="3000" step="10" value="1200" oninput="updateDisplay()">
        <span class="value-display" id="width-val" style="color: #ffff00;">セット予定値: 1200px</span>

        <label style="color: #ffaa00;">② 仮想画面の縦幅 (高さの調整: 200px ～ 1200px)</label>
        <input type="range" id="windowHeight" min="200" max="1200" step="10" value="600" oninput="updateDisplay()">
        <span class="value-display" id="height-val" style="color: #ffaa00;">セット予定値: 600px</span>

        <label style="color: #00bfff;">③ 配信画面での大きさ (全体のスケール: 0.1倍 ～ 2.0倍)</label>
        <input type="range" id="displayScale" min="0.1" max="2.0" step="0.05" value="0.5" oninput="updateDisplay()">
        <span class="value-display" id="scale-val" style="color: #00bfff;">セット予定値: 0.5x</span>

        <label>スクロール速度・方向 (-10 左 ～ +10 右)</label>
        <input type="range" id="speed" min="-10" max="10" step="0.1" value="1" oninput="updateDisplay()">
        <span class="value-display" id="speed-val">セット予定値: 1</span>

        <label style="color: #ff00ff;">自動更新間隔 (秒)</label>
        <input type="range" id="refreshSec" min="10" max="300" step="10" value="60" oninput="updateDisplay()">
        <span class="value-display" id="refresh-val" style="color: #ff00ff;">セット予定値: 60秒</span>

        <div class="checkbox-group">
            <input type="checkbox" id="optimize" checked>
            <label for="optimize" style="margin:0;">ラグ軽減 (GPUレンダリング最適化)</label>
        </div>

        <button class="apply-btn" onclick="applySettings()">設定を反映 ＆ 受信確認テスト</button>
    </div>

    <div class="panel">
        <label>通信ステータス (過疎テスト / 逆引きPing)</label>
        <div id="log-terminal"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const db = getDatabase(initializeApp({ apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc", authDomain: "gift-list-app-53ef2.firebaseapp.com", projectId: "gift-list-app-53ef2", storageBucket: "gift-list-app-53ef2.firebasestorage.app", messagingSenderId: "161949465085", appId: "1:161949465085:web:3574bdee443e4fcec70194", measurementId: "G-B3PJELG3Q9" }));
        const logTerminal = document.getElementById('log-terminal');
        let requestTime = 0;

        function addLog(msg, type = "log-info") {
            const time = new Date().toLocaleTimeString('ja-JP', { hour12: false, minute:'2-digit', second:'2-digit' });
            logTerminal.innerHTML += `<span class="${type}">[${time}] ${msg}</span><br>`;
            logTerminal.scrollTop = logTerminal.scrollHeight;
        }

        window.updateDisplay = () => {
            document.getElementById('columns-val').innerText = "セット予定: " + document.getElementById('columns').value + "列ループ";
            document.getElementById('width-val').innerText = "セット予定値: " + document.getElementById('windowWidth').value + "px";
            document.getElementById('height-val').innerText = "セット予定値: " + document.getElementById('windowHeight').value + "px";
            document.getElementById('scale-val').innerText = "セット予定値: " + document.getElementById('displayScale').value + "x";
            document.getElementById('refresh-val').innerText = "セット予定値: " + document.getElementById('refreshSec').value + "秒";
        };

        window.applySettings = () => {
            const columns = parseInt(document.getElementById('columns').value);
            const windowWidth = parseInt(document.getElementById('windowWidth').value);
            const windowHeight = parseInt(document.getElementById('windowHeight').value);
            const displayScale = parseFloat(document.getElementById('displayScale').value);
            const speed = parseFloat(document.getElementById('speed').value);
            const optimize = document.getElementById('optimize').checked;
            const refreshSec = parseInt(document.getElementById('refreshSec').value);
            const refreshMs = refreshSec * 1000;
            
            requestTime = Date.now();
            
            addLog(`🔄 【過疎テスト】設定の送信に成功しました。（画面:${windowWidth}x${windowHeight}, ${columns}列）Ping待機...`, "log-wait");

            set(ref(db, 'settings2'), {
                columns: columns,
                windowWidth: windowWidth,
                windowHeight: windowHeight,
                displayScale: displayScale,
                speed: speed,
                optimize: optimize,
                refreshMs: refreshMs,
                pingRequest: requestTime
            });
        };

        onValue(ref(db, 'pingResponse2'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.time === requestTime) {
                const latency = Date.now() - data.time;
                addLog(`✅ 【逆引きPing】受信成功: 応答速度 ${latency}ms`, "log-success");
            }
        });
        updateDisplay();
    </script>
</body>
</html>
