<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #1a1a1a; color: #eee; padding: 15px; font-family: monospace; }
        .panel { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="range"] { width: 100%; margin-bottom: 10px; }
        .value-display { font-size: 1.2rem; color: #0f0; margin-bottom: 20px; text-align: right; display: block; }
        .apply-btn { width: 100%; padding: 15px; background: #e67e22; color: white; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
        #log-terminal { background: #000; color: #0f0; padding: 10px; height: 180px; overflow-y: auto; font-size: 0.85rem; border: 1px solid #444; }
        .log-success { color: #00ff00; } .log-wait { color: #aaaaaa; }
    </style>
</head>
<body>
    <div class="panel">
        <label>画面B スクロール速度</label>
        <input type="range" id="speed" min="-5" max="5" step="0.1" value="1" oninput="updateDisplay()">
        <span class="value-display" id="speed-val">現在の設定値: 1.0</span>
        
        <label style="color: #00bfff;">画面B アイコンサイズ</label>
        <input type="range" id="size" min="0.1" max="1.5" step="0.05" value="0.3" oninput="updateDisplay()">
        <span class="value-display" id="size-val" style="color: #00bfff;">現在の設定値: 0.3x</span>

        <button class="apply-btn" onclick="applySettings()">設定を反映(画面B)</button>
    </div>
    <div class="panel"><div id="log-terminal"></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = { apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc", authDomain: "gift-list-app-53ef2.firebaseapp.com", projectId: "gift-list-app-53ef2", storageBucket: "gift-list-app-53ef2.firebasestorage.app", messagingSenderId: "161949465085", appId: "1:161949465085:web:3574bdee443e4fcec70194", measurementId: "G-B3PJELG3Q9" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        window.updateDisplay = () => {
            document.getElementById('speed-val').innerText = "現在の設定値: " + document.getElementById('speed').value;
            document.getElementById('size-val').innerText = "現在の設定値: " + document.getElementById('size').value + "x";
        };

        window.applySettings = () => {
            // ★ここが重要：settings2 に送ることで、別の画面を動かします
            set(ref(db, 'settings2'), {
                speed: parseFloat(document.getElementById('speed').value),
                size: parseFloat(document.getElementById('size').value),
                pingRequest: Date.now()
            });
            document.getElementById('log-terminal').innerHTML += `<span class="log-wait">[送信中] 設定を更新しました</span><br>`;
        };

        onValue(ref(db, 'pingResponse2'), (snapshot) => {
            if (snapshot.exists()) {
                document.getElementById('log-terminal').innerHTML += `<span class="log-success">[OK] 画面Bと同期完了</span><br>`;
            }
        });
        updateDisplay();
    </script>
</body>
</html>
