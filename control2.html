<script type="module">
    // ... 前半の定数定義などは同じ ...
    window.applySettings = () => {
        const speed = parseFloat(document.getElementById('speed').value);
        const size = parseFloat(document.getElementById('size').value);
        const optimize = document.getElementById('optimize').checked;
        const crop = parseInt(document.getElementById('crop').value);
        requestTime = Date.now();
        
        addLog(`🔄 送信: 速度[${speed}], サイズ[${size}], 切取[${crop}%]`, "log-wait");

        // ★重要：ここを 'settings2' に変更
        set(ref(db, 'settings2'), {
            speed: speed,
            size: size,
            optimize: optimize,
            crop: crop,
            pingRequest: requestTime
        });
    };

    // ★重要：ここを 'pingResponse2' に変更
    onValue(ref(db, 'pingResponse2'), (snapshot) => {
        const data = snapshot.val();
        if (data && data.time === requestTime) {
            addLog(`✅ 通信成功: 応答確認`, "log-success");
            addLog(`🌐 画面Bと同期完了`, "log-success");
        }
    });
    updateDisplay();
</script>
