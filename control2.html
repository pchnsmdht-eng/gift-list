<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #1a1a1a; color: #eee; padding: 15px; font-family: monospace; }
        .panel { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .apply-btn { width: 100%; padding: 15px; background: #e67e22; color: white; font-weight: bold; border: none; border-radius: 5px; }
        #log-terminal { background: #000; color: #0f0; padding: 10px; height: 180px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="panel">
        <label>速度・サイズ調整</label>
        <input type="range" id="speed" min="-10" max="10" value="2">
        <input type="range" id="size" min="0.1" max="1.5" step="0.1" value="1.0">
        <button class="apply-btn" onclick="applySettings()">設定を反映(Group2)</button>
    </div>
    <div id="log-terminal"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const app = initializeApp({ apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc", authDomain: "gift-list-app-53ef2.firebaseapp.com", projectId: "gift-list-app-53ef2", storageBucket: "gift-list-app-53ef2.firebasestorage.app", messagingSenderId: "161949465085", appId: "1:161949465085:web:3574bdee443e4fcec70194", measurementId: "G-B3PJELG3Q9" });
        const db = getDatabase(app);
        
        window.applySettings = () => {
            const time = Date.now();
            // ★注目：settings2 を操作する
            set(ref(db, 'settings2'), { speed: parseFloat(document.getElementById('speed').value), scale: parseFloat(document.getElementById('size').value), pingRequest: time });
        };
        
        // ★注目：pingResponse2 を監視
        onValue(ref(db, 'pingResponse2'), (snapshot) => {
            document.getElementById('log-terminal').innerHTML += "✅ 成功: 画面Bと同期<br>";
        });
    </script>
</body>
</html>
