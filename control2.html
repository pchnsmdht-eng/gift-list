<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #1a1a1a; color: #eee; padding: 15px; font-family: monospace; }
        .panel { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        .desc { font-size: 0.85rem; color: #ccc; margin-bottom: 8px; }
        input[type="range"] { width: 100%; margin-bottom: 5px; }
        .value-display { font-size: 1.2rem; color: #0f0; margin-bottom: 20px; text-align: right; display: block; }
        .checkbox-group { display: flex; align-items: center; margin-bottom: 20px; }
        .checkbox-group input { margin-right: 10px; width: 20px; height: 20px; }
        .apply-btn { width: 100%; padding: 15px; background: #007bff; color: white; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
        .apply-btn:active { background: #0056b3; transform: translateY(2px); }
        #log-terminal { background: #000; color: #0f0; padding: 10px; height: 180px; overflow-y: auto; font-size: 0.85rem; border: 1px solid #444; line-height: 1.5; }
        .log-success { color: #00ff00; } .log-wait { color: #aaaaaa; } .log-info { color: #00bfff; }
        .cloud-box { background: #333; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #00ffaa; }
    </style>
</head>
<body>
    <div class="panel">
        <label style="color: #ffffff;">① ブラウザ仮想ズーム (アイコンの大きさ: 0.2x ~ 3.0x)</label>
        <div class="desc">※ブラウザの縮尺と同じです。アイコン自体の大きさが変わります。</div>
        <input type="range" id="vZoom" min="0.2" max="3.0" step="0.1" value="1.0" oninput="updateDisplay()">
        <span class="value-display" id="zoom-val">セット予定値: 1.0x</span>

        <label style="color: #ffff00;">② 内部の横幅 (段数・折り返しの調整: 400px ~ 4000px)</label>
        <div class="desc">※ここを狭めるとアイコンが押し出され、3段、4段と折り返して増えます。</div>
        <input type="range" id="iframeWidth" min="400" max="4000" step="10" value="1200" oninput="updateDisplay()">
        <span class="value-display" id="iwidth-val">セット予定値: 1200px</span>

        <label style="color: #ff3366;">③ 切り取り横幅 (ループの隙間カット: 100px ~ 4000px)</label>
        <div class="desc">※②で段数を作ったあとに右側に余る「黒い余白」をカットし、次のブロックをぴったり繋げます。</div>
        <input type="range" id="cropWidth" min="100" max="4000" step="10" value="800" oninput="updateDisplay()">
        <span class="value-display" id="cwidth-val">セット予定値: 800px</span>

        <label style="color: #ffaa00;">④ 切り取り縦幅 (下部の余白カット: 100px ~ 2000px)</label>
        <input type="range" id="cropHeight" min="100" max="2000" step="10" value="600" oninput="updateDisplay()">
        <span class="value-display" id="cheight-val">セット予定値: 600px</span>

        <label style="color: #00bfff;">⑤ 全体の配置サイズ (配信画面での縮小: 0.1x ~ 2.0x)</label>
        <div class="desc">※完成した塊をOBS上で縮小します。(永遠にループするよう裏で8個並べます)</div>
        <input type="range" id="displayScale" min="0.1" max="2.0" step="0.05" value="0.5" oninput="updateDisplay()">
        <span class="value-display" id="scale-val">セット予定値: 0.5x</span>

        <label>⑥ スクロール速度・方向 (-10 左 ~ +10 右)</label>
        <input type="range" id="speed" min="-10" max="10" step="0.1" value="1" oninput="updateDisplay()">
        <span class="value-display" id="speed-val">セット予定値: 1</span>

        <label style="color: #ff00ff;">⑦ 自動更新間隔 (秒)</label>
        <input type="range" id="refreshSec" min="10" max="300" step="10" value="60" oninput="updateDisplay()">
        <span class="value-display" id="refresh-val">セット予定値: 60秒</span>

        <div class="checkbox-group">
            <input type="checkbox" id="optimize" checked>
            <label for="optimize" style="margin:0;">ラグ軽減 (GPUレンダリング最適化)</label>
        </div>

        <div class="checkbox-group cloud-box">
            <input type="checkbox" id="cloudSync" checked>
            <label for="cloudSync" style="margin:0; color: #00ffaa; font-weight: bold;">☁️ 数値をクラウドに記憶し、全てのブラウザで復元する</label>
        </div>

        <button class="apply-btn" onclick="applySettings()">設定を反映 ＆ 記憶を更新</button>
    </div>
    
    <div class="panel">
        <label>通信ステータス (クラウド同期状況 / 逆引きPing)</label>
        <div id="log-terminal"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        const db = getDatabase(initializeApp({ apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc", authDomain: "gift-list-app-53ef2.firebaseapp.com", projectId: "gift-list-app-53ef2", storageBucket: "gift-list-app-53ef2.firebasestorage.app", messagingSenderId: "161949465085", appId: "1:161949465085:web:3574bdee443e4fcec70194", measurementId: "G-B3PJELG3Q9" }));
        const logTerminal = document.getElementById('log-terminal');
        let requestTime = 0;

        function addLog(msg, type = "log-info") {
            const time = new Date().toLocaleTimeString('ja-JP', { hour12: false, minute:'2-digit', second:'2-digit' });
            logTerminal.innerHTML += `<span class="${type}">[${time}] ${msg}</span><br>`;
            logTerminal.scrollTop = logTerminal.scrollHeight;
        }

        window.updateDisplay = () => {
            document.getElementById('zoom-val').innerText = "セット予定値: " + document.getElementById('vZoom').value + "x";
            document.getElementById('iwidth-val').innerText = "セット予定値: " + document.getElementById('iframeWidth').value + "px";
            document.getElementById('cwidth-val').innerText = "セット予定値: " + document.getElementById('cropWidth').value + "px";
            document.getElementById('cheight-val').innerText = "セット予定値: " + document.getElementById('cropHeight').value + "px";
            document.getElementById('scale-val').innerText = "セット予定値: " + document.getElementById('displayScale').value + "x";
            document.getElementById('speed-val').innerText = "セット予定値: " + document.getElementById('speed').value;
            document.getElementById('refresh-val').innerText = "セット予定値: " + document.getElementById('refreshSec').value + "秒";
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedCheck = localStorage.getItem('cloudSync_control2');
            if (savedCheck !== null) {
                document.getElementById('cloudSync').checked = (savedCheck === 'true');
            }

            if (document.getElementById('cloudSync').checked) {
                addLog(`☁️ クラウドから前回の設定を読み込んでいます...`, "log-wait");
                get(ref(db, 'settings2')).then((snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        if(data.vZoom !== undefined) document.getElementById('vZoom').value = data.vZoom;
                        if(data.iframeWidth !== undefined) document.getElementById('iframeWidth').value = data.iframeWidth;
                        if(data.cropWidth !== undefined) document.getElementById('cropWidth').value = data.cropWidth;
                        if(data.cropHeight !== undefined) document.getElementById('cropHeight').value = data.cropHeight;
                        if(data.displayScale !== undefined) document.getElementById('displayScale').value = data.displayScale;
                        if(data.speed !== undefined) document.getElementById('speed').value = data.speed;
                        if(data.refreshMs !== undefined) document.getElementById('refreshSec').value = data.refreshMs / 1000;
                        if(data.optimize !== undefined) document.getElementById('optimize').checked = data.optimize;
                        
                        updateDisplay();
                        addLog(`✅ 【復元完了】他のブラウザで記憶された数値をスライダーにセットしました。`, "log-success");
                    } else {
                        updateDisplay();
                    }
                }).catch(() => {
                    updateDisplay();
                    addLog(`❌ クラウドの読み込みに失敗しました。`, "log-wait");
                });
            } else {
                updateDisplay();
            }
        });

        window.applySettings = () => {
            requestTime = Date.now();
            const isSync = document.getElementById('cloudSync').checked;
            localStorage.setItem('cloudSync_control2', isSync);

            addLog(`🔄 【送信完了】設定を反映しています。Ping待機...`, "log-wait");
            set(ref(db, 'settings2'), {
                vZoom: parseFloat(document.getElementById('vZoom').value),
                iframeWidth: parseInt(document.getElementById('iframeWidth').value),
                cropWidth: parseInt(document.getElementById('cropWidth').value),
                cropHeight: parseInt(document.getElementById('cropHeight').value),
                displayScale: parseFloat(document.getElementById('displayScale').value),
                speed: parseFloat(document.getElementById('speed').value),
                optimize: document.getElementById('optimize').checked,
                refreshMs: parseInt(document.getElementById('refreshSec').value) * 1000,
                pingRequest: requestTime
            });
            
            if(isSync) {
                addLog(`☁️ 【記憶更新】現在の数値をクラウドに記憶しました。次回開いた際に復元されます。`, "log-success");
            }
        };

        onValue(ref(db, 'pingResponse2'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.time === requestTime) {
                addLog(`✅ 【逆引きPing】受信成功: 応答速度 ${Date.now() - data.time}ms`, "log-success");
            }
        });
    </script>
</body>
</html>
