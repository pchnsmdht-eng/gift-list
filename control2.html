<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #1a1a1a; color: #eee; padding: 15px; font-family: monospace; }
        .panel { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        input[type="range"] { width: 100%; margin-bottom: 10px; }
        .value-display { font-size: 1.2rem; color: #0f0; margin-bottom: 20px; text-align: right; display: block; }
        .apply-btn { width: 100%; padding: 15px; background: #007bff; color: white; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
        #log-terminal { background: #000; color: #0f0; padding: 10px; height: 180px; overflow-y: auto; font-size: 0.85rem; border: 1px solid #444; line-height: 1.5; }
        .log-success { color: #00ff00; } .log-wait { color: #aaaaaa; }
    </style>
</head>
<body>
    <div class="panel">
        <label>スクロール速度 (-10 ～ +10)</label>
        <input type="range" id="speed" min="-10" max="10" step="0.1" value="1" oninput="updateDisplay()">
        <span class="value-display" id="speed-val">現在の設定値: 1</span>
        
        <label>アイコンサイズ (0.1 ～ 1.5)</label>
        <input type="range" id="size" min="0.1" max="1.5" step="0.05" value="0.3" oninput="updateDisplay()">
        <span class="value-display" id="size-val">現在の設定値: 0.3x</span>

        <label>表示範囲 (10% ～ 100%)</label>
        <input type="range" id="crop" min="10" max="100" value="100" oninput="updateDisplay()">
        <span class="value-display" id="crop-val">現在の設定値: 100%</span>

        <button class="apply-btn" onclick="applySettings()">設定を反映 ＆ 速度テスト</button>
    </div>
    <div class="panel"><div id="log-terminal"></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const db = getDatabase(initializeApp({ apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc", authDomain: "gift-list-app-53ef2.firebaseapp.com", projectId: "gift-list-app-53ef2", storageBucket: "gift-list-app-53ef2.firebasestorage.app", messagingSenderId: "161949465085", appId: "1:161949465085:web:3574bdee443e4fcec70194", measurementId: "G-B3PJELG3Q9" }));
        const logTerminal = document.getElementById('log-terminal');
        let requestTime = 0;

        window.updateDisplay = () => {
            document.getElementById('speed-val').innerText = "現在の設定値: " + document.getElementById('speed').value;
            document.getElementById('size-val').innerText = "現在の設定値: " + document.getElementById('size').value + "x";
            document.getElementById('crop-val').innerText = "現在の設定値: " + document.getElementById('crop').value + "%";
        };

        window.applySettings = () => {
            requestTime = Date.now();
            set(ref(db, 'settings2'), {
                speed: parseFloat(document.getElementById('speed').value),
                size: parseFloat(document.getElementById('size').value),
                crop: parseInt(document.getElementById('crop').value),
                pingRequest: requestTime
            });
            logTerminal.innerHTML += `[送信] 計測開始...<br>`;
        };

        onValue(ref(db, 'pingResponse2'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.time === requestTime) {
                // ここでレイテンシを計算して表示
                const latency = Date.now() - data.time;
                logTerminal.innerHTML += `<span class="log-success">[OK] 通信成功: レイテンシ ${latency}ms</span><br>`;
                logTerminal.scrollTop = logTerminal.scrollHeight;
            }
        });
        updateDisplay();
    </script>
</body>
</html>
