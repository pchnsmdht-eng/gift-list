<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    :root { 
        --win-width: 400px; 
        --win-height: 300px; 
        --iframe-css-width: 400px; 
        --v-zoom: 1.0; 
        --display-scale: 1.0; 
    }
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    
    #master-container {
        position: absolute; top: 20px; left: 20px;
        transform: scale(var(--display-scale));
        transform-origin: top left;
    }

    /* 窓枠：この枠からはみ出た部分（次のページ）は隠されます */
    .crop-window {
        width: var(--win-width); height: var(--win-height);
        overflow: hidden; position: relative;
        border-radius: 8px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    /* カメラレイヤー：これごと上下に移動させてページをめくります */
    .camera-layer {
        position: absolute; top: 0; left: 0;
        width: 100%; opacity: 0; /* 最初は見えない状態 */
    }

    /* ★ ズームしても絶対に枠に合わせて「折り返し」を発生させるための魔法の横幅設定 */
    iframe {
        position: absolute; top: 0; left: 0;
        width: var(--iframe-css-width); 
        height: 8000px; /* はみ出たギフトを下へ下へストックしておくための巨大な縦幅 */
        border: none; pointer-events: none; 
        zoom: var(--v-zoom);
        transform-origin: top left;
    }

    /* ロードゲージ */
    #loading-panel { position: fixed; top: 20px; left: 20px; width: 350px; height: 40px; background: rgba(0, 0, 0, 0.8); border: 2px solid #00ffaa; border-radius: 8px; z-index: 99999; display: none; overflow: hidden; box-shadow: 0 0 15px rgba(0, 255, 170, 0.5); }
    #loading-bg { position: absolute; top: 0; left: 0; width: 0%; height: 100%; background: linear-gradient(90deg, #007744, #00ffaa); transition: width 0.3s ease-out; z-index: 1; }
    #loading-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; color: #ffffff; font-family: sans-serif; font-size: 16px; font-weight: bold; line-height: 40px; text-align: center; text-shadow: 1px 1px 3px #000; z-index: 2; }
</style>
</head>
<body>
    <div id="loading-panel"><div id="loading-bg"></div><div id="loading-text">🔄 データ受信中...</div></div>
    
    <div id="master-container">
        <div class="crop-window">
            <div id="camera-layer1" class="camera-layer"><iframe src=""></iframe></div>
            <div id="camera-layer2" class="camera-layer"><iframe src=""></iframe></div>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        const app = initializeApp({ apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc", authDomain: "gift-list-app-53ef2.firebaseapp.com", projectId: "gift-list-app-53ef2", storageBucket: "gift-list-app-53ef2.firebasestorage.app", messagingSenderId: "161949465085", appId: "1:161949465085:web:3574bdee443e4fcec70194", measurementId: "G-B3PJELG3Q9" });
        const db = getDatabase(app);
        
        const loadingPanel = document.getElementById('loading-panel');
        const loadingBg = document.getElementById('loading-bg');
        const loadingText = document.getElementById('loading-text');
        
        let currentLayerIdx = 1; 
        let reloadTimer;
        let pageIndex = 0; 
        let isFirstLoad = true;
        
        const baseUrl = "https://app.streamtoearn.io/overlay/69a6f7873d008188b04a16b9";

        onValue(ref(db, 'settings3'), (snapshot) => {
            const data = snapshot.val() || {};
            
            const winWidth = data.winWidth || 400;
            const winHeight = data.winHeight || 300;
            const vZoom = data.vZoom || 1.0;
            const maxPages = data.maxPages || 5; 
            
            // ズームの影響を打ち消して、窓枠ピッタリで「折り返し」させる計算式
            const iframeCSSWidth = winWidth / vZoom;
            
            document.documentElement.style.setProperty('--v-zoom', vZoom);
            document.documentElement.style.setProperty('--win-width', `${winWidth}px`);
            document.documentElement.style.setProperty('--win-height', `${winHeight}px`);
            document.documentElement.style.setProperty('--iframe-css-width', `${iframeCSSWidth}px`);
            document.documentElement.style.setProperty('--display-scale', data.displayScale || 1.0);

            // 初回ロード時の処理（画面が真っ暗になるのを防ぐ）
            if (isFirstLoad) {
                isFirstLoad = false;
                const activeLayer = document.getElementById('camera-layer1');
                const iframe = activeLayer.querySelector('iframe');
                
                loadingPanel.style.display = 'block';
                loadingBg.style.width = '30%';
                
                iframe.onload = () => {
                    loadingBg.style.width = '100%';
                    setTimeout(() => {
                        loadingPanel.style.display = 'none';
                        // 初回バウンド表示
                        activeLayer.style.transition = 'opacity 0.6s ease-out, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                        activeLayer.style.opacity = '1';
                        activeLayer.style.transform = 'translateY(0px) scale(1)';
                    }, 300);
                };
                iframe.src = `${baseUrl}?t=${Date.now()}`;
            }

            if(data.refreshMs) {
                if(reloadTimer) clearInterval(reloadTimer);
                
                const triggerUpdate = () => {
                    pageIndex++;
                    if (pageIndex >= maxPages) {
                        pageIndex = 0; // 指定ページ数まで進んだら最初に戻る
                    }

                    const activeLayer = document.getElementById(`camera-layer${currentLayerIdx}`);
                    const oldY = (pageIndex === 0 ? maxPages - 1 : pageIndex - 1) * winHeight;

                    // 1. まず現在のページをフワッと消して、少し小さくする
                    activeLayer.style.transition = 'opacity 0.4s ease-out, transform 0.4s ease-out';
                    activeLayer.style.opacity = '0';
                    activeLayer.style.transform = `translateY(-${oldY}px) scale(0.9)`;

                    // 完全に消えるまで0.4秒待つ
                    setTimeout(() => {
                        
                        if (pageIndex === 0) {
                            // 【最初のページに戻る時】裏側のカメラに最新データを読み込ませる
                            const nextLayerIdx = currentLayerIdx === 1 ? 2 : 1;
                            const nextLayer = document.getElementById(`camera-layer${nextLayerIdx}`);
                            const nextIframe = nextLayer.querySelector('iframe');

                            loadingPanel.style.display = 'block';
                            loadingBg.style.transition = 'width 0.3s ease-out';
                            loadingBg.style.width = '30%'; 
                            loadingText.innerText = '🔄 最新データを受信中...';

                            nextIframe.onload = () => {
                                loadingBg.style.width = '100%';
                                loadingText.innerText = '✨ ページを更新します';

                                setTimeout(() => {
                                    // 見えない状態で一番上（0px）にカメラをセット
                                    nextLayer.style.transition = 'none';
                                    nextLayer.style.transform = `translateY(0px) scale(0.85)`;
                                    void nextLayer.offsetWidth; // 瞬時に適用させる魔法

                                    // ポンッ！とバウンドしながら表示
                                    nextLayer.style.transition = 'opacity 0.6s ease-out, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                                    nextLayer.style.opacity = '1';
                                    nextLayer.style.transform = `translateY(0px) scale(1)`;

                                    currentLayerIdx = nextLayerIdx;
                                    loadingPanel.style.display = 'none';
                                    loadingBg.style.width = '0%';
                                }, 300); 
                            };
                            nextIframe.src = `${baseUrl}?t=${Date.now()}`;
                            
                        } else {
                            // 【次のページに進む時】
                            const newY = pageIndex * winHeight;

                            // 見えない状態でカメラを「次のページの高さ」へ一気に下げる
                            activeLayer.style.transition = 'none';
                            activeLayer.style.transform = `translateY(-${newY}px) scale(0.85)`;
                            void activeLayer.offsetWidth; // 瞬時に適用させる魔法

                            // 次のページがポンッ！とバウンドしながら表示される
                            activeLayer.style.transition = 'opacity 0.6s ease-out, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                            activeLayer.style.opacity = '1';
                            activeLayer.style.transform = `translateY(-${newY}px) scale(1)`;
                        }

                    }, 400); // 消えるまでの待機時間
                };

                // 設定秒数ごとにめくりアニメーションを実行
                reloadTimer = setInterval(triggerUpdate, data.refreshMs);
            }
            
            if (data.pingRequest) set(ref(db, 'pingResponse3'), { time: data.pingRequest, status: "OK" });
        });
    </script>
</body>
</html>
