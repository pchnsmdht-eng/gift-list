<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    :root { --win-width: 400px; --win-height: 300px; --v-zoom: 1.0; --display-scale: 1.0; }
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    
    #master-container {
        position: absolute; top: 20px; left: 20px;
        transform: scale(var(--display-scale));
        transform-origin: top left;
    }

    /* 設定した幅で切り抜く窓枠（カメラのレンズ） */
    .crop-window {
        width: var(--win-width); height: var(--win-height);
        overflow: hidden; position: relative;
        border-radius: 8px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        background: rgba(0,0,0,0.1);
    }

    /* フェードイン＆バウンドアニメーション */
    @keyframes bounceFadeIn {
        0%   { opacity: 0; transform: scale(0.85) translateY(20px); }
        60%  { opacity: 1; transform: scale(1.03) translateY(-5px); }
        80%  { transform: scale(0.98) translateY(2px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .gift-layer {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        opacity: 0; pointer-events: none;
    }

    .visible-bounce {
        opacity: 1; z-index: 2;
        animation: bounceFadeIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    .hidden-fade {
        opacity: 0; z-index: 1;
        transition: opacity 0.4s ease-out;
    }

    /* ★ iframeの高さを超巨大に保ち、下の方までデータを表示させます */
    iframe {
        position: absolute; top: 0; left: 0;
        width: 2000px; height: 8000px;
        border: none; pointer-events: none; zoom: var(--v-zoom);
        transform-origin: top left;
    }

    /* ロードゲージ */
    #loading-panel { position: fixed; top: 20px; left: 20px; width: 350px; height: 40px; background: rgba(0, 0, 0, 0.8); border: 2px solid #00ffaa; border-radius: 8px; z-index: 99999; display: none; overflow: hidden; box-shadow: 0 0 15px rgba(0, 255, 170, 0.5); }
    #loading-bg { position: absolute; top: 0; left: 0; width: 0%; height: 100%; background: linear-gradient(90deg, #007744, #00ffaa); transition: width 0.3s ease-out; z-index: 1; }
    #loading-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; color: #ffffff; font-family: sans-serif; font-size: 16px; font-weight: bold; line-height: 40px; text-align: center; text-shadow: 1px 1px 3px #000; z-index: 2; }
</style>
</head>
<body>
    <div id="loading-panel"><div id="loading-bg"></div><div id="loading-text">🔄 データ受信中...</div></div>
    
    <div id="master-container">
        <div class="crop-window">
            <div id="layer1" class="gift-layer visible-bounce"><iframe src="https://app.streamtoearn.io/overlay/69a6f7873d008188b04a16b9"></iframe></div>
            <div id="layer2" class="gift-layer hidden-fade"><iframe src=""></iframe></div>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        const app = initializeApp({ apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc", authDomain: "gift-list-app-53ef2.firebaseapp.com", projectId: "gift-list-app-53ef2", storageBucket: "gift-list-app-53ef2.firebasestorage.app", messagingSenderId: "161949465085", appId: "1:161949465085:web:3574bdee443e4fcec70194", measurementId: "G-B3PJELG3Q9" });
        const db = getDatabase(app);
        
        const loadingPanel = document.getElementById('loading-panel');
        const loadingBg = document.getElementById('loading-bg');
        const loadingText = document.getElementById('loading-text');
        
        const layer1 = document.getElementById('layer1');
        const layer2 = document.getElementById('layer2');
        let currentLayer = 1; 
        
        let reloadTimer;
        let pageIndex = 0; // 現在何ページ目を表示しているか
        const baseUrl = "https://app.streamtoearn.io/overlay/69a6f7873d008188b04a16b9";

        onValue(ref(db, 'settings3'), (snapshot) => {
            const data = snapshot.val() || {};
            const winHeight = data.winHeight || 300;
            const maxPages = data.maxPages || 5; // 下へ進む最大ページ数
            
            document.documentElement.style.setProperty('--v-zoom', data.vZoom || 1.0);
            document.documentElement.style.setProperty('--win-width', `${data.winWidth || 400}px`);
            document.documentElement.style.setProperty('--win-height', `${winHeight}px`);
            document.documentElement.style.setProperty('--display-scale', data.displayScale || 1.0);

            if(data.refreshMs) {
                if(reloadTimer) clearInterval(reloadTimer);
                
                const triggerUpdate = () => {
                    pageIndex++;
                    
                    // 最後のページまでめくったら、最初（0）に戻して新しいデータを通信する
                    if (pageIndex >= maxPages) {
                        pageIndex = 0;
                    }

                    const activeLayer = currentLayer === 1 ? layer1 : layer2;
                    const nextLayer = currentLayer === 1 ? layer2 : layer1;
                    const activeIframe = activeLayer.querySelector('iframe');
                    const nextIframe = nextLayer.querySelector('iframe');

                    // 1. まず現在のページをフワッと消す
                    activeLayer.className = 'gift-layer hidden-fade';

                    // 完全に消えるまで0.4秒待ってから次を表示する
                    setTimeout(() => {
                        
                        if (pageIndex === 0) {
                            // 【最初のページに戻る時】裏で最新データを取得する
                            loadingPanel.style.display = 'block';
                            loadingBg.style.transition = 'width 0.3s ease-out';
                            loadingBg.style.width = '30%'; 
                            loadingText.innerText = '🔄 最新データを受信中...';

                            nextIframe.onload = () => {
                                loadingBg.style.width = '100%';
                                loadingText.innerText = '✨ ページを更新します';

                                setTimeout(() => {
                                    // カメラを一番上（0px）に戻す
                                    nextIframe.style.top = '0px';
                                    
                                    nextLayer.className = 'gift-layer';
                                    void nextLayer.offsetWidth; // おまじない
                                    nextLayer.className = 'gift-layer visible-bounce'; // バウンドして表示
                                    
                                    currentLayer = currentLayer === 1 ? 2 : 1;
                                    loadingPanel.style.display = 'none';
                                    loadingBg.style.width = '0%';
                                }, 300); 
                            };
                            nextIframe.src = `${baseUrl}?t=${Date.now()}`;
                            
                        } else {
                            // 【次のページに進む時】見えなくなっている下の部分までカメラをずらす
                            
                            // ★ここが核心：現在のページ数 × 枠の縦幅分だけ、iframeを上にずらして下のギフトを表示させる！
                            activeIframe.style.top = `-${pageIndex * winHeight}px`;
                            
                            activeLayer.className = 'gift-layer';
                            void activeLayer.offsetWidth; // おまじない
                            activeLayer.className = 'gift-layer visible-bounce'; // バウンドして表示
                        }

                    }, 400);
                };

                // 初回読み込み後は設定秒数ごとにバウンド＆めくりを実行
                reloadTimer = setInterval(triggerUpdate, data.refreshMs);
            }
            
            if (data.pingRequest) set(ref(db, 'pingResponse3'), { time: data.pingRequest, status: "OK" });
        });
    </script>
</body>
</html>
