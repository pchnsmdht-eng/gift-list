<!DOCTYPE html>
<html>
<body>
    <h3>高速利確バランサー</h3>
    <input type="range" id="balancer" min="0" max="100" value="50" onchange="update()">
    <span id="val">50</span>
    <script>
        async function update() {
            let val = document.getElementById('balancer').value;
            document.getElementById('val').innerText = val;
            await fetch('http://220.158.26.183:8000/update_config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ "利確スピードバランサー": val })
            });
        }
    </script>
</body>
</html>
