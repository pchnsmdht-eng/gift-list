<script>
    const API_URL = "http://220.158.26.183:8000/get_dashboard_data";
    
    async function updateUI() {
        try {
            // キャッシュを防ぐためにタイムスタンプを付与
            const response = await fetch(API_URL + "?t=" + Date.now());
            if (!response.ok) throw new Error("HTTP error " + response.status);
            const d = await response.json();
            
            document.getElementById('bid').innerText = d.market.bid;
            document.getElementById('ask').innerText = d.market.ask;
            document.getElementById('trend').innerText = d.market.trend;
            document.getElementById('margin').innerText = d.risk.margin_rate;
            document.getElementById('bullets').innerText = d.risk.available_bullets;
            document.getElementById('judgment').innerText = d.ai_status.decision;
            document.getElementById('reason').innerText = d.ai_status.reason;
        } catch(e) {
            console.error("更新エラー:", e);
            document.getElementById('status').innerText = "接続エラー";
        }
    }
    setInterval(updateUI, 1000);
    updateUI();
</script>
