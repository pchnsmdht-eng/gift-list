<!DOCTYPE html>
<html>
<body style="background:#000; color:#fff; font-family:monospace;">
    <div style="padding:20px; border:2px solid #f00;">
        <button onclick="stopSystem()" style="width:100%; height:80px; font-size:24px; background:#d00; color:#fff; font-weight:bold;">🚨 全システム緊急停止</button>
    </div>
    <div style="margin-top:20px;">
        <h3>システムログ（最新30行）</h3>
        <pre id="log_area" style="color:#0f0; background:#111; padding:10px; height:400px; overflow-y:scroll;"></pre>
    </div>

    <script>
        async function stopSystem() {
            if(!confirm("本当に全システムを停止しますか？")) return;
            const res = await fetch("/emergency_stop", {method: "POST"});
            alert((await res.json()).message);
        }
        async function loadLogs() {
            const res = await fetch("/get_logs");
            const d = await res.json();
            document.getElementById("log_area").innerText = d.logs.join("");
        }
        setInterval(loadLogs, 1000); // 1秒ごとにログ更新
    </script>
</body>
</html>
