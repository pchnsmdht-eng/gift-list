<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMO FX WaveRider リモコン</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 20px; }
        h1 { color: #89b4fa; text-align: center; border-bottom: 2px solid #313244; padding-bottom: 10px; }
        .container { max-width: 800px; margin: 0 auto; background: #181825; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .dashboard { display: flex; justify-content: space-between; background: #313244; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
        .price-box { font-size: 1.2em; }
        .ask { color: #f38ba8; } /* 赤系 */
        .bid { color: #a6e3a1; } /* 緑系 */
        .status-box { text-align: right; }
        .latency { color: #f9e2af; }
        textarea { width: 100%; height: 400px; background: #11111b; color: #a6adc8; border: 1px solid #45475a; padding: 10px; font-family: monospace; border-radius: 5px; box-sizing: border-box; resize: vertical; }
        button { background: #89b4fa; color: #11111b; border: none; padding: 12px 24px; font-size: 1.1em; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 15px; transition: 0.3s; }
        button:hover { background: #b4befe; }
        button:disabled { background: #585b70; cursor: not-allowed; color: #a6adc8; }
        .alert-box { background: #f38ba8; color: #11111b; padding: 10px; border-radius: 5px; font-weight: bold; margin-top: 15px; display: none; text-align: center; }
        .log-box { margin-top: 20px; background: #11111b; border: 1px solid #45475a; padding: 10px; height: 100px; overflow-y: scroll; font-family: monospace; font-size: 0.9em; border-radius: 5px; }
        .log-time { color: #94e2d5; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 WaveRider コントロールパネル</h1>
    
    <div class="dashboard">
        <div class="price-box">
            <span>現在レート:</span>
            <span class="bid" id="display-bid">Bid: ---</span> / 
            <span class="ask" id="display-ask">Ask: ---</span>
        </div>
        <div class="status-box">
            <span id="connection-status">🟡 接続中...</span> | 
            <span class="latency" id="display-latency">遅延: --- ms</span>
        </div>
    </div>

    <h3>⚙️ config.txt 編集エリア</h3>
    <textarea id="config-editor">データを読み込み中...</textarea>
    
    <div class="alert-box" id="error-alert">⚠️ IFD指値エラー: 現在価格の条件を満たしていません！</div>
    
    <button id="send-btn" onclick="sendConfig()">💾 サーバーへ送信して更新</button>

    <h3>📝 システムログ</h3>
    <div class="log-box" id="log-console"></div>
</div>

<script>
    // ★★★ あなたのVPSのIPアドレスを設定 ★★★
    const VPS_IP = "220.158.26.183"; 
    const API_BASE = `http://${VPS_IP}:8000`;

    let currentBid = 0.0;
    let currentAsk = 0.0;

    function addLog(msg, isError = false) {
        const logConsole = document.getElementById('log-console');
        const timeStr = new Date().toLocaleTimeString();
        const color = isError ? '#f38ba8' : '#cdd6f4';
        logConsole.innerHTML += `<div><span class="log-time">[${timeStr}]</span> <span style="color: ${color}">${msg}</span></div>`;
        logConsole.scrollTop = logConsole.scrollHeight;
    }

    // 初期データの読み込み
    async function fetchStatus() {
        try {
            const res = await fetch(`${API_BASE}/status`);
            const data = await res.json();
            if(data.status === "success") {
                document.getElementById('config-editor').value = data.config;
                document.getElementById('display-latency').innerText = `遅延: ${data.latency_ms} ms`;
                document.getElementById('connection-status').innerText = "🟢 オンライン";
                addLog("VPSからconfig.txtの読み込みに成功しました。");
            } else {
                throw new Error(data.message);
            }
        } catch (e) {
            document.getElementById('connection-status').innerText = "🔴 通信エラー";
            addLog(`読込エラー: ${e.message}`, true);
        }
    }

    // 1秒ごとに価格を取得
    setInterval(async () => {
        try {
            const res = await fetch(`${API_BASE}/price`);
            const data = await res.json();
            if(data.status === "success") {
                currentBid = data.bid;
                currentAsk = data.ask;
                document.getElementById('display-bid').innerText = `Bid: ${currentBid.toFixed(3)}`;
                document.getElementById('display-ask').innerText = `Ask: ${currentAsk.toFixed(3)}`;
                validateConfig(); // 価格が更新されたらIFDのバリデーションを実行
            }
        } catch (e) {
            document.getElementById('display-bid').innerText = "Bid: エラー";
            addLog(`価格取得エラー: ${e.message}`, true);
        }
    }, 1000);

    // IFD注文のバリデーション（エディタの内容を監視）
    document.getElementById('config-editor').addEventListener('input', validateConfig);

    function validateConfig() {
        const text = document.getElementById('config-editor').value;
        const btn = document.getElementById('send-btn');
        const alertBox = document.getElementById('error-alert');
        let hasError = false;
        let errorMsg = "";

        // 「買いたい価格X=数値」を抽出
        const buyMatches = [...text.matchAll(/買いたい価格\d+=([0-9.]+)/g)];
        for (const match of buyMatches) {
            const price = parseFloat(match[1]);
            // 価格が0でなく、現在価格(Ask)が指定価格を下回っている（または同じ）場合はエラー
            if (price > 0 && currentAsk <= price) {
                hasError = true;
                errorMsg = `買い指値エラー: 指定価格(${price})が現在のAsk(${currentAsk})を上回っています。`;
                break;
            }
        }

        // 「売りたい価格X=数値」を抽出
        if (!hasError) {
            const sellMatches = [...text.matchAll(/売りたい価格\d+=([0-9.]+)/g)];
            for (const match of sellMatches) {
                const price = parseFloat(match[1]);
                // 価格が0でなく、現在価格(Bid)が指定価格を上回っている（または同じ）場合はエラー
                if (price > 0 && currentBid >= price) {
                    hasError = true;
                    errorMsg = `売り指値エラー: 指定価格(${price})が現在のBid(${currentBid})を下回っています。`;
                    break;
                }
            }
        }

        if (hasError && currentBid > 0) { // 価格が取得できている時のみ判定
            alertBox.innerText = `⚠️ ${errorMsg}`;
            alertBox.style.display = "block";
            btn.disabled = true;
            btn.innerText = "⛔ 価格エラーのため送信ロック中";
        } else {
            alertBox.style.display = "none";
            btn.disabled = false;
            btn.innerText = "💾 サーバーへ送信して更新";
        }
    }

    // データの送信
    async function sendConfig() {
        const text = document.getElementById('config-editor').value;
        const btn = document.getElementById('send-btn');
        btn.disabled = true;
        btn.innerText = "送信中...";

        try {
            const res = await fetch(`${API_BASE}/update_config`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ config_text: text })
            });
            const data = await res.json();
            if(data.status === "success") {
                addLog("✅ config.txt の更新に成功しました。");
                // 送信成功時の視覚的フィードバック
                btn.style.background = "#a6e3a1";
                btn.innerText = "✅ 送信完了";
                setTimeout(() => {
                    btn.style.background = "#89b4fa";
                    btn.innerText = "💾 サーバーへ送信して更新";
                    btn.disabled = false;
                }, 2000);
            } else {
                throw new Error(data.message);
            }
        } catch (e) {
            addLog(`❌ 送信エラー: ${e.message}`, true);
            btn.style.background = "#f38ba8";
            btn.innerText = "❌ 送信失敗";
            setTimeout(() => {
                btn.style.background = "#89b4fa";
                btn.innerText = "💾 サーバーへ送信して更新";
                btn.disabled = false;
            }, 2000);
        }
    }

    // 起動時に初回読み込み
    window.onload = fetchStatus;
</script>

</body>
</html>
