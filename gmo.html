<div class="card">
    <h3>戦況制御スイッチ</h3>
    <button onclick="setMode('SPEED')" style="background:#f00; color:#fff;">SPEEDモード</button>
    <button onclick="setMode('ARTISAN')" style="background:#0f0; color:#000;">匠モード</button>
</div>
<div class="card">
    <button onclick="execute()" style="width:100%; height:50px; font-size:20px; background:#ff0;">【音速注文発動】</button>
</div>

<script>
    async function setMode(m) { await fetch(`/set_mode/${m}`, {method: 'POST'}); alert('モード:' + m); }
    async function execute() { if(confirm('注文を撃ちますか？')) await fetch('/execute_order', {method: 'POST'}); }
</script>
