<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GMO Trading Command Center</title>
    <style>
        body { background: #000; color: #fff; font-family: monospace; padding: 10px; }
        .card { border: 1px solid #444; padding: 10px; margin-bottom: 10px; }
        .val { color: #0f0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h3>戦況司令室</h3>
        <div>BID/ASK: <span id="bid" class="val">--</span> / <span id="ask" class="val">--</span></div>
        <div>トレンド: <span id="trend" class="val">--</span></div>
    </div>
    <div class="card">
        <h3>資金管理</h3>
        <div>維持率: <span id="margin" class="val">--</span>%</div>
        <div>残弾数: <span id="bullets" class="val">--</span></div>
    </div>
    <div class="card">
        <h3>AI判断板</h3>
        <div>判定: <span id="judgment" class="val">--</span></div>
        <div>理由: <span id="reason" class="val">--</span></div>
    </div>

    <script>
        const API_URL = "http://220.158.26.183:8000/get_dashboard_data";
        
        async function updateUI() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                const d = await response.json();
                
                // データ流し込み
                document.getElementById('bid').innerText = d.market.bid;
                document.getElementById('ask').innerText = d.market.ask;
                document.getElementById('trend').innerText = d.market.trend;
                document.getElementById('margin').innerText = d.risk.margin_rate;
                document.getElementById('bullets').innerText = d.risk.available_bullets;
                document.getElementById('judgment').innerText = d.ai_status.decision;
                document.getElementById('reason').innerText = d.ai_status.reason;
            } catch(e) {
                console.error("更新エラー:", e);
            }
        }
        // 1秒ごとに更新
        setInterval(updateUI, 1000);
        updateUI(); // 初回実行
    </script>
</body>
</html>
