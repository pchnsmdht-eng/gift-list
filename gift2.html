<!DOCTYPE html>
<html>
<head>
<style>
    body { margin: 0; background: transparent; overflow: hidden; }
    #master { will-change: transform; }
    #track { display: flex; animation: slide 10s linear infinite; will-change: transform; }
    @keyframes slide { 100% { transform: translateX(-4000px); } }
</style>
</head>
<body>
    <div id="master"><div id="track">
        <iframe src="https://app.streamtoearn.io/overlay/69a6f7873d008188b04a16b9" style="width:4000px;height:698px;border:none"></iframe>
    </div></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        const db = getDatabase(initializeApp({ /* 設定はそのまま */ }));
        const track = document.getElementById('track');

        onValue(ref(db, 'settings2'), (data) => {
            const v = data.val();
            document.getElementById('master').style.transform = `scale(${v.size})`;
            track.style.animation = `slide ${50/Math.abs(v.speed)}s linear infinite ${v.speed > 0 ? '' : 'reverse'}`;
            if(v.ping) set(ref(db, 'pingResponse2'), { t: v.ping });
        });
    </script>
</body>
</html>
