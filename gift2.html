<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    #master-container { width: 100%; height: 100%; transform-origin: top left; will-change: transform; }
    
    /* 負荷軽減のため、あえてflexboxではなくシンプルな絶対配置で負荷を減らす */
    #track { position: absolute; left: 0; top: 0; width: 8000px; animation: slide 20s linear infinite; will-change: transform; }
    .iframe-wrapper { width: 4000px; height: 698px; overflow: hidden; float: left; }
    iframe { width: 4000px; height: 1200px; border: none; pointer-events: none; }

    @keyframes slide { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-4000px, 0, 0); } }
</style>
</head>
<body>
    <div id="master-container">
        <div id="track">
            <div class="iframe-wrapper"><iframe src="https://app.streamtoearn.io/overlay/69a6f7873d008188b04a16b9"></iframe></div>
            <div class="iframe-wrapper"><iframe src="https://app.streamtoearn.io/overlay/69a6f7873d008188b04a16b9"></iframe></div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        const app = initializeApp({ apiKey: "AIzaSyBAhuhH2cbYFFHzlU2qU3J6ZZx5MUZG6rc", authDomain: "gift-list-app-53ef2.firebaseapp.com", projectId: "gift-list-app-53ef2", storageBucket: "gift-list-app-53ef2.firebasestorage.app", messagingSenderId: "161949465085", appId: "1:161949465085:web:3574bdee443e4fcec70194", measurementId: "G-B3PJELG3Q9" });
        const db = getDatabase(app);
        const container = document.getElementById('master-container');
        const track = document.getElementById('track');
        onValue(ref(db, 'settings2'), (snapshot) => {
            const data = snapshot.val() || {};
            if(data.size) container.style.transform = `scale(${data.size})`;
            if(data.speed !== undefined) {
                const absSpeed = Math.abs(data.speed);
                if (absSpeed === 0) { track.style.animation = 'none'; }
                else {
                    const duration = 100 / absSpeed;
                    track.style.animation = `slide ${duration}s linear infinite`;
                    track.style.animationDirection = data.speed > 0 ? 'normal' : 'reverse';
                }
            }
            if (data.pingRequest) set(ref(db, 'pingResponse2'), { time: data.pingRequest, status: "OK" });
        });
    </script>
</body>
</html>
